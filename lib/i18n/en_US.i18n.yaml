  welcome:
    title: Welcome to LMStory
    subtitle: You push forward, AI responds, the world grows.
    desc: Let AI become a true co-creator of your stories — not just a Q&A machine, but a long-term partner that genuinely remembers what happened.
  modes:
    title: Three modes, three ways to play
    subtitle: Tool, immersion, or direction — pick as you go
    chatTitle: Chat mode
    chatDesc: A freely configurable AI chat tool, much like ChatBox. Multiple sessions, branches, model switching, and a template system.
    storyTitle: Story mode
    storyDesc: Narrative immersion in serif prose. AI remembers the plot on its own; configure generation step by step for deeper replies. Its entry is hidden by default — turn it on in Story mode settings.
    directorTitle: Director mode
    directorDesc: You write the project rules; an AI showrunner works backstage — retrieving memories, maintaining the setting, and writing the prose. On by default; can be turned off in Settings.
