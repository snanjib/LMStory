# Director session creation wizard : home entry -> 3 steps -> ready session
directorWizard:
  # Home guide card (standalone emphasized row after the creation buttons, rendered in both compact and regular layouts)
  entryTitle: Director Mode Setup Wizard
  entryDesc: Not familiar with configuration? This wizard walks you into a director-mode session with ease
  # Stepper page common
  exit: Skip
  prev: Back
  next: Next
  finish: Done
  stepIndicator(current, total): "Step $current / $total"
  # Step titles (step bodies filled by later batches)
  modelStepTitle: Choose your chat model
  embeddingStepTitle: Embedding model
  rulesStepTitle: Project rules
  # Model step
  model:
    teach: "The model is this editor-in-chief's brain: you push the story forward, it writes the prose — all through this one model. Providers differ in style, temperament, and price. You can start with DeepSeek-flash — all it takes is one API key."
    introConfigured: Want a different editor for this story? Otherwise your default model is used — just go to the next step.
    pickerTitle: Pick the model that writes this story
    pickToast: The model for this story is set.
    changePen: Change the editor-in-chief
    selectedHintNew(model): "$model will write your story — you can switch anytime."
    selectedHintConfigured(model): This story will be written by $model.
    templateHints:
      deepseek: Direct access in China, fast, cheap — the value pick
      openai: The best known, richest ecosystem, mid-priced
      openrouter: One key for models from many providers, via an aggregator
      anthropic: Strong at long-form writing, pricier
      gemini: Made by Google, generous free tier
      nvidia: Free models to try, solid embedding models
      agnes: China-based aggregator — one key, many models
    pickProvider: Pick a provider
    applyKey: Get an API Key
    nameField: Name
    keyField: API Key
    createAndFetch: Create and fetch model list
    pickModel: Pick a model
    manualModelId: Enter a model ID
    useManual: Use this ID
    testConnection: Test endpoint connectivity
    noModelsYet: No fetched models yet. Fetch them in Settings, or connect a new provider here.
    addProvider: Connect a new provider
  # Embedding model step
  embedding:
    teach: "The embedding model governs how memories are found: with one, the world digs up the past by meaning — mention an old event in different words and it still surfaces; without one, recall matches keywords. It works without one too — the world just has a poorer memory."
    optionSetupTitle: Set one up (recommended)
    optionSetupDesc: Recall by meaning — stronger memory, sharper finds; adds a little to your model bill.
    optionSkipTitle: Skip for now
    optionSkipDesc: Keyword matching is good enough; set one up later in Settings anytime.
    currentCard(model): "Your director's memory currently runs on $model — it finds old events by meaning, accurately."
    optionKeepTitle: Keep as is
    optionKeepDesc: Change nothing and continue.
    optionChangeTitle: Switch
    optionChangeDesc: Pick a better fit from the providers you already have.
    pickSection: Pick an embedding model
    connectProvider: Connect a new provider
    embOnlyHint: "Only models typed as embedding are listed. If the list comes back empty, enter an ID — it will be tagged as embedding for you."
    manualEmbModelId: Enter an embedding model ID
    selectedEmb: Selected embedding model
  # Project rules step
  rules:
    intro: "Project rules are this world's laws — worldview, writing style, taboos, anything can go in; leave it empty and the AI will run a default playbook for you."
    pathTemplateTitle: Use a ready template
    pathTemplateDesc: Pick a ready set of world rules and start writing
    pathQuizTitle: Shape your own world
    pathQuizDesc: Three questions shape your world, then it's written for you
    backToPath: Go back
    quizOpening: Want to shape your world along the way? Just pick a rough direction — the AI handles the rest.
    quizHint: Pick one, or say it yourself; leave it blank and the AI decides.
    genreQuestion: What kind of world do you want to play in?
    genreCustomHint: Or describe your world in one sentence
    styleQuestion: What narration style do you like?
    styleCustomHint: Or describe the style you want
    personQuestion: Which point of view should the story use?
    personNone: Leave blank
    personNoneDesc: Let the model decide
    personFirst: First person
    personFirstDesc: Be the protagonist, told by "I" (I push the door open and the rain pours in)
    personSecond: Second person
    personSecondDesc: The world addresses you directly — most immersive (You push the door open and the rain pours in)
    personThird: Third person
    personThirdDesc: Objective narration, or you stay out of this world (He pushes the door open and the rain pours in)
    knowTitle: You have picked a direction for your world
    knowAssemble: Assemble now
    knowAssembleDesc: No model call, no credit spent — ready for your review right away.
    knowGenerate: Let the model write it
    knowGenerateDesc(model): A closer fit to your choices (especially what you wrote yourself); calls your model ($model) and spends a little credit.
    knowTail: Either way you get to review it first — redo or edit if you are not satisfied.
    confirmTitle(model): Have $model write your world rules
