    title: Set up your AI model
    subtitle: Any OpenAI-compatible provider works
    desc: LMStory ships without a built-in model — bring your own API key. OpenAI, DeepSeek, OpenRouter and more are supported, along with any custom OpenAI-compatible endpoint.
