  macroWiki:
    title: The macro summary mechanism
    intro: 'Story mode maintains two different kinds of long-range summaries: the cumulative compaction summary replaces the early verbatim conversation to keep the current context continuous, while the segmented macro summary condenses the run of events newly entering the compaction zone and joins retrieval as long-term memory.'
    overviewTitle: How micro and macro summaries relate
    overviewSubtitle: Several micro summaries aggregate into one macro summary
    diagramMicroLabel: Micro summary
    diagramMicroDesc: 1 per round
    diagramMacroLabel: Macro summary
    diagramMacroDesc: Aggregates multiple rounds
    diagramAggregateLabel: Aggregate
    triggersTitle: Compaction trigger and dual outputs
    triggersSubtitle: Both maintained together when the context threshold is reached
    trigger1Title: Cumulative compaction summary
    trigger1Body: When the request context reaches the configured compaction trigger line, the old compaction summary and the messages being compacted now are merged into a new cumulative summary, which later requests use in place of the early verbatim text.
    trigger2Title: Segmented macro summary
    trigger2Body: Later compactions also, in parallel, condense "the newly added compaction segment" into a standalone macro memory that joins retrieval; the first compaction can reuse the compaction summary directly to create the macro record.
    skipTitle: Don't mix up the two kinds of summaries
    skipBody: The cumulative summary answers "what has happened so far"; the segmented macro summary answers "what happened in this stretch". The former is a prefix of the current context; the latter is retrievable long-term memory.
    fallbackTitle: Failures and retries
    fallbackBody: Summary generation belongs to the compacting stage. On failure, use the Story mode failure bar to retry or cancel — never assume it silently returns to idle; persisted data is never overwritten without notice.
    uiTitle: UI behavior
    uiBody: When compaction triggers, the compacting/organizing-context feedback is shown; there is no separate "macro summary stage" panel anymore. Macro records can be viewed in the memory store and are injected when later retrievals hit them.
