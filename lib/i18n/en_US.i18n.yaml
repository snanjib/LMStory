    sidebarFooterDesc: New chat / New director / Settings; the story button is hidden by default; on mobile there is also a back-to-home button
    modeSwitchTitle: Switching modes
    modeSwitchCardTitle: Done through the home page entry cards
    modeSwitchCardBody: LMStory has no separate mode-switch widget. The home page entry cards are the mode switch — tap "New chat" for Chat mode, or "New director" for Director mode (on by default, can be turned off in settings). The Story mode entry is hidden by default; turn it on in Story mode settings, then use "New story" to enter Story mode.
  sessionOpWiki:
    title: Creating and switching sessions
  sessionOp:
    intro: A session is one independent conversation between you and the AI. You can create as many as you like; each keeps its own message history and settings without interfering with the others.
    flowTitle: Two ways to create a session
    flowSubtitle: Home page dual cards / sidebar new button
    diagramNewLabel: Tap New
    diagramNewDesc: New chat
    diagramDraftLabel: Type a message
    diagramDraftDesc: Write the first message in the input box
    diagramPersistLabel: Send
    diagramPersistDesc: The session is saved automatically once sent
    diagramOpsTitle: 6 actions on a session item
    opNew: New
    opRename: Rename
    opStar: Star
    opCopy: Duplicate
    opDrag: Drag to reorder
    opDelete: Delete
    operationsTitle: Everyday workflow
    operationsSubtitle: Full usage from creating to managing
    step1Title: Create a session
    step1Body: Tap the "New chat" button at the bottom of the sidebar, or the "New chat" card on the home page, to start a new conversation. New sessions copy the current global configuration by default (a snapshot of model and prompt).
    step2Title: Switch sessions
    step2Body: Tap any session in the sidebar to switch to it. Each session keeps its own scroll position and unsent draft, so switching never loses your context.
    step3Title: Rename a session
    step3Body: Open the three-dot menu on the right of a session item and choose "Rename" to change its title. Titles are also generated automatically by the AI after the first message is sent.
    step4Title: Star frequently used sessions
    step4Body: Choose "Star" from the three-dot menu. Starred sessions are pinned to the top of the list for quick access. Tap again to unstar.
    step5Title: Drag to customize the order
    step5Body: Press and hold the drag handle on the right of a session item (the ··· icon) and drag up or down to reorder sessions. The order saves automatically when you let go.
    step6Title: Duplicate and delete
    step6Body: The three-dot menu offers "Duplicate" and "Delete". Duplicating creates a new session containing all messages; deleting asks for confirmation to prevent accidents.
    searchTitle: Global message search
    searchBody: Tap the magnifier icon at the top of the sidebar (or press Ctrl+K) to open global search. Type keywords to search message content across all sessions; results show the source message directly, and tapping (or selecting with arrow keys and pressing Enter) jumps to and locates that message.
    platformTitle: Differences between mobile and desktop
    platformBody: On desktop the sidebar is pinned to the left and can be collapsed with the top button; on mobile it hides in a drawer you open with the hamburger menu in the top-left corner.
  messageFlowWiki:
    title: Sending messages and reading replies
  messageFlow:
    intro: Write in the input box and tap send; the AI streams its reply word by word while it thinks. You can interrupt at any time, quote earlier messages, or attach images.
    layoutTitle: The full send-and-reply flow
    layoutSubtitle: Type a message → AI streams its reply → read the result
    diagramInputLabel: The 4 parts of sending a message
    blockQuoteLabel: Quote preview
    blockQuoteDesc: Shown when quoting a message
    blockAttachLabel: Attachment preview
    blockAttachDesc: Image/file thumbnails
    blockInputFieldLabel: Message input
    blockInputFieldDesc: Grows up to 200 high for multi-line
    blockToolbarLabel: Toolbar
    blockToolbarDesc: Attachments + context + settings + model
    diagramStreamLabel: The 3 phases of an AI reply
    stream1Label: Tap send
    stream1Desc: Triggers the request
    stream2Label: Thinking
    stream2Desc: Shows a placeholder bubble
    stream3Label: Streaming word by word
    stream3Desc: The reply appears in real time
    inputTipsTitle: Ways to send a message
    tip1Title: Keyboard shortcuts
    tip1Body: By default Enter sends the message and Shift+Enter inserts a newline. You can switch to Ctrl+Enter to send in settings to avoid accidental sends.
    tip2Title: Keep typing while generating
    tip2Body: The input box stays available while the AI replies, so you can draft your next message in advance. Only the send button is temporarily disabled to prevent double sends.
    tip3Title: Quoting a reply
    tip3Body: Tap the "Quote" button on any message and its content appears as a quote preview above the input box. When you send, the quote is automatically attached in front of your message so the AI knows which message you are replying to.
    streamTitle: The streaming reply experience
    streamBody: After you send, the AI's reply appears in the bubble letter by letter, like a real person typing. A stop button is shown while it streams — tap it to interrupt anytime. If you change your mind afterwards, tap "Continue generating" on your message to have the AI finish what it was writing. If an error occurs, the error message stays on the assistant message card and is never lost.
  messageActionsWiki:
    title: Message actions
  messageActions:
    intro: Tapping any message bubble shows its action buttons; tap again or wait 3 seconds and they auto-hide. The buttons on the last AI reply always stay visible for quick access.
    bubbleTitle: Message bubbles and action buttons
    bubbleSubtitle: 6 actions + visibility rules
    diagramBubbleTitle: Message bubble structure
    userBubbleLabel: User message bubble
    assistantBubbleLabel: Assistant message bubble (with action button row)
    opCopy: Copy
    opEdit: Edit
    opRegenerate: Regenerate
    opContinue: Continue generating
    opQuote: Quote
    opDelete: Delete
    diagramStrategyTitle: Button visibility rules
    diagramStrategyDesc: Tap a message to toggle show/hide; auto-hides after 3 seconds (the last AI reply's buttons always stay visible).
    opsTitle: The 6 actions explained
    op1Title: Copy
    op1Body: Copies the raw message text to the clipboard, ready to paste into other apps.
    op2Title: Edit (user messages only)
    op2Body: Change a message you sent earlier. The reply is regenerated from the new content, and the original reply is kept as a branch you can browse with the left/right arrows.
    op3Title: Regenerate (assistant messages only)
    op3Body: Has the AI write a new reply. The original is kept as a branch; browse the versions with the left/right arrows.
    op4Title: Continue generating (user messages only)
    op4Body: If the AI's earlier reply was interrupted or unfinished, tap this to have it continue from where it stopped.
    op5Title: Quote
    op5Body: Attaches the message as a quote in front of your next message so the AI knows which message you are replying to. The quote preview appears above the input box and can be closed anytime.
    op6Title: Delete
    op6Body: Deletes this message and the branches after it. Deletion asks for confirmation to prevent accidents.
    forkTitle: How branches work
    forkBody: Editing a user message or regenerating creates a branch. The branch indicator shows the current position such as "2/3"; tap the left/right arrows to browse versions — the originals are never lost.
  messageNavWiki:
    title: Message navigation
  messageNav:
    intro: Scrolling through long conversations is a hassle, so 4 floating buttons help you jump to the start or end of the conversation or to the next user message. They auto-hide 2 seconds after scrolling stops so they never block content.
    buttonsTitle: 4 floating buttons + auto-hide
    buttonsSubtitle: Double arrows jump to the ends / single arrows step through messages
