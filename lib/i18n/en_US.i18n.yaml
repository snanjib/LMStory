  flow:
    overviewTitle: Overall flow
    overviewSubtitle: Each round runs 6 stages in order
    intro: 'In Story mode, each round does 5-6 things in order: extract keywords → retrieve memories → generate content → (optional review stage) → generate summary → persist to storage. By default that is 3 AI requests + 1 local retrieval + 1 vectorization; enabling the review stage makes it 4 AI requests.'
    metaphorTitle: Understanding it through a newsroom metaphor
    metaphorSubtitle: Picture Story mode as a newsroom's novel-writing workflow
    step1Title: Extract keywords
    step1Input: Your message + recent conversation + extraction prompt
    step1Output: 5 keyword categories (character/item/location/action/plot)
    step1Points:
    - '"Character/item/location" — 3 entity-word categories matched exactly via FTS5 (e.g. "Li Xiaoyao", "ancient stele", "Mount Shu")'
    - '"Action/plot" — 2 experience-word categories matched semantically via vectors (e.g. "slaying demons", "the inscription reveals itself")'
    - Keywords are retrieval query conditions, not memories stored in the database
    step2Title: Retrieve memories
    step2Input: The 5 keyword categories from step 1
    step2Output: Experience-summary memories + factual memory retrieval results
    step2Points:
    - Purely local operation, no AI call, fast
    - '5 parallel retrieval lanes: the 3 character/item/location categories go through exact FTS5 matching, the 2 action/plot categories go through vector semantic matching'
    - The experiential layer keeps at most 12 entries after merging; key entities are judged by importance ≥5 by default, and how many facts get injected is controlled by configuration
    step3Title: Generate content
    step3Input: Your message + character setup + recent conversation + retrieved memories
    step3Output: A generated draft reply
    step3Points:
    - Since v0.2.2 the generation stage injects retrieved memories + factual memories + the compaction summary, so generation quality is assured on its own
    - The AI "pretends to be running a normal roleplay" — the prompt never says "this is generated content", which keeps the AI from slacking off
    - Shown in the "Generation panel" at the top of the screen, with the prose streaming live alongside
    step4Title: Review stage (optional)
    step4Input: Generated content + retrieved memories + factual memories
    step4Output: Final reply prose
    step4Points:
    - Off by default since v0.2.2 (the draft becomes the final reply, saving 1 AI call); can be enabled manually in settings
    - 'The AI first reviews the draft in 3 sections: factual consistency / narrative quality / AI flavor (the checklist covers 8 patterns)'
    - Then rewrites the final reply based on the review — fixes errors if there are any, polishes if not — streamed into the main chat area
    step5Title: Generate summary + extract facts
    step5Input: Final reply + your message
    step5Output: 5W1E event summary + fact-change deltas
    step5Points:
    - Calls two tools in parallel (event summary tool + fact change tool)
    - 'Event summary: 5W1E six fields + absolute narrative time + importance + tags'
    - 'Fact changes: create entity / update attribute / add alias (an empty array when nothing changed)'
    step6Title: Persist to storage
    step6Input: Reply + summary + fact deltas + embedding
    step6Output: Core records and optional indexes written
    step6Points:
    - Messages, experiential memories, round artifacts and session metadata are written in one local transaction
    - Low-importance memories may skip the vector/full-text indexes; a single invalid fact change is skipped without blocking the core experiential pipeline
    - Switch to another session and back — the generated content and retrieval results are still visible
    visualFlowTitle: What you see on screen
    visualFlowSubtitle: 4 collapsible mini panels + 1 main reply area (the compaction panel appears when triggered)
    visualFlowCompactingName: Compaction panel (optional)
    visualFlowCompactingDesc: 'Appears when triggered: compacting conversation history…'
    visualFlowNode1Name: Extraction panel
    visualFlowNode1Desc: Analyzing…
    visualFlowNode2Name: Retrieval panel
    visualFlowNode2Desc: Recalling…
    visualFlowNode3Name: Generation panel
    visualFlowNode3Desc: Generating… (generated prose streams live)
    visualFlowNode4Name: Main reply
    visualFlowNode4Desc: The final reply streams here
    visualFlowNode5Name: Summary panel
    visualFlowNode5Desc: Summarizing…
    visualFlowNode6Name: Persistence panel
    visualFlowNode6Desc: Saving this round's results…
    overview:
