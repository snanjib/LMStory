  directorModeWiki:
    title: What Director mode is
  directorMode:
    intro: 'Director mode is a third way to play: you write the "project rules", and the AI showrunner autonomously retrieves memories, maintains settings and writes the prose backstage — the only finished product you see is the novel''s prose, with all the preparation tucked backstage.'
    diagramTitle: The loop of one round of director work
    diagramSubtitle: You advance → backstage work → prose → the world settles
    loopYouLabel: You advance
    loopYouDesc: Send a directive or an opening line
    loopBackstageLabel: Showrunner works backstage
    loopBackstageDesc: Reviews earlier events, verifies settings, logs the scene…
    loopOutputLabel: The prose
    loopOutputDesc: The only onstage content
    loopWorldLabel: The world settles
    loopWorldDesc: Facts and experiences enter the memory store
    vsTitle: Choosing against the other two modes
    vsChatTitle: Chat mode = you chat with the AI
    vsChatBody: Question and answer; good for tasks and everyday conversation; no world memory settles.
    vsStoryTitle: Story mode = you and the AI play scene partners
    vsStoryBody: You write a line, the AI continues a stretch; memory settles automatically; you personally drive the plot.
    vsDirectorTitle: Director mode = the AI holds the pen, you direct
    vsDirectorBody: You set the rules, you steer, you vet the writes; the AI showrunner writes the prose.
    experimentTitle: On by default
    experimentBody: Director mode is on by default. The home page has a "New director" entry; you can turn the toggle off anytime under "Settings → Director mode settings" — existing Director sessions are unaffected.
  directorFirstWiki:
    title: Creating a Director session
  directorFirst:
    intro: 'Three steps to start: confirm Director mode is on (on by default) → create → write the rules and go.'
    flowTitle: Creation flow
    flow1Label: Confirm Director mode is on
    flow1Desc: On by default; if off, turn it on at Settings → Director mode settings
    flow2Label: Create a Director session
    flow2Desc: Tap the "New director" card on the home page
    flow3Label: Write project rules
    flow3Desc: Top-right settings → Project rules (or pick straight from a template)
    rulesTitle: What to write in project rules
    rulesBody: 'Resident background rules: worldview, characters, writing style and narrative principles. Effective for the whole session and never rewritten by the AI. For example: "A low-magic wuxia world, austere and restrained prose; the protagonist is an out-of-work escort; every act ends with an unresolved piece of foreshadowing".'
    startTitle: The opening
    startBody: Just send the first line, e.g. "The escort agency went under; I'm counting my last copper coins under the city gate". The director will conceive and deliver the prose itself; while waiting for the first character you'll see a "The director is conceiving…" heartbeat hint.
  directorWatchWiki:
    title: 'Supervision mode: asks and approvals'
  directorWatch:
    intro: 'Supervision mode lets you vet every write to the "story canon" item by item: before the director changes settings or records major events, a card asks you first.'
    diagramTitle: The approval flow of one write
    diagramRequestLabel: The director wants to write
    diagramRequestDesc: e.g. "revise the setting collection" or "record into the chronicle"
    diagramCardLabel: A confirmation card pops
    diagramCardDesc: Shows the content to be written, waiting for your choice
    diagramAllowLabel: Allow
    diagramAllowDesc: The write takes effect; work continues
    diagramDenyLabel: Deny
    diagramDenyDesc: Skips this write; work continues
    askTitle: Ask director
    askBody: 'At forks that need your call (like "does the villain surrender or flee now?"), the director proactively pops a "Director decision" card: you can type an answer, or "Skip" to let it decide. The card header has a countdown (ticking once a minute): with no response before it expires, it decides on its own; set "Ask-wait timeout" to 0 (always wait) in settings and the card will wait for you indefinitely without adjudicating itself. Approval cards likewise show a countdown, but a timeout counts as a denial (the safe default, not disableable).'
    toggleTitle: The toggle and its cost
    toggleBody: 'Supervision mode is toggled in Director session settings. On: every write pauses for your confirmation — the strictest vetting, but generation stops frequently. Off: writes execute automatically and the prose flows unbroken. Turn it on when you want to vet canonical changes item by item. "Always allow for this session" on an approval card remembers your clearance for a tool, so the same tool stops popping cards for the rest of the session; to take it back, tap "Clear session allows" in the "Supervision & tools" section of session settings (it also expires automatically when the session closes).'
  directorProcessWiki:
    title: 'Reading the process: onstage and backstage'
  directorProcess:
    intro: The story is the final result; preparation lives backstage. The active title shimmers, or uses a static indicator with reduced motion, and identifies waiting, thinking, tool execution, and saving. Collapsed live reasoning shows its last three visual lines; settled reasoning is fully hidden. Expand it in a bounded reading window; scrolling up pauses following. Backstage output is labeled separately from reasoning and the story. Intermediate speech stays backstage in arrival order from its first update. Explicit prose appears in the story area; plain-text fallback moves there only after final delivery is confirmed. Each round has its own timer, which restarts on regeneration. After a successful round, warning and error cards fold with the backstage group and remain available when expanded. Active or interrupted rounds keep those cards visible.
    diagramTitle: Onstage and backstage
    stageLabel: Onstage
    stageDesc: Prose + one process line ("Reviewing earlier events… · step 3")
    backstageLabel: Backstage
    backstageDesc: Tap the backstage summary row (or the right arrow) to expand the per-step work cards
    verbsTitle: The "lines" on backstage work cards
    verbsBody: 'Work cards use stage verbs to show what each step does: review earlier events (dig up old happenings), search original text (find saved text by keyword), reread the original text (re-read the prose), verify settings (check facts), reread the mainline (go over summaries), revise the setting collection (change settings), merge settings (combine duplicate entries), record into the chronicle (log events), log the scene (note the current position), consult the handbook (check writing methods), dispatch a subagent (assign a small task), ask the director (get your call), bring down the curtain (deliver the draft).'
    costTitle: Cost hint
    costBody: The small ring by the input box shows how far the current context is from auto compaction; tap it for window usage, cache hit rate and the last round's request consumption, and to manually compact now — with a stable prefix, input costs drop to roughly a tenth.
  directorLogWiki:
    title: Event log and recovery
  directorLog:
    intro: Every step the director takes is recorded in the "event log" — even if the app crashes or the power cuts, reopening picks the writing back up with no progress lost.
    diagramTitle: How recovery happens
    diagramWorkLabel: Working
    diagramWorkDesc: Every step logged in real time
    diagramCrashLabel: Unexpected exit
    diagramCrashDesc: Crash, power loss, or killed by the system
    diagramRecoverLabel: Recover on reopen
    diagramRecoverDesc: Progress restored from the log; writing continues
    recapTitle: Interlude recap card
    recapBody: 'Every stretch of plot yields a "book spine"-styled recap card: which act, the current arc, and foreshadowing pending and resolved. It''s the plot''s milestone — a quick look back at where the story stands; the latest act''s recap card has an "Edit" entry when expanded (arc/narrative time/full foreshadowing list), sharing the same data source as the AI''s scene log, while historical acts are read-only. Additionally, every few rounds (default 8, adjustable in Director settings) a "foreshadow sweep" runs: round-end reminders of the unresolved list, and the sweep round''s submission is gated once by the final-review reminder — cross out resolved items or confirm before it passes.'
  directorFailureWiki:
    title: Failures and retries
  directorFailure:
    intro: A director round walks many steps, and any step can fail. Failure never corrupts data — memories landing in the store is the reward for a fully successful round; a mid-round failure writes nothing broken.
    diagramTitle: What failure looks like
    diagramFailLabel: Failed-step card
    diagramFailDesc: Two states, red/yellow — failures that interrupt the round are red, failures already rescued by auto retry are yellow; one-tap copy for feedback
    diagramRetryLabel: Failure-bar retry
    diagramRetryDesc: Rerun this round from the failure point
    retryTitle: What happens on retry
    retryBody: Small hiccups are auto-retried a few times; if it still fails, it stops and waits for you. "Retry round" reruns the whole round of director work from scratch, while "Continue from interruption" reuses what this round already produced (text already written and tool steps already done are kept instead of re-billed) and only falls back to a full rerun when nothing can be resumed. Completed rounds and memories are unaffected. Common failure causes are network timeouts, model quota or configuration problems — check the model configuration in session settings first, then the failure history on the diagnostics page. Director first-response and non-streaming completion deadlines default to 10 minutes each and can be adjusted in General settings; expiry is not retried automatically. Non-streaming waits for the complete response. Stop ends local waiting, although the provider may continue inference.
  directorSettingsWiki:
    title: Director session settings
  directorSettings:
    intro: 'Director mode''s settings live on two levels — the global "Director mode settings" page (Settings → Director mode settings, including the mode toggle) and the session panel (top-right of the session page, 8 collapsible sections: Memory management/Project rules/Models & generation/Narrative pacing/Supervision & tools/Budget/Context and compaction/Character cards/Worldbooks; Project rules moved to 2nd, Character cards/Worldbooks last). Items not adjusted within the session use global values; once adjusted, the reset button writes the current global value into that field as a snapshot (the two no longer affect each other afterwards).'
    settingsTitle: Key settings
    modelTitle: Main model
    modelBody: The model the director uses for autonomous execution; defaults to the global "Generate" model when not individually configured. When you want the director on a stronger model while everyday chat runs on a cheap one, specify it here. The vectorization model is configured separately (Retrieval and memory section).
    rulesTitle: Project rules
    rulesBody: Resident background rules, effective for the whole session; pick one straight from the template library to start fast.
    pacingTitle: Narrative pacing
    pacingBody: Three levels (Conservative/Balanced/Aggressive) control the narrative's shot scale — Conservative favors fine detail and slow pushes, Aggressive favors fast-forward strides. The global setting picks the default, switchable per session; only Aggressive requires the prose be written full and complete, while Conservative/Balanced lengths follow the narrative rhythm (adjusted 2026-09-08).
    budgetTitle: Budget (steps and time)
    budgetBody: The maximum steps and time the director may run autonomously per round. Hitting the top of any budget (steps/time/cumulative consumption/context headroom) never hard-stops — a wrap-up instruction is injected first so the director can bring down the curtain with the material at hand before stopping; steps can also be "unlimited" (the other protections stay). Of these, "cumulative consumption" and "context headroom" are engine-built protections (a default 60%-of-window cost line and an in-round 85% survival line) that don't appear on the settings surface.
    watchTitle: Supervision and tool permissions
    watchBody: 'With supervision mode on, every write pops a confirmation card; each tool can independently be set to a three-state Allow/Ask/Disable (disabled tools are invisible to the director). See "Supervision mode: asks and approvals".'
    contextTitle: Context and compaction
    contextBody: 'The small ring by the input area shows context usage (full scale = context compaction threshold); tap to open the detail panel for window usage/cache hit rate/the last round''s breakdown, and "Compact now" once the conversation is long enough; the compaction summary card, expanded, offers "Undo compaction" to restore the archived conversation. Context has a single knob, "Context compaction threshold": when history usage reaches that share of the effective window (the smaller of the model window and the window cap), compaction runs automatically before the next round; the effective token value shows beside the percentage, or you can type tokens directly to back-compute the percentage. Two more engine-built protections sit off the settings surface: a forced wrap-up when in-round context hits the 85% survival line, and a soft landing for per-round cumulative consumption on a cost basis (a separate ledger from how much got loaded). The window cap lives in the "Advanced: window cap" fold — 0 = auto (use the model window); you only need to declare it manually when the model''s registration is inaccurate or to dodge TPM rate limits.'
    suggestReplyTitle: Suggested replies
    suggestReplyBody: 'The model and parameters for the input box''s "Suggest" button live in the suggested-reply group of the "Models & generation" section: suggested model (blank uses the Director main model), prompt, temperature, generation cap, candidate count (how many to generate at once) and per-item maximum length (per-item length controlled at the prompt level).'
    memoryTitle: Memory store entry
    memoryBody: Settings also has a "Memory store" section for browsing, searching and manually editing this session's memories — the same memory store shared with Story mode. The session panel's "Memory management" section also has "retrieval strictness" in three levels (Conservative/Balanced/Loose) controlling how much the director dredges up and how strictly it picks when going through old accounts; selecting one writes that level's concrete values into this session, and the two no longer affect each other afterwards.
  resourceLibraryWiki:
    title: Character cards and worldbooks (resource library)
  resourceLibrary:
    intro: 'Character cards and worldbooks are the world''s "seeds": import settings you''ve collected elsewhere into LMStory and apply them to a session to join the world''s operation — but they aren''t a ticket required to start; you can just as well bring nothing and start from zero.'
    diagramTitle: From import to growth
    seed1Label: Import
    seed1Desc: Settings → Character cards/Worldbooks
    seed2Label: Apply
    seed2Desc: Session settings → Character cards/Worldbooks section (same in Story/Director)
    seed3Label: Read-only seeds take effect
    seed3Desc: Settings join the world's operation as a baseline
    seed4Label: Grow alongside new facts
    seed4Desc: Facts the world learns keep accumulating as usual
    formatsTitle: Supported formats
    formatsBody: 'Character cards: SillyTavern-compatible PNG cards (V1/V2/V3) and plain JSON cards; worldbooks: JSON files with top-level entries (a character_book embedded in a card is also supported). On mobile you can also import directly via the system "Open with/Share".'
    readonlyTitle: What read-only means
    readonlyBody: 'Applied settings serve as a read-only baseline: no rewriting, no deleting; the AI''s in-story changes coexist as separate "evolved" entries, and you can tell baseline from evolved in the memory store. Unapply anytime to remove them wholesale.'
    dupTitle: Same-name notice
    dupBody: When the session already has a character with the same name, applying is refused with a notice — avoiding duplicates or overwrites; rename or tidy up the existing content first. Same-named worldbook entries are silently skipped (the apply count excludes skipped entries); tidy up same-named entries first if you need to overwrite.
    aiTitle: AI card building
    aiBody: 'You can start without any ready-made card or book: from the resource library page (Settings → Character cards/Worldbooks), enter AI card building, describe the character or world you want in conversation, and the AI drafts and revises per your feedback; you can also launch an AI edit on an existing resource. Drafts are confirmed in the preview panel and then saved to the library (save as a new resource or overwrite the original, with a confirmation guard before overwriting). What gets applied to a session is the snapshot from apply time; later changes in the library don''t affect sessions already applied to. Exiting with an unsaved draft is intercepted with a confirmation so a slip never loses it.'
