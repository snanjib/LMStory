    btnJumpTop: Jump to top
    btnJumpTopDesc: Double arrow up · jump to the earliest message
    btnPrevUser: Previous user message
    btnPrevUserDesc: Single arrow up · step to the previous user message
    btnNextUser: Next user message
    btnNextUserDesc: Single arrow down · step to the next user message
    btnJumpBottom: Jump to bottom
    btnJumpBottomDesc: Double arrow down · jump to the latest message
    diagramHideTitle: Auto-hide timeline
    timeline1: Scrolling
    timeline2: Scrolling stops
    timeline3: Auto-hides after 2 seconds
    opsTitle: What the 4 button icons mean
    btn1Title: Jump to top (double arrow up)
    btn1Body: Quickly return to the earliest message in the conversation. Handy for checking how the conversation began.
    btn2Title: Previous user message (single arrow up)
    btn2Body: Jump to the previous message you sent. Makes retracing your earlier questions much faster than scrolling by hand.
    btn3Title: Next user message (single arrow down)
    btn3Body: Jump to the next message you sent. Good for skimming the question-answer rhythm and skipping long AI replies.
    btn4Title: Jump to bottom (double arrow down)
    btn4Body: Quickly return to the latest message. Works while the AI streams, so you can jump back to watch it generate live.
    hideTitle: The auto-hide mechanism
    hideBody: The floating buttons auto-hide 2 seconds after scrolling stops so they don't cover message content. They reappear instantly when you scroll again. The buttons are semi-transparent to reduce visual noise.
    searchTitle: In-session search
    searchBody: 'Beyond the floating buttons, you can also find messages by content: open "In-session search" from the top-right menu or with Ctrl+F (Cmd+F on macOS), and press Esc to collapse it. Hit counts show as you type; Enter / Shift+Enter jump between the previous and next hit, and the located message flashes a brief highlight. Search only matches messages visible on the current branch; hits re-filter when you switch branches.'
  sessionSettingsWiki:
    title: Session settings
  sessionSettings:
    intro: Every session can configure its own model, prompt, temperature and more. Fields you have never overridden follow a snapshot of the global values taken the moment you opened the session (later global changes don't affect it); once overridden, the session value wins.
    priorityTitle: Configuration priority
    prioritySubtitle: Session-level config > global defaults
    diagramPriorityTitle: Configuration priority
    level1Label: Session level
    level1Desc: Individual config wins
    level2Label: Global defaults
    level2Desc: Configured centrally on the settings page
    level3Label: Built-in defaults
    level3Desc: Factory values
    diagramSectionsTitle: Session settings has 4 sections
    sectionModel: Model and provider
    sectionModelDesc: Choose the API provider and model
    sectionPrompt: Prompt
    sectionPromptDesc: System prompt + templates
    sectionGen: Generation parameters
    sectionGenDesc: Temperature + Top P + penalties
    sectionContext: Context window
    sectionContextDesc: Maximum context messages
    levelsTitle: How the priority levels work
    level1Title: Session level (highest priority)
    level1Body: Values configured individually in session settings override the global defaults. Ideal when one session needs a different model or temperature.
    level2Title: Global defaults
    level2Body: Configured centrally under "Settings" → "Chat mode settings" → "Default configuration"; every new session uses these values. Changing the global defaults does not affect sessions you have already opened or individually configured (their values are snapshots written when opened).
    level3Title: Built-in defaults
    level3Body: If you have never configured anything, the app uses sensible built-in defaults, such as a chat temperature of 0.7 and Top P 1.0.
    resetTitle: Reset to current global value
    resetBody: Every session-level setting has a reset button next to it; tapping writes the current global value into that field (as a snapshot — the two no longer affect each other afterwards). To manage all sessions uniformly, prefer configuring global defaults and override at the session level only when necessary.
  compactionFlowWiki:
    title: Context management and compaction
  compactionFlow:
    intro: Conversations that grow too long exceed what the AI can hold in memory. LMStory automatically compacts the early conversation at the right moment — generating a summary that replaces the old messages so the AI keeps the key information without overloading. Chat mode uses the CompactionPoint strategy, triggered automatically by a token threshold (described on this page); Story mode uses a three-part budget (summary prefix + verbatim zone + retrieval zone) whose verbatim cap is dynamically controlled by the compaction trigger line — see "How Story mode works → Context budget".
    flowTitle: How compaction happens
    flowSubtitle: Auto trigger + streaming summary generation
    diagramTriggerTitle: When compaction happens
    diagramThresholdFormula: Triggers automatically as the conversation approaches the model's limit (limits differ per model)
    diagramFlowTitle: The 4 steps of compaction
    flow1Label: Send a message
    flow1Desc: The system checks conversation length
    flow2Label: Near the limit
    flow2Desc: Compaction triggers automatically
    flow3Label: Generate summary
    flow3Desc: The AI summarizes the early conversation
    flow4Label: Replace context
    flow4Desc: The summary replaces old messages
    triggerTitle: When compaction is triggered
    triggerBody: 'When the accumulated conversation length approaches the current model''s limit, the next message you send triggers compaction automatically. Limits differ by model, from 8K to over 1M. The small ring on the left of the input area is the usage indicator: full scale is the compaction trigger line; open its details to see window usage, cache hit rate and the last round''s token breakdown. If you''d rather not wait, compact early from the session menu''s "Manual compaction" or the detail panel''s "Compact now"; afterwards the summary card also offers "Undo compaction" to restore the original text.'
    stepsTitle: What you see after compaction
    step1Title: A summary message appears
    step1Body: When compaction finishes, a specially styled "Summary" message appears in the conversation — the AI's digest of the early chat, covering what was discussed, key decisions, what's in progress and so on.
    step2Title: The summary can be expanded and edited
    step2Body: The summary message is collapsed to its title by default; tap to expand and read the full content. If you're not happy with it, edit it, or delete it and regenerate.
    step3Title: The conversation continues unaffected
    step3Body: After compaction you can keep chatting normally. The AI continues from the summary + latest messages and won't feel any break in context.
    failedTitle: What if compaction fails
    failedBody: Compaction can fail due to network problems or model overload. A "Compaction failed" card appears; tap "Retry" to trigger compaction again. The failure doesn't affect the existing conversation — you can keep sending new messages and the system will retry compaction on the next send.
  memory:
    intro: Story mode's core capability is "memory" — it genuinely remembers what happened before. But rather than storing whole rounds of conversation as memory, Story mode distills each round into structured data before saving. Memories come in two kinds, classified by "nature of content", not layered by time.
    twoTypesTitle: 'Two kinds of memory: diary vs character sheet'
    twoTypesBody: 'Experiential memories are like a diary — "that evening the hero went to the ancient stele" — what happened, happened; it is remembered forever and never changes. Exactly 1 is generated per round. Factual memories are like a character sheet — "the hero''s level is 5" — something that can change: next round it rises to 6, so 5 is rewritten to 6 and the old value goes to the audit log.'
    experientialTitle: 'Experiential memories: the plot diary'
    experientialBody: 'Stored in the experiential_memories table, append-mostly. Each round''s event micro summary contains 5W1E, narrative time, importance, tags and retrieval data. When the conversation reaches the context compaction threshold, the system maintains two different outputs at once: the cumulative compaction summary replaces the early verbatim text and continues the current context, while the segmented macro summary condenses the newly compacted run of events and joins long-term retrieval as a macro memory. The first compaction can reuse the compaction summary directly to create the macro record.'
    factualTitle: 'Factual memories: the character sheet'
    factualBody: Stored across three tables — entities, attributes and audit history — using upsert rewrites plus an audit log. The current entity types are character, location, item, lore, organization and misc; pets and NPCs count as characters, and world rules count as lore. Each entity has one main record, each attribute is isolated by entityId, and old values go into audit history. This reduces cross-instance bleed, setting drift and broken renames.
    retrievalTitle: What content gets vectorized for retrieval?
    retrievalBody: 'On write: the AI-distilled "5W1E 6-field summary" is what gets vectorized — not keywords, not the full round''s prose. The concatenation format is "time: xxx location: xxx character: xxx event: xxx significance: xxx extra: xxx", with empty fields omitted. That text is then sent to the embedding API and turned into a vector. Why not vectorize the whole round''s prose? Because prose is long and full of irrelevant information (small talk, action description, inner thoughts) that dilutes the semantic focus. The AI-distilled summary already captures "what actually happened this round", so its vectorization quality is higher. Exception: macro summaries (macro_summary) keep using the single summary field for vectorization, not the 5W1E format.'
    retrievalQueryTitle: What is used as the query at retrieval time?
    retrievalQueryBody: 'The keywords extracted in step 2 — not your original message and not the full round''s prose. Retrieval runs 5 parallel lanes: character/item/location keywords go through exact full-text matching (one lane each); action/plot keywords go through vector semantic matching (concatenated, sent to the embedding API, then matched to the nearest historical memories by vector distance; a lane is skipped automatically when its category is empty). Why keywords rather than your original message? Because your message can be long ("I walked up to the ancient stele, studied the patterns on it carefully, and suddenly the inscription revealed itself — I jumped"), full of incidental actions. Extracted keywords focus on core elements like "ancient stele, back hill, inscription", giving higher retrieval precision.'
    factualGuardTitle: Triple guard on the factual layer
    factualGuardBody: 'To stop the AI from mangling facts, writes pass three guards. Guard 1: prompt constraint "prefer appending; only modify on conflict" — stops the AI from mislabeling "append new skill" as "modify skill list". Guard 2: code check — a modification is allowed only when the key already exists and the value truly differs — stops the AI from mislabeling an "append" as a "modify". Guard 3: key attributes (importance ≥4) require confidence ≥4 to modify — prevents low-confidence edits from overwriting important settings.'
    factualHealthTitle: 5-layer health protection
    factualHealthBody: 'To keep attributes from bloating, 5 layers of protection. Layer 1: attribute schema whitelist — stops the AI from inventing attributes for characters (like giving a dog an "education"). Layer 2: prompt constraint "temporary state ≠ fact" — stops "Wangcai seems tired today" from being stored as a fact. Layer 3: system-level deduplication (edit distance / containment) — stops the same attribute from being added repeatedly. Layer 4: at most 4 updates per entity over the last 3 rounds — stops the AI from churning the same attribute. Layer 5: values capped at 500 characters — stops attribute values from growing without bound.'
    factualChangePanelTitle: This round's fact changes
    factualChangePanelBody: 'After each round generates, a "factual layer changes" mini panel appears after the summary panel, listing what this round did to the factual layer: which entities were created, which attributes were updated (with before and after values), what was appended, and who was archived. Tap an item for full details. If a round truly made no fact changes, a "No fact changes this round" placeholder is shown instead, so you always know whether the memory store changed.'
    vectorizationThresholdTitle: Memory retrieval thresholds
    vectorizationThresholdBody: 'Not every memory can be retrieved. The system grades memories by importance (1-5): below the "storage index threshold" (default 3) a memory gets no index (unretrievable); at or above the "vectorization threshold" (default 4) it gets a semantic vector and supports fuzzy meaning-based lookup; in between, only exact keyword matching works. If you feel some importance-2 memories are valuable and should be retrievable, set both thresholds to 2 under "Settings → Story mode settings → Tools and memory" (that page is visible with "Config display mode = Advanced"; the config display mode toggle sits at the bottom of Settings → General and defaults to Simple).'
  failure:
    intro: 'Each Story mode round fires 3 AI requests + 1 local retrieval + 1 vectorization by default (4 AI requests with the review stage enabled). More calls means a higher chance of failure. But Story mode''s failure handling has one core principle: all or nothing. For a quick reference of common error codes and scenario troubleshooting, see: Appendix → Troubleshooting FAQ.'
    atomicityTitle: 'Core principle: the atomic transaction'
    atomicityBody: 'Each round is an atomic transaction — extract → retrieve → generate → review → summarize → persist — that either fully succeeds or fully fails. Key distinction: data rollback ≠ UI clearing. On failure nothing is written to the database (the transaction rolls back). But the UI keeps the intermediate artifacts already shown (generated content, retrieval results, the half-written reply) so you can see which step failed. No quality degradation: the generated draft is never passed off as the final reply, and retrieval is never silently skipped.'
    retryTableTitle: How failures in each stage are handled
    retryTableBody: 'Generation failure: retried twice; if it still fails, the whole round fails and is handed to you. Keyword extraction failure: retried twice; if it still fails, the whole round fails and is handed to you. Both retrieval lanes fail: retried once; if it still fails, the whole round fails and is handed to you. One retrieval lane fails: no retry; continues with the other lane''s results. Review failure: retried twice; if it still fails, the whole round fails and is handed to you. Summary failure: retried twice; if it still fails, the whole round fails and is handed to you. Vectorization failure: retried once automatically; if it still fails, you choose — retry the whole round / temporarily fall back to keyword retrieval / clear this round (plus continue from where it stopped). Persistence failure: no retry; the transaction rolls back and the whole round fails.'
    uiRetentionTitle: What the UI keeps on failure
    uiRetentionBody: 'You can see which step failed: generation failure → the generation panel (with the partial generated content already shown). Extraction failure → generation panel + extraction panel. Retrieval failure → generation/extraction panels + retrieval panel. Review failure → the partial reply + completed generation/extraction/retrieval panels. Summary failure → the complete reply + generation/extraction/retrieval panels + summary panel. Persistence failure → the complete reply + all intermediate artifact panels. Every failure case shows the same things: a failure notice + the failure bar (offering action buttons by failure type). The input box still accepts typing on failure; only the send button is disabled — you must tap "Retry whole round" or "Clear this round" to return to idle before you can send a new message.'
    manualRetryTitle: What each failure-bar button does
    manualRetryBody: 'The failure bar shows action buttons based on the failure type: "Retry whole round" — clears all intermediate artifacts shown so far, keeps your message, and reruns the full six-step round from scratch (it does not resume from the failed step, because partially generated artifacts could leave the state inconsistent if it did); "Continue from interruption" — keeps the completed stages'' outputs (generated content, retrieval results) and retries from the failed stage, saving the earlier AI calls when the failure happened late in the round; "Continue writing" — appears when generation failed with a partial draft on hand; keeps generating from the partial draft without repeating what exists; "Accept as final" — appears when generation/review failed and the partial draft is usable; makes the partial draft this round''s final text and proceeds through summary and persistence as usual; "Temporarily fall back to keyword retrieval" — shown only for E104 embedding-model call failures; skips vector retrieval and continues this round (FTS5 keyword retrieval still runs); "Clear this round" — clears all intermediate artifacts and puts your message back into the input box so you can edit and resend it.'
    factualFallbackTitle: Special failure fallbacks on the factual layer
    factualFallbackBody: 'The factual layer handles failures differently from the experiential layer. Retrieval stage (never blocks): the factual-layer retrieval code is fully wrapped in try-catch; any exception returns an empty result instead of throwing. Even if factual retrieval breaks, experiential retrieval proceeds normally and so does the review stage (just without the "World lore" block). Write stage (per-change tolerance): each fact delta gets its own try-catch; a single failure only logs and never propagates. Even if some factual writes fail, experiential memories always get written. Why this design? Because AI output-format problems are frequent (missing fields, nonexistent entityId, etc.); rolling back the whole round on any delta failure would leave "new conversations with a permanently empty memory store" — the most serious usability problem there is. So a little atomicity is traded away for availability.'
  storyVsChatWiki:
    title: How Story mode and Chat mode differ
  storyVsChat:
    intro: LMStory has three modes — Chat is like a "tool", Story is like "immersive narrative", and Director is like "handing the world to an AI showrunner". The three modes have separate entries and interfaces; pick as needed.
    compareTitle: The three modes at a glance
    compareSubtitle: 4 dimensions of clear differences
    columnChat: Chat mode
    columnStory: Story mode
    columnDirector: Director mode
    directorEntry: '"New director" card on the home page (on by default)'
    directorPalette: Follows global appearance + warning-color accents
    directorFont: Serif font (prose is the sole output)
    directorInput: 'Input placeholder: instructions for the director'
    chatEntry: '"New chat" card entry on the home page'
    chatPalette: Neutral colors + a single accent
    chatFont: Sans-serif font (Inter)
    chatInput: 'Input placeholder: send a message'
    storyEntry: '"New story" card entry on the home page (hidden by default; shows once enabled)'
    storyPalette: Follows global appearance (serif narrative prose)
    storyFont: Serif font (narrative prose)
    storyInput: 'Input placeholder: move the story forward'
    positioningTitle: What each mode is for
    chatModeTitle: Chat mode = a tool
    chatModeBody: Like a typical AI chat tool, focused on "getting conversations done efficiently". Good for questions, writing, translation, research and the like. The interface is restrained and quiet, letting the tool disappear into the task.
    storyModeTitle: Story mode = immersion
    storyModeBody: Built for long-running roleplay and narrative, focused on "being there". It automatically memorizes the plot, retrieves past events and maintains character settings. Narrative prose uses a serif font to reinforce the mood, and colors follow the global appearance settings.
    directorModeTitle: Director mode = the AI holds the pen
    directorModeBody: You write the "project rules", and the AI showrunner autonomously retrieves memories, maintains settings and writes the prose backstage — the prose is the only output. For when you want to see how the AI understands your world, or want to semi-hand-off the plot. On by default; can be turned off in settings.
    whenTitle: When to pick which
    whenBody: Pick Chat mode for one-off tasks with AI (write an email, look something up, translate); pick Story mode to personally drive a long story (roleplay, interactive fiction, world exploration); pick Director mode to write good rules, then let the AI hold the pen fully while you only vet and steer. The three modes never interfere — you can keep sessions in all of them at once.
    switchTitle: How to switch modes
    switchBody: There is no separate mode-switch toggle. On the home page, tap "New chat" for Chat mode and "New director" for Director mode (on by default, can be turned off in settings); tap "New story" for Story mode — that entry is hidden by default and can be enabled in Settings → Story mode settings; existing story sessions are unaffected. Sessions are told apart in the sidebar by their mode icon (chat/story/director); tap one to switch to a session of that mode.
  firstStoryWiki:
    title: Creating your first story
  firstStory:
    intro: First time with Story mode? Enable the entry first in Settings → Story mode settings (hidden by default), then tap "New story" on the home page — three steps get your first story going.
    flowTitle: The 3-step flow for creating a story
    flowSubtitle: From tapping New to the first message
    flow1Label: Tap New story
    flow1Desc: The "New story" entry card on the home page (enable the entry first)
    flow2Label: Configure model and prompt
    flow2Desc: Configure at least one usable phase model
    flow3Label: Send the first message
    flow3Desc: Kicks off the six-step generation
    bannerTitle: No embedding model configured
    bannerDesc: Keyword retrieval only; configure one to enable semantic retrieval and sharper memory recall
    bannerAction: Configure
    stepsTitle: The 3 steps in detail
    step1Title: Tap New story
    step1Body: Make sure the entry is enabled (Settings → Story mode settings), then tap the "New story" card on the home page to enter a new Story mode session. The first time in, an empty-state guide prompts you to type a line to start the story.
    step2Title: Configure model and prompt
    step2Body: Open session settings and, under "Per-step model configuration", configure at least one usable model for generating or extracting. Each phase prefers the session-level configuration, then the global configuration for the same phase; phases not individually configured reuse the currently effective extracting/generating model. Only when neither is available does it report configuration error E010.
    step3Title: Send the first message
    step3Body: Type a line that moves the story forward and tap send. The AI walks the full six-step generation flow and outputs the final reply. The first reply may be a little slow because initial memories are being built.
    promptTitle: System prompt
    promptBody: Story mode ships with a built-in default character setup, used automatically when left blank. To customize the world, characters or style, fill in the "Prompt" section of session settings. You can also pick a preset from the template library.
    embeddingTitle: Embedding model
    embeddingBody: 'The embedding model turns memory text into vectors and underpins semantic retrieval. Without one, Story mode still works but is limited to keyword retrieval, with lower recall precision. To configure: open "Settings" → "Story mode settings" → "Model configuration" → "Embedding model".'
    firstMessageTitle: How to write the first message
    firstMessageBody: One line setting the scene or an action is enough, e.g. "I push open the tavern door and catch the smell of aged wine". No need to write full settings — the AI distills key information into memory automatically, and the plot builds on those memories afterwards.
  storyMessageActionsWiki:
    title: Story mode message actions
  storyMessageActions:
    intro: In Story mode, tapping any message shows action buttons. Compared with Chat mode there are fewer action types (no quote, no continue generating), plus a Fork window limit — only messages from the most recent rounds can be operated on.
    diagramTitle: 4 actions + the Fork window
    diagramSubtitle: Action buttons + window limits
    diagramOpsTitle: The 4 actions
    opCopy: Copy
    opRegenerate: Regenerate
    opEditResend: Edit and resend
    opDeleteRound: Delete round
    diagramWindowTitle: Fork window limit
    diagramWindowDesc: Only messages from the last N rounds can be operated on; buttons gray out beyond the window
    opsTitle: The 4 actions explained
    op1Title: Copy
    op1Body: Copies the raw message text to the clipboard. Copy is always available, unaffected by the Fork window.
    op2Title: Regenerate (assistant messages only)
    op2Body: 'Has the AI rerun the six-step generation flow and write a new reply. The old version is not lost: each reply for that round is kept as a draft variant, and the variant switcher on the draft card lets you revisit and switch between them.'
    op3Title: Edit and resend (user messages only)
    op3Body: Change a message you sent earlier; the six-step generation reruns based on the new content. The original reply is likewise kept as a draft variant you can revisit via the variant switcher.
    op4Title: Delete round
    op4Body: Deletes the whole round (your message + the AI's reply + all intermediate artifacts). Deletion asks for confirmation, and only rounds inside the Fork window can be deleted.
    windowTitle: The Fork window limit
    windowBody: In Story mode, only messages from the most recent rounds can be edited or regenerated; buttons on earlier messages gray out. This protects memories that have already set — events from early rounds may have been distilled into factual memories, and changing them would make memory inconsistent. Copy is always available regardless of the window.
    diffTitle: Differences from Chat mode
    diffBody: Story mode has no "Quote" button (immersive narrative doesn't need quoted context), and "Continue generating" is not attached to messages — a full six-step round never comes out "unfinished", and if generation is interrupted the recovery actions live in the failure bar ("Continue writing", "Accept partial draft", and friends). It adds the Fork window limit (to protect memory consistency). The other actions (copy/edit/regenerate/delete) work the same as in Chat mode.
  storySessionSettingsWiki:
    title: Story session settings
  storySessionSettings:
    intro: Story mode session settings are richer than Chat mode's — every step of the six-step generation can have its own model, plus sections like context budget, review stage and suggested replies.
    diagramTitle: 4 phase models + 10 sections
    diagramSubtitle: Independent per-step models + the full settings sections
    diagramPhasesTitle: Independent models for 4 phases
    phaseGenerating: Generate reply
    phaseExtracting: Keyword extraction
    phaseReviewing: Review
    phaseSummarizing: Event summary
    diagramPhasesDesc: Each phase can use a different model; use small models for simple tasks to cut costs
    diagramSectionsTitle: Session settings has 10 sections
    sectionPhaseModels: Per-step model configuration
    sectionPhaseModelsDesc: Independent config for 4 phases
    sectionPrompt: Prompt
    sectionPromptDesc: System prompt + templates
    sectionGen: Generation parameters
    sectionGenDesc: Temperature + Top P + penalties + thinking budget
    sectionContext: Context window
    sectionContextDesc: Per-request token limit
    sectionContextBudget: Context budget
    sectionContextBudgetDesc: Verbatim floor + retrieval share
    sectionToolCalling: Tool calling
    sectionToolCallingDesc: Controls the parsing format of structured-output stages
    sectionReview: Review stage
    sectionReviewDesc: Toggles the review stage
    sectionSuggestReply: Suggested replies
    sectionSuggestReplyDesc: Model + prompt overrides
    sectionMemory: Memory management
    sectionMemoryDesc: Rebuild vector indexes
    phaseModelsTitle: Per-step model configuration
    phaseModelsBody: Each Story mode round has 3 AI requests by default (extract/generate/summarize), or 4 with review enabled. Each phase prefers the session-level configuration, then the global configuration for the same phase; phases not individually configured reuse the effective extracting/generating model. Only when neither is available does it report E010.
    sectionsTitle: The 10 sections explained
    section1Title: Per-step model configuration
    section1Body: Pick models for each stage of the six-step generation — a Story-mode-only configuration. Each step can individually override the global configuration; the reset button writes the current global value into that step as a snapshot (later global changes don't affect this session).
    section2Title: Prompt
    section2Body: The system prompt controls the AI's character setup and narrative style. Left blank, the built-in default character setup is used. You can pick a preset from the template library or type your own.
    section3Title: Generation parameters
    section3Body: Temperature (controls randomness, 0=deterministic 2=random), Top P (nucleus sampling), max tokens, presence penalty (encourages new topics), frequency penalty (reduces repetition), and thinking budget (controls reasoning depth). These parameters apply only to the generation and review stages; structured-task stages like keyword extraction and event summary use fixed parameters, unaffected by this configuration and consuming no thinking budget. Every parameter can individually override the global configuration.
    section4Title: Context window
    section4Body: The per-request token limit caps how many tokens each AI request may carry, to avoid tripping the provider's TPM (tokens per minute) limit. Left blank it uses the model's window size, and the effective value is the smaller of the configured value and the model window. Story mode uses the three-part context budget (summary prefix + verbatim zone + retrieval zone), whose verbatim cap is dynamically controlled by the compaction trigger line — when accumulated conversation length nears the trigger line, the early conversation is automatically compacted into the summary prefix, so no hard message-count truncation is needed. See "How Story mode works → Context budget".
    section5Title: Context budget
    section5Body: 'Controls two parameters: the verbatim floor and the retrieval share. The verbatim floor (null=dynamically computed, non-null=custom ratio) guarantees what fraction of recent conversation is never compacted; the retrieval share controls how much context is retrieved from the memory store and injected (0=retrieval fully off, 0.15=default). Both can be overridden at the session level over the global configuration. See "How Story mode works → Context budget".'
    section6Title: Tool calling
    section6Body: Controls the output format the AI uses when extracting keywords and generating summaries. Enabled by default (better compatibility); turn it off for models that don't support tool calling and the AI will output plain JSON text instead.
    section7Title: Review stage
    section7Body: 'Toggles the second generation stage. Off: the draft is final (3 AI requests). On: one more review-and-revise pass runs on top of the generated content (4 AI requests). Enabling it improves quality but costs more and adds latency. The thinking budget applies only to this stage and the generation stage; other stages consume none. See "How Story mode works → Review stage".'
    section8Title: Suggested replies
    section8Body: Overrides the suggested-reply model and prompt for this session alone. With the model left blank, the generation-stage model is used automatically, so it works even unconfigured. See "Suggested replies and input helpers".
    section9Title: Memory management
    section9Body: 'Memory management sits at the top of session settings. It shows counts of two kinds of memories needing backfill: those reaching the vectorization importance threshold but without an embedding yet, and those already vectorized whose dimensions no longer match the current embedding model (which appears after switching embedding models); rebuilding calls the embedding-model API item by item, and you can enter the memory store to view or edit records.'
    section10Title: Character cards/Worldbooks
    section10Body: 'Apply imported character cards and worldbooks: pick and apply them from the resource library, and they join the world as read-only "seed" settings, showing "N entities applied", and can be unapplied anytime. Once applied, the content runs as a read-only baseline; the AI''s plot changes coexist with it as separate "evolved" entries (the memory store shows baseline/evolved badges per row). See the "Character cards and worldbooks (resource library)" entry.'
    failedEditTitle: Editing configuration in the failed state
    failedEditBody: After a Story mode failure you may change the model, temperature and other configuration before retrying. Editing works only in the idle and failed states; during generation nothing can be changed (to keep state consistent).
  storySuggestReplyWiki:
    title: Suggested replies and input helpers
  storySuggestReply:
    intro: 'Above the Story mode input box sits a row of small buttons addressing two pain points: "typing is a chore" and "I don''t know what to say next". The first two are symbol buttons (quotes, parentheses); the third is AI suggested replies — it generates 3 candidates from the current plot for you to pick.'
    diagramTitle: The toolbar above the input box
    diagramSubtitle: 3 buttons, left-aligned, always available
    diagramToolbarTitle: The 3 toolbar buttons
    btnQuote: Add quotes
    btnParen: Add parentheses
    btnSuggest: Suggest replies
    symbolsTitle: The quote and parenthesis buttons
    symbolsBody: Writing stories often means typing dialogue ("…") or narrator notes. One tap inserts a pair of English quotes or parentheses at the cursor, and the cursor jumps between them so you can just type. Much faster than switching the keyboard to symbols by hand.
    suggestIntroTitle: The suggested-replies button
    suggestIntroBody: When you don't know what to say next — or just feel lazy — tap "Suggest replies". The AI reads the latest round (your last line + the AI's reply) plus the plot summaries of the two rounds before, and generates 3 candidate replies floating above the input box. Tap one to fill the input box; send it as-is or polish it first.
    generatingTitle: While generating
    generatingBody: After you tap, the toolbar shows a small "Generating…" animation. The AI reads only the latest round and the previous two summaries, so it's very token-friendly and usually finishes in seconds. You can keep typing and tap other buttons while it generates.
    bubblesTitle: Working with the candidate bubbles
    bubblesBody: The 3 candidate replies stack vertically above the input box as floating bubbles. Tapping one fills the input box (overwriting its content). The bubbles can be collapsed (via the collapse button on the "Suggested replies" header) or closed with the X. Sending a message dismisses them automatically — that round is over.
    lifecycleTitle: When the bubbles go away
    lifecycleBody: 'The bubbles don''t disappear when you switch pages, scroll history, or open settings. As long as you''re still in the current turn (you haven''t sent a message), they stay put and you can flip between candidates. Only three things clear them: sending a message, closing with the X, or switching to a different conversation.'
    configTitle: Configuring suggested replies
    configBody: The model, prompt, temperature and length of suggested replies are all configurable. Change global defaults under "Settings → Story mode → Suggested replies"; override per conversation in that conversation's "Session settings → Suggested replies" section. With the model left blank, the generation-stage model is used automatically, so it works even unconfigured.
    tokenTitle: Why it's so token-friendly
    tokenBody: Suggested replies read only the last 1 full round and the previous 2 summaries, not the entire history. The current default generates 3 candidates sharing a 600-token cap, at most 150 characters each; candidate count, tokens and per-item length are all adjustable in settings.
  memoryBrowserWiki:
    title: The memory store browser
  memoryBrowser:
    intro: The memory store is Story mode's "brain" — every experience and fact the AI distills automatically lives here. You can view, search, edit or delete any memory at any time.
    diagramTitle: Two tabs + full CRUD
    diagramSubtitle: Experiential vs factual + search/add/edit/delete
    diagramTabsTitle: Two-tab categories
    tabExperience: Experiential memories
    tabExperienceDesc: Plot events, ordered by round
    tabFactual: Factual memories
    tabFactualDesc: Attributes of characters/locations/items
    diagramOpsTitle: 7 operations
    opSearch: Search
    opAdd: Add
    opEdit: Edit
    opDelete: Delete
    opMulti: Multi-select
    opForceInject: Force inject
    opAiMerge: AI merge
    tabsTitle: The two tabs explained
    tab1Title: Experiential memories (the plot diary)
    tab1Body: Ordered by conversation round, 1 micro summary per round. Contains the 6 fields time/location/character/event/significance/extra. Macro summaries are multi-round aggregates and are labeled "macro" in the list.
    tab2Title: Factual memories (the character sheet)
    tab2Body: Grouped by entity (character/location/item/setting/organization/misc; pets and NPCs count as characters). Each entity carries a number of attributes, like "Hero · Level · 5". Expand an entity to see all its attributes; each attribute can be edited or deleted individually.
    opsTitle: The 7 operations explained
    opsBody: 'Search: filter memories by keyword within the current tab. Add: manually add an experience or entity. Edit: change memory content (importance, event description, etc.). Delete: remove a single memory — confirmation required, unrecoverable. Multi-select: batch-check items to tidy up. Force inject: once checked, that entity enters every round''s context, no longer depending on retrieval scoring. AI merge: check 2 or more duplicate entities in the factual tab, and the AI drafts a merge plan for preview and confirmation; once confirmed, the canonical entry is updated and the rest are archived (recoverable). Read-only resources (worldbook/character card projections) cannot be edited or deleted, only unapplied; attribute rows split into "baseline" (read-only) and "evolved" (added by the AI as the plot moves), and "add attribute" lands as an evolved row; entities archived by the AI can be restored from the menu. Entity card badges: "source" = seed origin or AI auto-extraction, "constant · world / constant · directive" = always enters context every round; the menu''s "Disable injection" can temporarily keep something out of the context (browsing and retrieval unaffected), and is reversible. The memory index health bar flags two kinds of gaps — "missing rows" and "embedding dimension mismatch" — both fixable with one-click rebuild, and it hides itself when the index is complete. The experiential tab has an "All/Active/Archived" three-way filter at the top (archived memories don''t join retrieval).'
    entryTitle: How to enter the memory store
    entryBody: Open the menu at the top-right of a Story or Director session page and enter "Session settings"; the "Memory management" section is right at the top. Tap "Open memory store" to open the standalone full-screen page. Both modes share the same memory store.
  apiProviderWiki:
    title: Managing API providers
  apiProvider:
    intro: An API provider is a platform offering AI model services (OpenAI, DeepSeek, etc.). You need to add a provider and fill in an API Key before you can use AI models in conversations.
    diagramTitle: Built-in templates + custom creation
    diagramSubtitle: 7 built-in templates + a 2-step custom flow
    diagramBuiltinTitle: The 7 built-in templates
    builtinOpenAI: OpenAI
    builtinDeepSeek: DeepSeek
    builtinOpenRouter: OpenRouter
    builtinClaude: Anthropic Claude
    builtinGemini: Google Gemini
    builtinNvidia: NVIDIA NIM
    builtinAgnes: Agnes AI
    builtinCustom: Custom
    diagramCustomTitle: The 2-step custom flow
    customStep1: Pick a template or custom
    customStep1Desc: With a template, only the name is needed
    customStep2: Name + create
    customStep2Desc: The protocol is inherited from the template
    stepsTitle: The 5 blocks of a provider detail page
    step1Title: Name
    step1Body: The provider's display name, changeable anytime.
    step2Title: Protocol
    step2Body: 'Locked after creation. Built-in providers inherit their template; for custom providers you can choose among the 4 protocols: OpenAI-compatible, OpenAI Responses, Anthropic, Gemini. Tool calling on GPT-6-series models requires OpenAI Responses.'
    step3Title: API Host
    step3Body: The provider's service address. Pre-filled for built-in providers; enter manually for custom ones. With manual mode enabled you can type a full URL.
    step4Title: API Key
    step4Body: Get the key from the provider's website; it is stored on this device only. "Test connection" requests the provider's model list to verify the address and credentials without consuming generation tokens; some non-standard manual endpoints may not support this request.
    step5Title: Advanced parameters
    step5Body: Protocol-specific parameters for advanced users (e.g. thinking, thinkingConfig, extra_headers), passed through as a JSON object to the network adapter. Leave empty for no custom parameters; resetting the provider to template defaults clears them too. Ordinary users can ignore this.
    modelsTitle: Model management
    modelsBody: Each provider can hold multiple models. Tap "Fetch model list" to pull them from the provider, or tap "+" to add manually. After fetching, check the models you want to keep so hundreds of models don't flood the list.
    entryTitle: How to enter
    entryBody: Settings → General settings → Providers → enter the provider list → tap "+" to create / tap a list item for details.
  modelStrategyWiki:
    title: Model selection strategy
  modelStrategy:
    intro: Model selection decides which model answers you. LMStory supports global defaults + session-level overrides + independent 4-phase configuration in Story mode, flexibly fitting different scenarios.
    diagramTitle: 3 layers of model configuration
    diagramSubtitle: Global defaults → session overrides → Story's 4 phases
    diagramLayersTitle: 3 priority layers
    layer1Label: Global defaults
    layer1Desc: The starting point for all new sessions
    layer2Label: Session overrides
    layer2Desc: Special configuration for one session
    layer3Label: Story's 4 phases
    layer3Desc: An independent model per phase
    diagramStoryTitle: Story mode's 4 phases
    storyGenerating: Generate
    storyExtracting: Extract
    storyReviewing: Review
    storySummarizing: Summarize
    stepsTitle: 3 configuration entry points
    step1Title: Chat mode default model
    step1Body: Settings → Chat mode settings → Default model. Every new Chat mode session uses this model; when unconfigured, the first provider with chat capability is picked automatically.
    step2Title: Story mode's 4 phase models
    step2Body: Settings → Story mode settings → Model configuration. Generate/extract/review/summarize can each be configured independently; session level beats the global same-phase value, and unconfigured phases reuse the currently effective extracting/generating model. Only when neither is available does it report E010.
    step3Title: Session-level overrides
    step3Body: On the chat page, tap the session title menu → Session settings. Each field has a "Reset to current global value" button on its right that overwrites the session-level field with the current global value. Director sessions work the same way; Director session settings additionally have a "Main model" — the model the director uses for autonomous execution, defaulting to the global "Generate" model when not individually configured.
    embeddingTitle: Embedding model
    embeddingBody: A standalone model unique to Story mode, used to turn memories into vectors for semantic retrieval. Settings → Story mode settings → Model configuration → Embedding model. Falls back to keyword retrieval when unconfigured.
    titleModelTitle: Session title model
    titleModelBody: Shared across modes, dedicated to generating session titles. When unconfigured, the current generation model first tries to make a title; on failure it falls back to the first few characters of the reply.
    entryTitle: How to enter
    entryBody: 'Chat mode: Settings → Chat mode settings → Default model. Story mode: Settings → Story mode settings → Model configuration.'
  contextBudgetWiki:
    title: Context budget
  contextBudget:
    intro: 'What Story mode sends the AI each round consists of three parts: summary prefix + verbatim zone + retrieval zone. The context budget is the global configuration controlling the size of these three parts. Set well, it keeps memory quality high while controlling cost.'
    diagramTitle: The three-part context structure
    diagramSubtitle: Summary prefix + verbatim zone + retrieval zone
    diagramPrefixLabel: Summary prefix
    diagramPrefixDesc: Summary of the compacted old conversation
    diagramRecentLabel: Verbatim zone
    diagramRecentDesc: The most recent rounds, verbatim
    diagramRetrievalLabel: Retrieval zone
    diagramRetrievalDesc: Retrieved relevant memories
    param1Title: Compaction trigger line
    param1Body: Compaction triggers automatically when accumulated conversation length reaches "per-request token limit × compaction trigger line". Default 0.5 — e.g. with a limit of 8000 and trigger line 0.5, compaction fires at 4000 tokens. Higher values compact later (more verbatim text kept); lower values compact earlier (cheaper on tokens, but memories become summaries sooner).
    param2Title: Verbatim floor
    param2Body: The minimum share of the "per-request token limit" that recent verbatim text keeps after compaction. E.g. with a limit of 8000 and floor 0.3, at least 2400 tokens of recent verbatim text are kept. Left blank it shows "Dynamic" and the system adjusts automatically based on remaining space.
    param3Title: Retrieval share
    param3Body: The retrieval zone's share of the "per-request token limit". E.g. with a limit of 8000 and share 0.15, the retrieval zone gets at most 1200 tokens. The minimum is 0; setting 0 turns retrieval fully off (relying only on verbatim text and summaries). Turning retrieval off shows a red warning — Story mode loses memory recall and only remembers things mentioned in the summary and recent verbatim text.
    limitTitle: Per-request token limit
    limitBody: The calculation baseline for the three ratios. Left blank it uses the model's window size; the effective value is the smaller of the configured value and the model window. Recommended at roughly 80% of the model's TPM limit to avoid 429 rate limiting.
    entryTitle: How to configure
    entryBody: 'Global configuration: Settings → Story mode settings → Context budget. Session-level override: Session settings → Context budget section, where each parameter can individually override the global value; the reset button writes the current global value into that parameter as a snapshot (later global changes don''t affect this session).'
    usageTitle: Context usage and manual compaction
    usageBody: 'At the end of the Story mode input toolbar sits a ring showing recent context usage in real time: the ring''s full scale is the compaction trigger line (not the model window), and auto compaction fires as usage nears full scale. Tap the ring to see window usage, cache hit rate and the token breakdown of recent requests; when the conversation is too short the button says compaction isn''t worthwhile yet, and during generation the button is grayed out. "Compact now" at the bottom of the detail panel manually compacts ahead of the trigger line — the summary streams in, and when it finishes the old conversation is replaced by one story recap shown merged with the new conversation. The compaction summary card, once expanded, offers "Undo compaction": the archived old conversation is fully restored and the summary deleted, peeling back multiple compactions one at a time. Director mode''s input area has the same ring with the same semantics (on the Director side that knob is called "Context compaction threshold").'
  finalReviewWiki:
    title: Review stage
  finalReview:
    intro: The review stage is an optional stage of Story mode's six-step generation flow. When enabled, one extra AI review call runs after generation, checking factual consistency before the final reply is output. Disabled, the draft is final — saving one AI call.
    diagramTitle: Enabled vs disabled
    diagramSubtitle: 3 AI requests vs 4 AI requests
    diagramOffTitle: Review stage off (3 AI requests)
    offStep1: Keyword extraction + retrieval
    offStep2: Generation
    offStep3: Event summary + persistence
    diagramOnTitle: Review stage on (4 AI requests)
    onStep1: Keyword extraction + retrieval
    onStep2: Generation
    onStep3: Review stage (checks factual consistency)
    onStep4: Event summary + persistence
    toggleTitle: What the toggle does
    toggleBody: 'With the review stage enabled, one review call follows generation: the AI compares the generated content against retrieved memories, checking for factual conflicts (e.g. whether character levels, locations, times and other settings agree). Conflicts are corrected before the final reply is output. Disabled, the generated content goes straight out as the final reply — faster and cheaper, but factual drift may survive.'
    budgetTitle: Relation to the thinking budget
    budgetBody: The thinking budget (reasoningEffort) applies to the generation and review stages. With the review stage enabled, the review stage also consumes thinking budget — deeper review, but slower and more expensive. With it disabled, the thinking budget applies only to generation. Structured-task stages like keyword extraction and event summary never consume thinking budget.
    adviceTitle: When to enable it
    adviceBody: Enable it when you care about setting consistency and play long stories — review intercepts most factual drift. Turn it off when chasing response speed or using cheap small models. The session level can individually override the global toggle in session settings.
    entryTitle: How to configure
    entryBody: 'Global configuration: Settings → Story mode settings → Review stage. Session-level override: the "Review stage" toggle in session settings, with "Use global setting", "On", "Off" to choose from; choosing "Use global setting" writes the current global value into the session as a snapshot (later global changes don''t affect this session).'
  generationParamsWiki:
    title: Generation parameters
  generationParams:
    intro: 'Generation parameters control the "style" the AI writes replies with. LMStory gathers them on one global configuration page, with per-session overrides available. Important: they apply only to the generation and review stages; structured-task stages like keyword extraction and event summary use fixed parameters to keep output stable.'
    diagramTitle: The 5 generation parameters
    diagramSubtitle: All apply only to generation and review
    param1Title: Temperature
    param1Body: Controls randomness. 0 = fully deterministic (nearly identical replies every time), 2 = very random. For Story mode, 0.7-0.9 is recommended — creative without going off the rails. Higher temperature makes the plot more surprising; lower makes it more stable and predictable.
    param2Title: Top P (nucleus sampling)
    param2Body: A randomness control similar to temperature but more stable. Samples only from candidate words whose cumulative probability reaches P. 1.0 = no restriction; 0.1 = choose only from the most likely 10% of candidates. Usually you adjust either this or temperature, not both.
    param3Title: Max tokens (maxTokens)
    param3Body: The maximum length of a single reply, default 8192. It's a cap, not a target — the AI ends naturally at a sensible point. At 0, LMStory adds no app-level output cap; actual length is still limited by the model and provider. Lower it if the model's TPM is tight.
    param4Title: Presence penalty (presencePenalty)
    param4Body: Encourages the AI toward new topics. 0 = no penalty; positive values push down content that already appeared. Default 0 (most newer models have deprecated penalties and ignore them; raise it only for older or self-hosted models). Lower it for a more coherent plot with possible repetition; raise it for more new topics with possible jumps.
    param5Title: Frequency penalty (frequencyPenalty)
    param5Body: Reduces the AI's word repetition. 0 = no penalty; positive values push down high-frequency words. Default 0 (most newer models have deprecated penalties and ignore them; raise it only for older or self-hosted models). Lower it for richer wording with possible repetition; raise it for more varied wording that may feel stiff.
    scopeTitle: Scope (important)
    scopeBody: These 5 parameters apply only to the generation and review stages. Structured-task stages — keyword extraction, event summary, macro summary — use fixed parameters (temperature 0, no penalties) so JSON output stays stable and doesn't drift. Adjusting these parameters therefore never affects memory quality, only the final reply's style.
    entryTitle: How to configure
    entryBody: 'Global configuration: Settings → Story mode settings → Generation parameters. Session-level override: Session settings → Generation parameters section, where each parameter can individually override the global value.'
  promptTemplateWiki:
    title: Prompt template system
  promptTemplate:
    intro: Prompt templates are preset system prompts you can reuse instead of rewriting each time. For example, save a "Translation assistant" template and apply it with one tap when creating a session.
    diagramTitle: 2 available types + CRUD operations
    diagramSubtitle: System prompt / compaction template
    diagramTypesTitle: 2 available template types
    typeSystem: System prompt
    typeSystemDesc: Chat mode system prompt
    typeConsolidation: Compaction template
    typeConsolidationDesc: For merging event summaries
    diagramOpsTitle: 4 operations
    opCreate: Create
    opEdit: Edit
    opCopy: Duplicate
    opDelete: Delete
    stepsTitle: Template management operations
    step1Title: Create a template
    step1Body: Tap the "+" button in the bottom-right corner, enter a name, pick a type and write the content. The name is required; the type can't be changed after creation.
    step2Title: Edit a template
    step2Body: Tap the "Edit" button on a template card. Built-in templates can be edited but not deleted; editing shows a "Built-in template" notice.
    step3Title: Duplicate a template
    step3Body: Tap "Duplicate" to create a copy with an automatic name suffix. Handy for quickly spinning a custom version off a built-in template.
    step4Title: Delete a template
    step4Body: Tap "Delete" — only custom templates can be deleted. Built-in templates show no delete button.
    builtinTitle: Built-in templates
    builtinBody: Created automatically on initialization and marked with a "Built-in" badge. They can't be deleted, but you can edit them or duplicate them into custom versions.
    applyTitle: How to apply a template
    applyBody: In the system prompt field of the session settings panel, you can pick from systemPrompt-type templates. Story mode's 10 prompt segments are managed separately on the Story mode settings page.
    entryTitle: How to enter
    entryBody: Settings → Prompt templates; once in the list you can edit or duplicate built-in templates.
  storyPromptCustomWiki:
    title: Customizing Story mode prompts
  storyPromptCustom:
    intro: Story mode currently has 10 customizable prompt segments, covering character setup, generation, extraction, review, summary, and memory and fact injection.
    diagramTitle: 10 prompt segments + editor preview
    diagramSubtitle: Generation flow + memory and fact extensions
    diagramListTitle: The 10 prompt segments
    segDefaultRole: Default character
    segGenerate: Generation suffix
    segExtractKw: Keyword extraction
    segReview: Review suffix
    segExtractSummary: Event summary
    segMacroSummary: Macro summary
    segGenerateInject: Generation injection
    segMemoriesInject: Memory injection
    segExtractFacts: Fact extraction
    segFactInject: World lore injection
    diagramEditorTitle: The editor's 3 blocks
    editorField: Editing area
    editorFieldDesc: Monospace font + character count
    editorScene: Usage scenario
    editorSceneDesc: Lightbulb icon + explanation
    editorDefault: Default value preview
    editorDefaultDesc: Compare side by side
    stepsTitle: The 10 prompt segments explained
    step1Title: Default character setup
    step1Body: The AI's role at the story's opening, shared by all steps. Decides the voice the AI tells the story in.
    step2Title: Generation suffix
    step2Body: The prompt for the generating step, controlling the style of plain-text generation.
    step3Title: Keyword extraction
    step3Body: The prompt for the extracting step, controlling how keywords are extracted from the conversation. Tool-calling mode.
    step4Title: Review suffix
    step4Body: The prompt for the reviewing step, controlling the review style of plain-text replies.
    step5Title: Event summary
    step5Body: The prompt for the summarizing step, controlling each round's event summary. Tool-calling mode.
    step6Title: Macro summary
    step6Body: The multi-round aggregate summary, controlling the overall recap style of long plots.
    step7Title: Generated-content injection prefix
    step7Body: The prefix used when generated content is injected into reply generation in the reviewing step.
    step8Title: Memory injection title
    step8Body: The title used when retrieved memories are injected in the reviewing step.
    step9Title: Fact extraction
    step9Body: The tool prompt used when the summarizing step extracts entity and attribute changes.
    step10Title: World setting injection title
    step10Body: The block title used when current factual settings are injected into generating/reviewing requests.
    previewTitle: Assembly preview
    previewBody: Tap the "Preview assembly" button at the bottom to see the complete messages list actually sent to the AI during the six-step generation, shown with mock data.
    dirtyTitle: Dirty detection
    dirtyBody: The "Save" button becomes tappable only when the editor text differs from the saved value. Leaving with unsaved changes pops a confirmation dialog so edits are never lost to a slip.
    entryTitle: How to enter
    entryBody: Settings → Story mode settings → Prompt templates → enter the 10-segment list → tap any segment to open the editor (the "Prompt templates" card is visible with "Config display mode = Advanced"; the toggle sits at the bottom of Settings → General).
  appearanceWiki:
    title: Appearance and themes
  appearance:
    intro: 'LMStory''s look is freely composed of three axes: theme structure (Classic / Glass / Engraved / Roam) × palette family (Classic / Bordeaux) × theme mode (Dark / Light / Follow system), plus 11 font sizes from 12 to 22. Changes apply instantly, no restart needed.'
    diagramTitle: Three appearance axes + 11 font sizes
    diagramSubtitle: Structure × palette × light/dark in any combination + 12-22 px
    diagramThemeTitle: 3 theme modes
    themeDark: Dark
    themeDarkDesc: Easy on the eyes at night
    themeLight: Light
    themeLightDesc: Crisp in daylight
    themeSystem: Follow system
    themeSystemDesc: Switches automatically
    diagramFontTitle: 11 font sizes
    fontMin: 12 px
    fontMinDesc: Compact
    fontDefault: 15 px
    fontDefaultDesc: Default value
    fontMax: 22 px
    fontMaxDesc: Large
    stepsTitle: 3 settings blocks
    step1Title: Theme structure and palette family
    step1Body: 'Structure, pick one of four: Classic (clean flat) / Glass (soft materials) / Engraved (crisp outlines and presses) / Roam (narrative gallery). Palette, pick one of two: Classic / Bordeaux (wine red). Structure, palette and light/dark combine freely, and switching applies instantly.'
    step2Title: Theme mode
    step2Body: 'Pick one of three: Dark (easy on the eyes at night) / Light (crisp in daylight) / Follow system (switches automatically). Story and Director sessions follow the global light/dark mode; there is no separate "night-flight theme" anymore.'
    step3Title: Font size
    step3Body: A slider adjusts across 11 steps from 12-22 px, default 15 px, applying uniformly to message prose in all three modes. A "Default" badge shows at the default value, with a live preview below.
    a11yTitle: Accessibility and large screens
    a11yBody: A reduce-motion toggle follows the system switch (effects downgrade in one place); on desktop the keyboard focus ring is visible and icon-only buttons carry readable names; under wide windows the content column narrows and centers automatically, and narrative prose is width-limited to protect reading rhythm; desktop shortcuts are registered from a single source (Ctrl+N new chat, Ctrl+Shift+N new story (effective after the story mode entry is enabled), Ctrl+, settings, Ctrl+K global search, Ctrl+F in-session search; Esc closes overlays layer by layer).
    entryTitle: How to enter
    entryBody: Settings → General settings → Appearance.
  languageInputWiki:
    title: Language & input
  languageInput:
    intro: LMStory's interface language supports both Simplified Chinese and English — switching applies instantly and the choice is remembered; Follow system remains a placeholder preview. On desktop the send key and newline key are independently configurable; on mobile, "Enter sends" and "Enter inserts a newline" are the two options shown.
    diagramTitle: Language, pick 1 of 3 + send key/newline key
    diagramSubtitle: Chinese available / English available / Follow system coming
    diagramLangTitle: 3 language options
    langZh: Chinese (Simplified)
    langZhDesc: Simplified Chinese
    langEn: English
    langEnDesc: Currently available
    langSystem: Follow system
    langSystemDesc: Coming soon
    diagramSendKeyTitle: Send key + newline key
    sendKeyEnter: Enter sends
    sendKeyEnterDesc: Default value
    sendKeyShiftEnter: Shift+Enter sends
    sendKeyShiftEnterDesc: Newline key picks the other
    sendKeyCtrlEnter: Ctrl+Enter sends
    sendKeyCtrlEnterDesc: Newline key picks the other
    sendKeyButton: Button sends
    sendKeyButtonDesc: Enter inserts a newline
    newlineKeyEnter: Enter inserts a newline
    newlineKeyShiftEnter: Shift+Enter inserts a newline
    newlineKeyCtrlEnter: Ctrl+Enter inserts a newline
    newlineKeyAltEnter: Alt+Enter inserts a newline
    stepsTitle: 2 settings blocks
    step1Title: Interface language
    step1Body: 'Pick one of three: Chinese (Simplified) / English / Follow system (coming soon). Switching between Chinese and English applies instantly; the choice is remembered across restarts.'
    step2Title: Send key and newline key
    step2Body: On desktop, the send key picks one of three (Enter / Shift+Enter / Ctrl+Enter) and the newline key one of four (Enter / Shift+Enter / Ctrl+Enter / Alt+Enter); the two can't be identical. On mobile, the two options shown are "Enter sends" and "Enter inserts a newline". In Enter-sends mode, some input methods let you long-press the send key for a newline.
    entryTitle: How to enter
    entryBody: Settings → General settings → Language & input.
  advancedSettingsWiki:
    title: Advanced settings
  advancedSettings:
    intro: 'Advanced settings hold 3 blocks: default thinking budget, timeout configuration, and the session title model. These options affect AI response quality and network stability.'
    diagramTitle: 3 advanced blocks
    diagramSubtitle: Thinking budget / timeouts / title model
    diagramBlocksTitle: 3 blocks
    blockReasoning: Default thinking budget
    blockReasoningDesc: 5 levels to choose from
    blockTimeout: Timeout configuration
    blockTimeoutDesc: Connection + response
    blockTitleModel: Session title model
    blockTitleModelDesc: Shared across modes
    diagramReasoningTitle: 5 thinking budget levels
    reasoningNone: Unset
    reasoningNoneDesc: Model decides (default)
    reasoningDisabled: Disabled
    reasoningDisabledDesc: Explicitly off
    reasoningLow: Low
    reasoningLowDesc: Quick thinking
    reasoningMedium: Medium
    reasoningMediumDesc: Balanced
    reasoningHigh: High
    reasoningHighDesc: Deep reasoning
    stepsTitle: The 3 blocks explained
    step1Title: Default thinking budget
    step1Body: '5 levels: Unset (default — the model decides) / Disabled / Low / Medium / High. Applies only to reasoning-capable models, and mappings differ by model (OpenAI o-series uses reasoning_effort; Claude uses thinking.budget_tokens). Applies to new sessions only; the session level can override.'
    step2Title: Timeout configuration
    step2Body: 'Two sliders: connection timeout (5-60 s, default 15 s) + response timeout (10-300 s, default 30 s). Every AI request in Story mode and Director mode uses these timeouts.'
    step3Title: Session title model
    step3Body: Shared across modes, dedicated to generating session titles. When unconfigured, the current generation model first tries to make a title; on failure it falls back to the first few characters of the reply.
    streamTitle: Streaming output toggle
    streamBody: At the bottom of the "Chat mode settings → New conversation default generation parameters" block. On by default; turned off, the AI waits until everything is generated before displaying. The session level can override.
    entryTitle: How to enter
    entryBody: 'Default thinking budget / timeout configuration / session title model: Settings → General settings → Advanced. Streaming output toggle: Settings → Chat mode settings → New conversation default generation parameters.'
  dataExportWiki:
    title: Exporting and importing data
  dataExport:
    intro: Back up sessions with their associated story data, API provider configuration and configuration overrides into a JSON file, restorable on another device or after reinstall. Device preferences such as theme, language, diagnostics toggles and beginner-guide state are not part of the "Personal preferences" backup.
    diagramTitle: Backup content and flow
    diagramSubtitle: Three content categories + two flows
    diagramExportTitle: 'Export: 3 content categories to choose'
    exportItemSessions: Sessions
    exportItemSessionsDesc: Titles, messages, branches, memory and round data
    exportItemPresets: API providers
    exportItemPresetsDesc: baseUrl + model list
    exportItemPreferences: Personal preferences
    exportItemPreferencesDesc: user_overrides configuration values
    exportApiKeySwitch: Separate API Key switch
    exportApiKeySwitchDesc: Available only when providers are selected
    diagramImportTitle: 'Import: 2 modes'
    importModeAppend: Append
    importModeAppendDesc: Existing items are skipped, not overwritten
    importModeOverwrite: Overwrite
    importModeOverwriteDesc: Clears only the categories included in the backup, then imports
    stepsTitle: Export in 4 steps
    step1Title: Choose content
    step1Body: Under "Data management → Export", check what to back up. Sessions are checked by default; API providers and personal preferences as needed.
    step2Title: Include the API Key or not
    step2Body: This switch is enabled only when API providers are checked. Keep it off normally and open it only temporarily when migrating devices. Store backup files containing keys safely.
    step3Title: Generate the backup file
    step3Body: After tapping "Export", the system assembles the JSON (backupVersion=3). Desktop pops the system save dialog to choose a location (with "Open containing folder" after saving); mobile shares an lmstory_backup_timestamp.json file. v3 backups additionally include character cards, worldbooks, self-built prompt templates and Director mode event logs.
    step4Title: Import to restore
    step4Body: Under "Data management → Import", pick the backup file, then choose "Append" or "Overwrite" mode. When import finishes, a summary shows imported/skipped counts per category. Older v2/v1 backup files import directly (auto-compatible).
    autoBackupTitle: Automatic backup
    autoBackupBody: 'Once enabled, the app checks automatically a while after launch: if more than 24 hours have passed since the last backup and session data exists, it silently exports a full backup into the backups/ folder of the app documents directory (app-private storage, invisible to file managers; no API Key included), keeping only the 3 most recent. Toggle it on the "Data management" page, or tap "Back up now" or "Open backup folder" anytime.'
    singleSessionTitle: Single-session export
    singleSessionBody: Long-press a session in the session list, or pick "Export this session" from the in-session menu, then choose JSON (with the session's associated data), Markdown or plain text. JSON suits migration and restore; the other two suit reading and sharing.
    entryTitle: How to enter
    entryBody: 'Settings → Data management → Export / Import. Single-session export: long-press menu in the session list or the in-session menu.'
  dataRecoveryWiki:
    title: Data recovery and table repair
  dataRecovery:
    intro: The database can occasionally end up with orphan messages or incomplete table structures after abnormal exits or version upgrades. These two tools delete no valid data and are safe to use.
    diagramTitle: Two repair tools
    diagramSubtitle: Neither loses data
    diagramRecoveryTitle: Orphan message recovery
    recoveryStep1: Scan
    recoveryStep1Desc: Find messages whose sessionId no longer exists
    recoveryStep2: Reassemble
    recoveryStep2Desc: Create new sessions + migrate messages
    recoveryResult: Shown by group
    recoveryResultDesc: Each group becomes one "Recovered session"
    diagramRepairTitle: Table structure repair
    repairStrategy: Purely additive strategy
    repairStrategyDesc: CREATE IF NOT EXISTS + ALTER ADD COLUMN
    repairAction1: Create missing tables
    repairAction1Desc: Fill in per the current schema
    repairAction2: Add missing columns
    repairAction2Desc: Works around SQLite ALTER limits
    repairAction3: Rebuild indexes + FTS5
    repairAction3Desc: Including factual-layer and vector indexes
    stepsTitle: The repair flow
    step1Title: Back up first
    step1Body: Before repairing, the system prompts you to back up first to avoid surprises. Go to "Export", make a JSON backup, then come back.
    step2Title: Run the scan
    step2Body: '"Data recovery" scans for all messages whose sessionId is not in the chat_sessions table and shows them grouped by sessionId. If there are none, it says "Nothing found".'
    step3Title: Confirm recovery
    step3Body: The scan results show the number of orphan groups and total messages; after confirmation, each group becomes a new session (title format "Recovered session YYYY-MM-DD"), messages are migrated and the original orphan records deleted.
    step4Title: Repair table structures
    step4Body: '"Repair table structures" additively fills in missing tables, columns, indexes and FTS5 virtual tables. A detailed report pops afterwards: created table names / the list of added "table.column" entries / the updated schemaVersion. It shows "No changes" when nothing changed.'
    diffTitle: Difference from "Clearing all data"
    diffBody: Repair = purely additive (CREATE IF NOT EXISTS + ALTER ADD COLUMN), never deleting existing data. Clearing = DROP + CREATE, which empties all sessions and messages.
    entryTitle: How to enter
    entryBody: Settings → Data management → Data recovery / Repair table structures.
  clearDataWiki:
    title: Clearing all data
  clearData:
    intro: One tap empties all sessions with their messages, branches, compaction points, story memories, round artifacts, failure history and full-text indexes. API providers, model templates, API Keys and on-device preferences are kept. The action is irreversible — always back up first.
    diagramTitle: Scope and flow of the wipe
    diagramSubtitle: What gets cleared / what gets kept
    diagramClearTitle: Session-related data that gets cleared
    clearTableSessions: Sessions and messages
    clearTableSessionsDesc: chat_sessions / chat_messages / branches
    clearTableMemory: Story mode memories
    clearTableMemoryDesc: Experiential / factual layer / intermediate artifacts
    clearTableFailure: Failure history
    clearTableFailureDesc: failure_logs table
    clearTableCompaction: Compaction points
    clearTableCompactionDesc: compaction_points table
    diagramKeepTitle: What gets kept
    keepPresets: API providers
    keepPresetsDesc: api_presets table
    keepTemplates: Prompt templates
    keepTemplatesDesc: templates table
    stepsTitle: The wipe flow
    step1Title: Double confirmation
    step1Body: A red danger card pops a confirmation dialog when tapped. Only an explicit confirmation executes it, avoiding accidental triggers.
    step2Title: DROP + CREATE
    step2Body: Deletes and rebuilds session-related tables, indexes and FTS virtual tables in a single transaction. The number of objects touched may evolve with the schema, so no fixed table count is promised to users.
    step3Title: Configuration is kept
    step3Body: api_presets and templates are out of scope; SharedPreferences and secure storage aren't cleared either, so API Keys, theme, language, diagnostics settings, beginner-guide state and other on-device preferences survive.
    step4Title: Statistics refresh
    step4Body: 'After execution, storage statistics refresh: session and message counts drop to zero; the database file doesn''t shrink immediately (a SQLite trait), but new data reuses the space.'
    warningTitle: Important notice
    warningBody: This action is irreversible. To migrate data, first make a backup with "Export". Only data on the current device is cleared; nothing in the cloud or on other people's devices is affected.
    entryTitle: How to enter
    entryBody: Settings → Data management → Clear all data (the red card).
  diagnosticsWiki:
    title: Diagnostics
  diagnostics:
    intro: 'When troubleshooting, check the running logs, failure history and debug toggles. Logs and failure history are independent: logs are full-text records; failure history is structured database records.'
    diagramTitle: 5 blocks
    diagramSubtitle: Status / level / debug / logs / failures
    diagramOverviewTitle: Status overview
    overviewFailure: Failure record count
    overviewFailureDesc: Highlighted red when greater than 0
    overviewLevel: Current log level
    overviewLevelDesc: debug/info/warn/error
    diagramLevelTitle: Log level
    levelDebug: debug
    levelInfo: info
    levelWarn: warn
    levelError: error
    diagramDebugTitle: Debug toggles (Story mode only)
    debugPrompts: Log full prompts
    debugResponses: Log final replies
    debugMemories: Log retrieved memories
    debugKeywords: Log extracted keywords
    debugPayloads: Log full request payloads
    diagramLogTitle: Running logs
    logSource: FileLogSink file
    logSourceDesc: Synchronous writes + 10MB size rotation
    logTail: Last 500 lines
    logTailDesc: Reverse random reads in an Isolate
    logColor: Colored by level
    logColorDesc: ERROR red / WARN amber / DEBUG gray
    diagramFailureTitle: Failure history
    failureSource: failure_logs table
    failureSourceDesc: The most recent 50 structured records
    failureDetail: Tap to expand details
    failureDetailDesc: Includes error code/stage/HTTP/raw exception
    stepsTitle: 4 common operations
    step1Title: Adjust the log level
    step1Body: Switch among the 4 levels debug/info/warn/error, effective immediately. Use debug when troubleshooting; info or warn for everyday use.
    step2Title: Turn on debug toggles
    step2Body: 'Story mode troubleshooting has 5 toggles, off by default to avoid log bloat: prompts, replies, memories, keywords and full request payloads.'
    step3Title: View failure history
    step3Body: Lists the most recent 50 failure records, each with session ID, mode, error code, failed stage, HTTP status, error message and raw exception. Tap to expand the full technical details.
    step4Title: Share or clear
    step4Body: The "Share" button at the top shares the currently synchronously written log file; "Clear" empties both the failure history and the log files (including rotated backups), with confirmation required.
    fileTitle: Log file characteristics
    fileBody: Synchronous writes (avoiding null bytes) + UTF-8 encoding + ASCII control-character filtering + history cleared on each launch + 10MB size rotation keeping 1 backup. No file logging on the Web platform.
    entryTitle: How to enter
    entryBody: Settings → Diagnostics.
  faqWiki:
    title: Troubleshooting FAQ
  faq:
    intro: Collects the problems users hit most often and their fixes. The "error code + error category + suggested action" trio on every error card is the starting point; turn to this page when that isn't enough.
    diagramTitle: 3 error-code families
    diagramSubtitle: Split by mode
    diagramSimpleTitle: Chat mode S001-S009
    simpleCount: 9 error codes
    simpleCountDesc: Mapped directly from error categories
    simpleStrategy: No auto retry
    simpleStrategyDesc: Stops on failure; the user acts
    diagramIntermediateTitle: Story mode E010-E018 + E104
    intermediateCount: 8 visible error codes
    intermediateCountDesc: Per-stage errors + embedding call failure
    intermediateStrategy: With auto retry
    intermediateStrategyDesc: The round fails only after retries are exhausted
    diagramCommonTitle: The error card's actual display is the truth
    commonCount: Don't infer from contiguous ranges
    commonCountDesc: Numbers not shown are not user-facing
    commonStrategy: Depends on the scenario
    commonStrategyDesc: Some have auto retry
    scenesTitle: FAQ by scenario
    scene1Title: Sending a message does nothing
    scene1Body: Check the error card's code first. Config-type (Chat mode S001 / Story mode E010) = incomplete configuration — go to settings and check the API provider and model; network/timeout-type (Chat mode S002 / Story mode E016) = network problem — switch Wi-Fi/mobile data and retry.
    scene2Title: Streaming cut off mid-reply
    scene2Body: Chat mode keeps what was received; regenerate or edit and resend. Story mode streaming interruptions usually show E016 and retry per policy; after a whole-round failure the partial prose is kept as an unfinished-draft card (copyable), and the failure bar offers "Accept as final", "Continue writing" or a full-round retry. For per-stage failure behavior see "Using Story mode → Handling failures".
    scene3Title: Do messages get lost after a Story mode round fails
    scene3Body: No. Your message is fully kept; only intermediate artifacts (generated content/retrieval results/summary) are cleared. Tap "Continue from interruption" to keep completed-stage outputs, or "Retry whole round" to start over; when the generation stage failed, the partial prose is kept as an unfinished-draft card for "Accept as final" or "Continue writing". See "Using Story mode → Handling failures".
    scene4Title: Compacting the conversation fails
    scene4Body: Chat mode shows a compaction-failed card; tap "Retry" or send again later. You can also shorten the conversation or switch to a model with a larger context window. Follow the suggested actions on the current error card.
    scene5Title: Embedding model call failed (E104)
    scene5Body: 'Story mode only. Pick one of three: "Retry" to call once more; "Temporarily fall back to keyword retrieval" to skip embedding and continue with FTS5; "Abort" to stop this round. Configuring an embedding model beforehand is recommended for daily use.'
    scene6Title: Invalid API Key (Chat mode S003)
    scene6Body: Go to "Settings → General settings → Providers" → edit the provider → update the API Key. Keys live only in this device's flutter_secure_storage and are never uploaded.
    scene7Title: Context window running out
    scene7Body: 'Two options: (1) manually compact the conversation — session menu → Manual compaction, or "Compact now" in the input-area ring''s details; (2) switch to a model with a larger context window — session settings → Model.'
    scene8Title: Incomplete database table structure
    scene8Body: Back up first, then try "Settings → Data management → Repair table structures". The tool additively fills in tables, columns and indexes per the current schema; if it still fails, keep the logs and update the app or report the issue.
    scene9Title: Choosing between Director mode and Story mode
    scene9Body: 'It comes down to whether you want to hold the pen yourself: Story mode is you write a line, the AI continues a stretch — you personally drive the plot; Director mode (on by default) is you set the rules, steer the direction and vet the writes while the AI showrunner holds the pen autonomously. Both share the memory store and character cards/worldbooks. See "Director mode → What Director mode is".'
    identifyTitle: Guide to reading error messages
    identifyBody: 'Every error card carries the trio: error code (Chat mode S codes / Story mode E codes, e.g. S001, E010) + error category (e.g. config/network/auth) + suggested action (concrete executable steps). Start with the suggested action — it solves most problems directly.'
    linkTitle: Story mode failure handling in depth
    linkBody: Story mode's atomic-transaction principle, per-stage failure handling, UI retention timeline, manual retry logic, and the factual layer's special failure fallbacks — see "Using Story mode → Handling failures".
    entryTitle: How to enter
    entryBody: Help → Appendix → Troubleshooting FAQ.
  glossaryWiki:
    title: Glossary
  glossary:
    intro: Plain-language explanations of the technical terms used in this project. Everything is described with everyday analogies — no programming background needed. Grouped into 3 sets by usage.
    diagramTitle: 3 term groups
    diagramSubtitle: By usage scenario
    diagramApiTitle: LLM / API group
    apiCount: 9 core terms
    apiCountDesc: Essentials for calling AI
    apiExamples: API Key / baseUrl / SSE / Token
    diagramMemoryTitle: Memory / retrieval group
    memoryCount: 8 core terms
    memoryCountDesc: The core of Story mode
    memoryExamples: CompactionPoint / embedding model / FTS5
    diagramProjectTitle: Project-specific group
    projectCount: 34 core terms
    projectCountDesc: Three modes
    projectExamples: Chat / Story / Director / Fork / worldbook / character card
    apiTitle: LLM / API terms
    apiKey:
      term: API Key
      desc: The "pass" for calling AI services — like a token in a Java backend. It goes with every request, and providers bill by it.
    baseUrl:
      term: baseUrl
      desc: The "address prefix" of an AI service — like http://localhost:8080/api on a Java backend. Each provider has its own prefix.
    sse:
      term: SSE (Server-Sent Events)
      desc: 'Server-pushed events that let the AI pop out one word at a time, like a typewriter. Like WebSocket in Java, but one-way only: server → client.'
    stream:
      term: Streaming output
      desc: The AI shows what it writes as it writes, no waiting for the whole piece. Built on SSE.
    token:
      term: Token
      desc: 'The smallest unit an AI processes text in — like characters in a Java string but finer: one Chinese character is about 2 tokens, one English word about 1. Billing is by token.'
    contextWindow:
      term: Context window
      desc: The cap on how much text the AI can "see" at once — like how a Java method's parameters can't grow forever. From 8K to over 1M, depending on the model.
    temperature:
      term: Temperature
      desc: How "random" the AI's output is — 0 = the same answer every time (good for research), 1 = a different answer every time (good for creative work). The default 0.8 suits stories.
    reasoningEffort:
      term: Thinking budget (Reasoning Effort)
      desc: 'Some models (like DeepSeek-R1) can "think deeply"; the thinking budget controls how deep: disabled/low/medium/high.'
    samplingParamsOmit:
      term: Omit sampling parameters
      desc: Some newer models and strict relays reject non-default temperature / top_p. Turn on the provider-level switch and every request to that provider omits them, letting the model use its defaults — use it when a 400 says "does not support non-default temperature".
    memoryTitle: Memory / retrieval terms
    compactionPoint:
      term: CompactionPoint
      desc: 'A "snapshot point" for context compaction. When the conversation gets too long, early messages are pressed into a summary — like archiving logs in Java: after archiving you read the summary, not the raw logs.'
    embedding:
      term: Embedding model
      desc: An AI model that turns text into a set of numbers (a vector). When two pieces of text mean similar things, their numbers end up close. The foundation of "semantic retrieval".
    vectorIndex:
      term: Vector index
      desc: The "index table" where memory text is stored as vectors; it finds memories by "similar meaning", not just by "identical wording".
    fts5:
      term: FTS5
      desc: SQLite's built-in "full-text search" plugin, similar to MySQL's FULLTEXT index. Finds memories by keyword — searching "ancient stele" finds memories containing "ancient stele".
    hybridSearch:
      term: Hybrid search
      desc: Finds memories over two lanes at once — FTS5 (keywords) + vectors (semantics) — then merges the results. In Story mode each lane weighs 0.5.
    factualMemory:
      term: Factual layer
      desc: Memories storing "world lore" — character attributes, world rules, place names. Long-lived and stable, stored as key-value.
    experientialMemory:
      term: Experiential layer (Experiential Memory)
      desc: Memories storing "plot events" — things that happened. Append-only, never modified, like a Java append-only log.
    eventSummary:
      term: Event summary
      desc: The "plot digest" the AI writes at the end of each round, with the 5W1E six fields (when/where/who/what/significance/extra). Stored in the experiential layer.
    projectTitle: Project-specific terms
    simpleMode:
      term: Chat mode
      desc: Delivered in v0.1 — a ChatBox-like free conversation tool. Neutral colors + sans-serif font; the tool disappears into the task.
    intermediateMode:
      term: Story mode
      desc: Delivered in v0.2 — a narrative immersion mode. Serif narrative prose + follows the global appearance; remembers the plot automatically.
    advancedMode:
      term: Director mode (Advanced)
      desc: 'The third mode (on by default): an AI showrunner runs the world backstage and writes the prose following project rules. Capabilities include supervision mode, ask-the-director, and the event log; the old standalone HUD blueprint is deprecated.'
    configDisplayMode:
      term: Config display mode
      desc: The "Simple/Advanced" toggle at the bottom of Settings → General (Simple by default). Simple shows only everyday configuration (providers, model picking, template resources, narrative pacing and other plain-language items); Advanced shows everything. Switching applies instantly; the filter only touches the presentation layer — hidden items with values keep working.
    themeStructure:
      term: Theme structure
      desc: The appearance axis for "what the interface looks like" (since v0.4.0). Classic = clean flat; Glass = frosted-glass materials (the native carrier of the Bordeaux palette); Engraved = crisp outlines and presses (formerly "Jagged"); Roam = a narrative gallery. Choose under Settings → General → Appearance, freely combined with any palette.
    paletteFamily:
      term: Palette family
      desc: The appearance axis for "which palette to use" (since v0.4.0). Classic = daylight/night-flight; Bordeaux = a late-night tavern booth (night) + white gallery walls at dawn (day). Any structure × any palette combination is valid.
    projectRules:
      term: Project rules
      desc: Director mode's resident background rules (worldview, characters, writing style, narrative principles). Effective for the whole session and never rewritten by the AI; pick one straight from the template library to start fast.
    supervisionMode:
      term: Supervision mode
      desc: When on, every write the director makes to the memory store pauses with a confirmation card for you to "Allow / Deny" item by item; when off, those writes execute automatically.
    askDirector:
      term: Ask director
      desc: A decision request the director proactively raises to you, popping a "Director decision" card; you can type an answer or "Skip" to let it decide.
    gmModel:
      term: Director main model
      desc: The model the director uses for autonomous execution; defaults to the global "Generate" model when not individually configured.
    storyAnchorTerm:
      term: Story anchor
      desc: The current plot position the director maintains (characters/location/time, etc.), letting it snap back to the scene when continuing across rounds; the interlude recap card is generated from it.
    backstageTerm:
      term: Onstage / backstage
      desc: 'The process layering of a Director session: onstage holds only the prose and one process line; backstage is the per-step work cards (reviewing earlier events, verifying settings, etc.), expanded or collapsed via the backstage summary row ("N backstage steps · M thinking segments").'
    eventLog:
      term: Event log
      desc: A running record of every step of the director's work; after a crash or restart, the scene is restored from it and writing resumes.
    fourStepGen:
      term: Six-step generation
      desc: 'Story mode''s per-round flow: extracting (keyword extraction) → retrieving (memory retrieval) → generating (generation) → reviewing (review, optional) → summarizing (summary generation) → persisting (persistence); when the context nears its limit, compaction runs automatically first. 3 AI requests by default, 4 with the review stage enabled.'
    fork:
      term: Fork (branch)
      desc: '"Branching" a new conversation line off a message, like a Git branch. Explore the different plots different choices lead to.'
    worldbook:
      term: Worldbook (World Book)
      desc: A pre-written collection of setting entries (currency rules, geography, magic systems, etc.). Imported from the resource library and applied to a session, it joins the world as read-only "seed" settings coexisting with facts learned at runtime; it cannot be modified inside a session.
    characterCard:
      term: Character card
      desc: Pre-made character settings (name/personality/background). After import it serves as a read-only baseline; personality shifts in the story only append, never overwrite the original settings.
    resourceLibrary:
      term: Resource library
      desc: The global repository holding imported character cards and worldbooks (Settings → Character cards/Worldbooks), applicable to story sessions.
    readonlyBaseline:
      term: Read-only baseline
      desc: 'The baseline attribute rows of imported entities (worldbooks/character cards): never rewritten, never removed; the primary name is also baseline (an AI rename intent becomes an alias, and the old primary name is kept).'
    evolvedRow:
      term: Evolved row
      desc: 'AI-evolved attribute rows coexisting with the baseline under the same key: they carry plot changes; at injection they aggregate with the baseline as "original content (initial); new content (evolved)". Memory store attribute rows carry "baseline/evolved" row-level badges.'
    storyVariant:
      term: Variant (draft version)
      desc: 'Multiple versions of the same round''s prose: in Story/Director mode, regenerating or editing-and-resending auto-saves the old draft as a variant; the ◀ n/m ▶ switcher under the draft card can view, copy, set as current, or delete; after switching variants, the context for later plot changes too.'
    acceptPartialAsFinal:
      term: Accept as final
      desc: 'The finish-out for a failed story generation: the partial prose already written becomes this round''s final text directly, and summary and persistence proceed as usual.'
    continueWritingTerm:
      term: Continue writing
      desc: 'The continue-out after a failed story generation: generation resumes with the partial prose, the AI writing on from what exists without repeating it.'
    inSessionSearchTerm:
      term: In-session search
      desc: 'Search messages by keyword within a single session (session menu or desktop Ctrl/Cmd+F): hits can be jumped between previous/next with a highlight flash, and a truncation notice shows when there are too many hits.'
    readingPositionTerm:
      term: Reading position memory
      desc: Automatically remembers the scroll position when you leave a story session and restores it to where you last read when you return.
    narrativePacing:
      term: Narrative pacing
      desc: Director mode's narrative-advance gear (Conservative/Balanced/Aggressive). Controls each round's shot scale — fine detail and slow push, or fast-forward strides; only Aggressive requires the prose to be written full and complete, while Conservative/Balanced lengths follow the narrative; the global setting is the default, switchable per session temporarily.
    toolPermissions:
      term: Tool permissions
      desc: 'Per-tool toggles in Director mode, three states: Allow (execute directly) / Ask (approval card before executing) / Disable (invisible to the director). Global sets the default, sessions can override; the supervision-mode preset is a one-tap combination. Exception: "Submit this round (finish_round)" is fixed to Allow and cannot be disabled (disabling it would strand the prose).'
    roundBudget:
      term: Round budget
      desc: 'The cap on the director''s autonomous execution per round, in four dimensions: steps, time, cumulative token consumption and context headroom. Hitting any one first wraps up before stopping (soft landing); even "unlimited" stays protected by the remaining dimensions.'
    scriptBoard:
      term: Clapperboard
      desc: 'The "now, as the AI sees it" read-only panel (entered from the session menu): key entities/plot mainline/narrative time/story anchor, assembled from the same data as the core blocks injected into the model each round — what you see is what the AI sees, cross-checkable with the backstage trail page.'
    pureReading:
      term: Pure reading
      desc: 'One-tap reading mode in the Director session top bar: hides all backstage process and instruction bubbles, leaving only the draft stream, interlude recap cards and compaction summaries; the preference is remembered per session, and switching back to normal mode restores the controls.'
    contextComposition:
      term: Context composition
      desc: 'The composition section of the context usage detail panel: shows the latest request''s input in four segments — system prompt/clapperboard/conversation history/this round''s directive — with shares and estimated tokens (split by character share at assembly time; the estimation basis is noted in the panel).'
    contextUsage:
      term: Context usage
      desc: 'The small ring indicator by the input area: full scale = context compaction threshold. Tap to open the detail panel for window usage, cache hit rate and the last round''s token breakdown; "Compact now" is available once the conversation is long enough, and the compaction summary card can undo the most recent compaction (the same across Chat/Story/Director).'
    foreshadowSweep:
      term: Periodic foreshadow sweep
      desc: 'Director mode''s foreshadow reconciliation mechanism: every N rounds (default 8, adjustable in Director settings) it reminds at round end of unresolved foreshadowing; if unresolved items remain when a sweep round submits, the final-review reminder gates it once — crossing out resolved ones or confirming before it passes — so planted foreshadowing never dangles unattended.'
    roundTimeline:
      term: Round timeline
      desc: 'A faithful replay of each director round''s backstage work: thinking, narration and actions interleaved in true order, archived with the round and reviewable on re-entering the session.'
    entryTitle: How to enter
    entryBody: Help → Appendix → Glossary.
  featureIndexWiki:
    title: Feature index
  featureIndex:
    intro: Every feature listed by module; each row has the feature name and a short description.
    diagramTitle: 6 major feature modules
    diagramSubtitle: Grouped by version
    diagramSimpleTitle: Chat mode (v0.1)
    simpleCount: 15+ features
    simpleCountDesc: Sessions/messages/compaction/branches
    diagramIntermediateTitle: Story mode (v0.2)
    intermediateCount: 12+ features
    intermediateCountDesc: Six-step generation/memory/factual layer
    diagramDirectorTitle: Director mode (v0.3)
    directorCount: 30+ capabilities
    directorCountDesc: Rules/supervision/logs…
    diagramSettingsTitle: Settings (v0.1+v0.2)
    settingsCount: 10+ features
    settingsCountDesc: Providers/models/templates/appearance
    diagramDataTitle: Data maintenance (v0.1+v0.2)
    dataCount: 8+ features
    dataCountDesc: Export/recovery/clearing/diagnostics
    diagramHelpTitle: Help (since v0.2, growing with versions)
    helpCount: 47 Wiki entries
    helpCountDesc: Beginner guide/user manual
    moduleSimpleTitle: Chat mode features
    moduleSimpleBody: Delivered in v0.1. Session management (create/delete/star/reorder/search), message sending (streaming/edit/resend/quote), Fork branches, CompactionPoint compaction, model selection, session settings, thinking budget, template system, attachment upload, tool-call display, thinking-content display, context usage ring and manual compaction (shared with Story/Director), streaming long-conversation rendering optimization (frozen-prefix chunked rendering), in-session search (menu/Ctrl+F, non-modal search bar + hit-location flash, branch-consistent filtering).
    moduleIntermediateTitle: Story mode features
    moduleIntermediateBody: Delivered in v0.2. The six-step generation flow (compaction → extraction → retrieval → generation → review → summary → persistence), experiential memory, the three factual-memory tables, cumulative compaction summary and segmented macro summary, 5W1E, narrative time, memory store, embedding model, FTS5+Vector retrieval, per-step models, tool-calling mode, failure handling E010-E018/E104 and round-artifact persistence; context usage ring and manual compaction, world state bar at the top of sessions, compaction summary card with "archived rounds X–Y" label and "Undo compaction", find-similar clustering and suspected-duplicate merge preselection, empty-state sample openings, streaming thinking area (auto-expand/height cap/copy), continue-generating splice merge (single bubble + continuation badge), streaming long-conversation rendering optimization (frozen-prefix chunked rendering); memory-retrieval reachability hardening (word segmentation and main-table substring fallback — visible in the store means findable), memory index health bar (missing rows/embedding dimension mismatch) with one-click rebuild, experiential archive badges and three-way filter, duplicating a session fully inherits memories and vectors, compacted macro summaries are retrievable, worldbook/character-card read-only semantics (baseline never rewritten, evolved coexists, row-level badges in the memory store, three-part apply preview); story draft variants (regenerate/edit-resend auto-snapshots the old draft, ◀ n/m ▶ switcher under the draft card to view/copy/set-as-current/delete, context changes after switching), interrupted-prose retention (partial prose kept as an unfinished-draft card, failure bar offers "Accept as final" or "Continue writing" without repeating existing content), draft export (range × content to Markdown), in-session search (menu or Ctrl/Cmd+F, hit jumping + highlight flash), reading position memory (re-entering restores where you left off); entry toggle (hidden by default — enable it in Settings → Story mode settings to restore the home/sidebar/shortcut entries; existing data is untouched).
    moduleDirectorTitle: Director mode
    moduleDirectorBody: Delivered in v0.3. Project rules, main model and per-step models, step/time budgets with soft landing, supervision mode (item-by-item write approval), ask-director (with an "always wait" level and banner countdown), onstage/backstage process layering (round timeline), interlude recap cards (setting changes link straight to the memory store), event log and restart recovery, skill notes, subagents (re-dispatching the same task brief returns the last conclusion directly), memory store entity merging, standalone settings system (three-state tool permissions), three-level narrative pacing, context usage indicator and manual compaction, compaction summary card undo, periodic foreshadow sweep (every-N-round reminders at round end + final-review reconciliation gate on sweep rounds), character card/worldbook seed-apply entry, streaming long-conversation rendering optimization (draft-card frozen prefix + frame merging), draft variants (regenerate doesn't overwrite old versions, n/m switcher at the draft card's bottom-right), retry-wait countdown status bar and session-open loading skeleton, event log rolling retention (last 20 rounds by default, auto-pruned past the limit), memory store source/constant badges and entry-level injection disabling, character card/worldbook preview before applying, suggested-reply candidate count and per-item length entries, session retrieval strictness three levels (Conservative/Balanced/Loose, snapshot written to the session column), in-round budget progress title (step N/M · elapsed time, turns warning-colored as budget runs out), duplicating a session completes round artifacts and draft variants, draft export (range × content, four choices, Markdown), story anchor editing (Recap card entry, same data source as the AI), clapperboard view ("now, as the AI sees it", same source as the injection side), failed-round unfinalized badge, expand-all foreshadow list, de-emphasized narration lines, like-action aggregate rows (×N expand), pure reading mode (preference remembered per session), 3s system-adjudication notices (overflow self-healing/HITL timeout), context composition distribution (four-segment estimates in the ring detail panel), a single "context compaction threshold" knob (percentage ⇄ token dual display, direct token input back-computes; window cap folds into Advanced, 0 = auto + effective value disclosed). Failure true-resume (after a failure, "continue from where it stopped" rebuilds the model-visible message sequence from the event-log projection, so completed LLM steps and tool outputs are never re-burned; the half-written prose kept after a stop is synthesized into the resume context so the model continues from its own broken-off sentence), director session creation wizard (a standalone home entry walks three steps — model, embedding model, project rules — straight into a ready session — unconfigured users connect a provider from a template, paste a key and fetch models while global defaults get written along the way; configured users pick a model for this session only; embedding has three optional states; the rules step offers a ready template or a three-question questionnaire feeding local assembly or informed model generation, adopted after preview and saved as a template by default). Historical text search lets the AI find saved user input, prose and final replies with a few keywords when summaries are insufficient, then reread matching rounds; memory importance scores do not affect this search.
    moduleSettingsTitle: Settings features
    moduleSettingsBody: 'v0.1-v0.3. API provider management (7 built-in templates + custom; advanced parameters passed through as JSON for protocol-specific options), default model selection, per-step models (with "affects: XX" consumer labels), prompt template system, Story mode''s 10 customizable prompt segments, appearance (three axes: theme structure × palette family × light/dark, 12-22 font levels), language and input (interface language: Simplified Chinese/English, switching applies instantly), advanced settings (thinking budget/timeouts/title model/ask-wait including the always-wait level), display preferences, auto compaction, global generation defaults (Chat maxTokens left blank means the model decides), model testing, a provider-level "omit sampling parameters" switch (self-serve omission for relays and models that reject non-default temperature/top_p), Director mode toggle, character card/worldbook resource library entry, AI card building (chat with an agent to generate/edit character card and worldbook drafts, saved to the library after confirmation, with overwrite-save guardrails and exit interception), session-level settings panels (model/temperature/single-round steps + live draft preview + finish-create, auto-exits after saving), assistant-message Markdown rendering and revision-process lines, first-use model selection truly taking effect, dual config modes (the "Config display mode" toggle in Settings → General: Simple shows only everyday configuration, Advanced = everything; all settings pages and in-session panels filter by level, and hidden items with values keep working; the embedding (vector) model is visible even in Simple mode).'
    moduleDataTitle: Data maintenance features
    moduleDataBody: v0.1+v0.3. Full export (multi-select + API Key toggle, v3 backups include character cards/worldbooks/self-built templates/Director event logs), single-session export (JSON/Markdown/TXT), full import (append/overwrite, completion report with asset counts and an API Key re-entry shortcut; overwrite import auto-snapshots to backups/ beforehand keeping the last 2, and aborts on snapshot failure), automatic backup (24h silent rolling retention of 3, domain-split by prefix without touching snapshots or foreign files), data recovery (orphan messages), table structure repair (purely additive, no data loss), clear all data, diagnostics page (failure history + logs + debug toggles), storage statistics (including Director event log counts and size, rolling retention of the last 20 rounds by default), import progress feedback (a non-dismissible overlay for the whole import), external-open routing (backup JSON opened via "Open with"/share goes straight to data import instead of the resource library).
    moduleHelpTitle: Help features
    moduleHelpBody: 'Delivered in v0.2. Beginner guide (six-step first launch + replayable), Wiki home (8 chapter groups, 47 entries, with search): Getting started / Using Chat mode / Using Story mode / How Story mode works / Director mode / Configuration and customization / Data and maintenance / Appendix.'
    entryTitle: How to enter
    entryBody: Help → Appendix → Feature index.
  versionHistoryWiki:
    title: Version history
  versionHistory:
    intro: The current app version is $appVersion, with Director mode as the core experience; Chat mode and Story mode (delivered in v0.2, now in maintenance) remain available; the database schema is at $schemaVersion, with upgrades and repairs following a data-preserving incremental strategy.
    diagramTitle: 3 version phases
    diagramSubtitle: Delivered / Delivered / Implemented
    diagramV01Title: v0.1 Chat mode
    v01Status: Delivered
    v01StatusDesc: Chat mode fully usable
    v01Schema: schemaVersion 1-15
    v01SchemaDesc: 15 table-structure iterations
    diagramV02Title: v0.2 Story mode
    v02Status: Delivered
    v02StatusDesc: Story mode fully usable
    v02Schema: schemaVersion 16-36
    v02SchemaDesc: Incremental evolution
    diagramV03Title: v0.3 Director mode
    v03Status: Implemented
    v03StatusDesc: Implemented, on by default
    v03Schema: schemaVersion 37-$schemaVersion
    v03SchemaDesc: Includes event log and other increments (no HUD)
    v01Title: v0.1 Chat mode (delivered)
    v01Body: 'A ChatBox-like free conversation tool. Core deliverables: streaming conversation, session management (create/delete/star/reorder/search), CompactionPoint compaction, Fork branches, session-level parameter overrides, template system, thinking budget, attachment upload, data import/export. Infrastructure: SSE stream parsing, an OpenAI-compatible API client, the drift database, flutter_secure_storage, theme and base UI components.'
    v02Title: v0.2 Story mode (delivered)
    v02Body: Today's Story mode includes the extracting/retrieving/generating/reviewing/summarizing/persisting flow, experiential memory with FTS5+Vector retrieval, the factual layer's entity/attribute/audit three tables, cumulative compaction summary and segmented macro summary, 5W1E, the memory store, diagnostics and incremental table repair. There are currently 7 provider templates with four implemented protocols — OpenAI-compatible, OpenAI Responses, Anthropic, Gemini (Responses landed on 2026-11-02; tool calling on GPT-6-series models requires it).
    v03Title: v0.3 Director mode
    v03Body: 'Director mode: an AI showrunner retrieves memories, maintains settings and writes prose backstage following project rules; the prose is the only output. Implemented so far: project rules, main model and per-step models, per-round step/time budgets with soft landing, supervision mode (item-by-item write approval, with "always allow this session"), ask-director, onstage/backstage process layering (round timeline + a single fold group), interlude recap cards, event log and restart recovery, skill notes, subagents, memory store entity merging (AI merge of duplicate entities), a standalone settings system (global settings page + session panels, three-state tool permissions), three-level narrative pacing, context usage indication (ring + manual compaction). It reuses Story mode''s memory foundation with no standalone HUD; the old HUD blueprint is deprecated. Also delivered: the worldbook/character card resource library (SillyTavern-compatible import). The Director experience keeps being rounded out: draft variants, draft export, story anchor editing, clapperboard view, pure reading and in-round budget progress; context configuration converged into a single "context compaction threshold" knob (percentage ⇄ token dual display) replacing the three-ratio surface, with the window cap demoted to an advanced override; session configuration fully snapshotized (reset = new = copy the current global value; existing sessions materialize automatically when opened).'
    milestonesTitle: Milestones
    milestones:
    - '2026-11-03 Director request timeouts and progress feedback: configure first-response and non-streaming completion timeouts independently; cancellation covers the request, thought, speech and tools appear in arrival order, and warning and error cards can be collapsed after a successful round'
    - '2026-11-02 Obsolete sampling params overhaul: Kimi K-series models and the official moonshot endpoint family both stop sending sampling params; the Gemini native protocol stops sending them entirely and gains a gemini-4 thinking branch; o-series detection unified into one source; story/director penalty defaults drop to 0 (existing sessions untouched); compaction, titles, memory consolidation, fact merging, and world-setting prompts now share one configurable temperature key and honor the omit checks'
    - '2026-11-02 OpenAI Responses protocol shipped + API compatibility audit fixes: the openaiResponses placeholder enum goes live (GPT-6-series tool calling requires Responses); GPT-5/GPT-6 models no longer send sampling parameters; Gemini 3 thought-part signatures are replayed verbatim across turns; full audit report lives in the repository docs'
    - '2026-11-02 Strict-relay sampling compatibility: a provider-level Omit sampling parameters switch plus normalized model-name heuristics (Claude Sonnet 5/5.5, Opus 4.7+, o-series, reasoner), applied by all three protocol adapters and compaction temperature; no database migration'
    - 2026-11-01 Director historical text search adds keyword search independent of memory scores, with round-based rereading and general fallback guidance when summaries are insufficient; existing sessions need no memory rebuild
    - '2026-10-18 Director instruction visibility & rules echo fixes: while a round is live, if streaming content pushes the sent instruction bubble out of view, a tappable Current instruction strip appears at the top of the timeline (tap to jump back; stays out of the way in failed/idle states); the session settings Project rules field now always echoes the effective value — sessions without an override prefill the global rules instead of showing blank'
    - '2026-10-18 Wizard UX rework: the home entry becomes a standalone emphasized guide card (rendered after the creation buttons in both compact and regular layouts); the model step gains a plain-language teaching block, a prefilled default model for configured users, a grouped provider picker sheet behind Change the pen (no more flat full-inventory list) and one-line provider recommendations; the embedding step drops its turn-off state for two full-row paths, with unconfigured users required to choose explicitly before continuing; the rules step gains back navigation at every level plus a confirmation page (model name, content and cost preview) before Start writing actually calls, and generation can be stopped after a cost-aware confirmation; selection shows its meaning everywhere, with all copy aligned to the world-narrative-engine voice (zh/en in sync)'
    - '2026-10-17 Director session creation wizard: a standalone Director wizard home entry (coexisting with the direct New director card) walks model, embedding model and project rules, then lands in a configured session; unconfigured users connect a provider from a template, paste a key, fetch models and get global defaults written along the way (Simple default plus director GM), configured users pick a model for this session only without touching globals; the embedding step has three optional states and can connect a second provider; the rules step offers a ready template or a three-question questionnaire (genre/style/person) with local assembly or informed model generation, adopted after preview and saved as a template by default'
