    preview:
      title: Preview assembled result
      mockBanner: 'This is a mock-data preview: a fixed example input assembled with the current prompt configuration; the sample content itself is shown in Chinese. Actual conversations substitute real content.'
      sample:
        userInput: "I follow the dry stairs down until they end at the cathedral's flooded nave, then dive through the shattered rose window into the chancel. There's a pocket of trapped air inside, and the candles at the altar are still burning — as if the priests never left."
        history1User: "I am a wandering salvage diver. A three-day storm blew my skiff off the charts, and when the fog finally lifted, a drowned city rose out of the grey lake — towers, causeways, one cathedral spire still above the waterline. I rowed in through the broken seawall at dusk."
        history1Assistant: "The seawall's stones are furred with black-green weed, and cold blue lanterns still burn along the sunken boulevard beneath the surface, each lighting nothing but its own halo. Past the snapped chain, the city's silence swallows the sound of your oars. Every wall is carved with the same procession: robed choristers bearing a great bell toward the water. As your hull glides over the first drowned street, something far below rings once — soft, and deep, and patient."
        history2User: "I follow the Avenue of Shells to the cathedral and tie my skiff at the foot of the bell tower. The bell is tolling in slow beats, though there is no wind and no hand on the rope."
        history2Assistant: "Under a skin of green water, the avenue's mosaics tell the whole story: the Tide Choir walking into the lake with the bell in their arms, the city following note by note. Halfway along, the tolling settles into your ribs before your ears, one slow beat at a time — keeping time with your heartbeat, then, subtly, leading it. The tower door hangs open. On the threshold, the weeds part around a flight of dry stone stairs spiraling down into the spire's hollow heart, lit by the same patient blue."
        generated: "Your head breaks the surface of the air pocket, and candlelight wavers across a vaulted ceiling crusted with pearls. The great brass bell hangs level with your eyes, suspended over the altar on chains thick as masts — and beneath it, ankle-deep in water, stands a woman in the Tide Choir's grey robes, her back to you, keeping the tolling alive with slow strokes of her hands. She has been keeping time here for a very long while. As the bell's note fades, her hands fall still, and she begins, unhurried, to turn around."
        compactionSummary: "[Story so far] Before the storm you sheltered in the reef lighthouse, where you found a survey chart naming the drowned city of Vael-Morrow and a keeper's note: the Tide Choir rang the bell to keep the lake asleep. You crossed with the fog, slipped in through the broken seawall, and followed the Avenue of Shells to the bell tower as the tolling learned the rhythm of your heart."
        reply: "Your head breaks the surface of the air pocket, and candlelight wavers across a ceiling crusted with pearls. The great brass bell hangs over the altar on chains thick as masts, and beneath it, ankle-deep in water, stands a woman in the Tide Choir's grey robes, keeping the tolling alive with slow strokes of her hands. You remember the choristers carved on every wall and the keeper's note — the bell keeps the lake asleep — and understand that whatever she has been keeping time against is still listening. The candles gutter once as the water around your waist goes utterly still. She is waiting for you to choose whether the next beat sounds."
        mem1Summary: "The diver found the drowned city of Vael-Morrow after a three-day storm, rowed in through the broken seawall, and saw cold blue lanterns still burning on the sunken boulevards; something far below rang a bell once."
        mem2Summary: "The diver followed the Avenue of Shells to the bell tower; the mosaics showed the Tide Choir carrying the bell into the lake, and the tolling kept time with the diver's heartbeat before leading it."
        mem1Tags:
          - "Drowned city"
          - "Seawall"
          - "Blue lanterns"
        mem2Tags:
          - "Tide Choir"
          - "Bell tower"
          - "Mosaics"
          - "Tolling"
