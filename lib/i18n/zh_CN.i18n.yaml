      failed: 备份失败，请重试或查看日志
      pathLabel: 备份目录（已复制到剪贴板）
      # 兜底弹窗说明：路径在应用私有存储内，文件管理器不可见；
      # 迁移数据请走导出/导入，不走这个目录
      pathSandboxNote: 该目录在应用专属的受保护存储内，文件管理器无法浏览，这是系统的安全设计，备份并未丢失。
      pathMigrationTip: 想把数据搬到新设备？请用本页的「导出数据」导出备份文件，到新设备上再用「导入数据」恢复。
