    step1Body: 在「数据管理 → 导出」中勾选要备份的内容。会话默认勾选，API 供应商和个人偏好按需勾选。
    step2Title: 是否带 API Key
    step2Body: 仅当勾选 API 供应商时启用此开关。建议平时关闭，仅在迁移设备时临时打开。带 Key 的备份文件请妥善保管。
    step3Title: 生成备份文件
    step3Body: 点击「导出」后系统组装 JSON（backupVersion=3）。桌面端会弹出系统保存对话框选择保存位置（保存成功后可「打开所在文件夹」）；移动端分享为 lmstory_backup_时间戳.json 文件。v3 备份额外包含角色卡、世界书、自建提示词模板与导演模式事件日志。
    step4Title: 导入恢复
    step4Body: 在「数据管理 → 导入」中选择备份文件，再选择「追加」或「覆盖」模式。导入完成会显示各类导入/跳过数量摘要。旧版 v2/v1 备份文件可直接导入（自动兼容）。
    # 自动备份
    autoBackupTitle: 自动备份
    autoBackupBody: 开启后，应用启动一段时间会自动检查：距上次备份超过 24 小时且存在会话数据时，静默导出一份全量备份到应用文档目录的 backups/ 文件夹（应用私有存储，文件管理器不可见；不含 API Key），只保留最近 3 份。可在「数据管理」页开关，也可随时点「立即备份」或「打开备份目录」。
    # 单会话导出
    singleSessionTitle: 单会话导出
    singleSessionBody: 在会话列表中长按某个会话，或会话内菜单选择「导出此会话」，可选 JSON（含该会话关联数据）、Markdown 或纯文本。JSON 适合迁移恢复，另外两种适合阅读分享。
    # 入口
    entryTitle: 怎么进入
    entryBody: 设置 → 数据管理 → 导出 / 导入。单会话导出：会话列表长按菜单或会话内菜单。

  # ── 6.2 数据恢复与表修复（2026-07-27 新增）──
  dataRecoveryWiki:
    title: 数据恢复与表修复
  dataRecovery:
    intro: 数据库偶尔会因为异常退出或版本升级出现孤立消息或表结构不完整。这两项工具不删除任何有效数据，可安全使用。
    # 主视觉
    diagramTitle: 两种修复工具
    diagramSubtitle: 都不丢数据
    diagramRecoveryTitle: 孤立消息恢复
    recoveryStep1: 扫描
    recoveryStep1Desc: 找出 sessionId 已不存在的消息
    recoveryStep2: 重组
    recoveryStep2Desc: 创建新会话 + 迁移消息
    recoveryResult: 按组展示
    recoveryResultDesc: 每组生成一个「恢复的会话」
    diagramRepairTitle: 表结构修复
    repairStrategy: 纯增量策略
    repairStrategyDesc: CREATE IF NOT EXISTS + ALTER ADD COLUMN
    repairAction1: 创建缺失的表
    repairAction1Desc: 按当前 schema 补齐
    repairAction2: 补齐缺失的列
    repairAction2Desc: 处理 SQLite ALTER 限制
    repairAction3: 重建索引 + FTS5
    repairAction3Desc: 含事实层和向量索引
    # 步骤说明
    stepsTitle: 修复流程
    step1Title: 先做备份
    step1Body: 修复前系统会提示先备份数据，避免意外。可前往「导出」生成 JSON 备份后再回来。
    step2Title: 执行扫描
    step2Body: 「数据恢复」会扫描所有 sessionId 不在 chat_sessions 表中的消息，按 sessionId 分组展示。无孤立时显示「未发现」。
    step3Title: 确认恢复
    step3Body: 扫描结果展示孤立组数和总消息数，确认后对每组创建新会话（标题格式「恢复的会话 YYYY-MM-DD」），迁移消息并删除原孤立记录。
    step4Title: 修复表结构
    step4Body: 「修复表结构」会纯增量补齐缺失的表、列、索引、FTS5 虚拟表。修复后弹出详细报告：新建表名 / 新增「表名.列名」列表 / 更新后的 schemaVersion。无变更时显示「无变更」。
    # 区别说明
    diffTitle: 与「清除所有数据」的区别
    diffBody: 修复 = 纯增量（CREATE IF NOT EXISTS + ALTER ADD COLUMN），绝不删除已有数据。清除 = DROP + CREATE，会清空所有会话和消息。
    # 入口
    entryTitle: 怎么进入
    entryBody: 设置 → 数据管理 → 数据恢复 / 修复表结构。

  # ── 6.3 清除所有数据（2026-07-27 新增）──
  clearDataWiki:
    title: 清除所有数据
  clearData:
    intro: 一键清空所有会话及其消息、分支、压缩点、故事记忆、轮次产物、失败历史和全文索引。API 供应商、模型模板、API Key 与本机偏好设置会保留。操作不可逆，请务必先备份。
    # 主视觉
    diagramTitle: 清空范围与流程
    diagramSubtitle: 会清空什么 / 会保留什么
    diagramClearTitle: 会清空的会话关联数据
    clearTableSessions: 会话和消息
    clearTableSessionsDesc: chat_sessions / chat_messages / 分支
    clearTableMemory: 故事模式记忆
    clearTableMemoryDesc: 经历类 / 事实层 / 中间产物
    clearTableFailure: 失败历史
    clearTableFailureDesc: failure_logs 表
    clearTableCompaction: 压缩点
    clearTableCompactionDesc: compaction_points 表
    diagramKeepTitle: 会保留
    keepPresets: API 供应商
    keepPresetsDesc: api_presets 表
    keepTemplates: 提示词模板
    keepTemplatesDesc: templates 表
    # 步骤说明
    stepsTitle: 清空流程
    step1Title: 二次确认
    step1Body: 红色危险卡片，点击后弹出确认对话框。需要明确确认才会执行，避免误触。
    step2Title: DROP + CREATE
    step2Body: 在单一事务内删除并重建会话关联关系表、索引与 FTS 虚表。实现对象数量可能随 Schema 演进，因此不以固定表数作为用户承诺。
    step3Title: 保留配置
    step3Body: api_presets 和 templates 不在清理范围；SharedPreferences 与安全存储也不会清空，因此 API Key、主题、语言、诊断设置和新手引导状态等本机偏好会保留。
    step4Title: 刷新统计
    step4Body: 执行完成后刷新存储统计：会话数、消息数归零，数据库文件大小不会立即缩小（SQLite 特性），但新数据会复用空间。
    # 警告
    warningTitle: 重要提示
    warningBody: 此操作不可逆。如需迁移数据请先用「导出」生成备份。仅清除当前设备数据，不影响云端或他人。
    # 入口
    entryTitle: 怎么进入
    entryBody: 设置 → 数据管理 → 清除所有数据（红色卡片）。

  # ── 6.4 诊断信息（2026-07-27 新增）──
  diagnosticsWiki:
    title: 诊断信息
  diagnostics:
    intro: 排查问题时查看运行日志、失败历史、调试开关。日志和失败历史相互独立：日志是全量文本记录，失败历史是结构化数据库记录。
    # 主视觉
    diagramTitle: 5 个区块
    diagramSubtitle: 状态 / 级别 / 调试 / 日志 / 失败
    diagramOverviewTitle: 状态概览
    overviewFailure: 失败记录数
    overviewFailureDesc: 大于 0 时红色高亮
    overviewLevel: 当前日志级别
    overviewLevelDesc: debug/info/warn/error
    diagramLevelTitle: 日志级别
    levelDebug: debug
    levelInfo: info
    levelWarn: warn
    levelError: error
    diagramDebugTitle: 调试开关（故事模式专用）
    debugPrompts: 记录完整提示词
    debugResponses: 记录最终回复
    debugMemories: 记录检索到的记忆
    debugKeywords: 记录提取的关键词
    debugPayloads: 记录完整请求负载
    diagramLogTitle: 运行日志
    logSource: FileLogSink 文件
    logSourceDesc: 同步写入 + 大小轮转 10MB
    logTail: 末尾 500 行
    logTailDesc: Isolate 反向随机读取
    logColor: 按级别着色
    logColorDesc: ERROR 红 / WARN 琥珀 / DEBUG 灰
    diagramFailureTitle: 失败历史
    failureSource: failure_logs 表
    failureSourceDesc: 最近 50 条结构化记录
    failureDetail: 点击展开详情
    failureDetailDesc: 含错误码/阶段/HTTP/原始异常
    # 步骤说明
    stepsTitle: 4 个常用操作
    step1Title: 调整日志级别
    step1Body: 切换 debug/info/warn/error 4 档，立即生效。排查问题时建议 debug，日常建议 info 或 warn。
    step2Title: 开启调试开关
    step2Body: 故事模式排障有 5 个开关，默认关闭以避免日志膨胀：提示词、回复、记忆、关键词和完整请求负载。
    step3Title: 查看失败历史
    step3Body: 列出最近 50 条失败记录，每条含会话 ID、模式、错误码、失败阶段、HTTP 状态、错误消息、原始异常。点击展开查看完整技术详情。
    step4Title: 分享或清空
    step4Body: 顶部「分享」按钮可分享当前同步写入的日志文件；「清空」会同时清空失败历史和日志文件（含轮转备份），需二次确认。
    # 文件特性
    fileTitle: 日志文件特性
    fileBody: 同步写入（避免 null 字节）+ UTF-8 编码 + ASCII 控制字符过滤 + 每次启动清空历史 + 10MB 大小轮转保留 1 个备份。Web 平台无文件日志。
    # 入口
    entryTitle: 怎么进入
    entryBody: 设置 → 诊断信息。

  # ── 7.1 故障排除 FAQ（2026-07-27 新增）──
  faqWiki:
    title: 故障排除 FAQ
  faq:
    intro: 收集用户最常遇到的问题和解决方法。错误卡片中的「错误码 + 错误分类 + 建议操作」三件套是排查起点，无法解决时再看本页。
    # 主视觉
    diagramTitle: 3 类错误码体系
    diagramSubtitle: 按模式区分
    diagramSimpleTitle: 对话模式 S001-S009
    simpleCount: 9 个错误码
    simpleCountDesc: 按错误分类直接映射
    simpleStrategy: 无自动重试
    simpleStrategyDesc: 失败即停，用户操作
    diagramIntermediateTitle: 故事模式 E010-E018 + E104
    intermediateCount: 8 个可见错误码
    intermediateCountDesc: 分阶段错误 + 嵌入调用失败
    intermediateStrategy: 含自动重试
    intermediateStrategyDesc: 重试用尽才整轮失败
    diagramCommonTitle: 以错误卡片实际显示为准
    commonCount: 不按连续区间推断
    commonCountDesc: 未显示的编号不是用户接口
    commonStrategy: 视场景而定
    commonStrategyDesc: 部分有自动重试
    # 按场景分类 FAQ
    scenesTitle: 常见场景 FAQ
    scene1Title: 发送消息没反应
    scene1Body: 先看错误卡片的错误码。config 类（对话模式 S001/故事模式 E010）= 配置不完整，去设置检查 API 供应商和模型；network/timeout 类（对话模式 S002/故事模式 E016）= 网络问题，切换 Wi-Fi/移动数据后重试。
    scene2Title: 流式输出中途断了
    scene2Body: 对话模式会保留已接收内容，可重新生成或编辑后重发。故事模式流式中断通常显示 E016 并按策略重试；整轮失败后半截正文保留为未完成稿件卡（可复制），失败栏可选「以此收稿」「续写」或整轮重试。各阶段失败行为参见「故事模式用法 → 失败处理」。
    scene3Title: 故事模式整轮失败后消息会丢吗
    scene3Body: 不会。用户消息完整保留，仅清空中间产物（生成内容/检索结果/摘要）。可点击「从中断处继续」保留已完成阶段产出，或「整轮重试」从头开始；生成阶段失败时半截正文会保留为未完成稿件卡，可「以此收稿」或「续写」。参见「故事模式用法 → 失败处理」。
    scene4Title: 压缩对话失败
    scene4Body: 对话模式会显示压缩失败卡片，可点「重试」或稍后再次发送；也可缩短对话或切换上下文窗口更大的模型。请以当前错误卡片的建议操作为准。
    scene5Title: 嵌入模型调用失败（E104）
    scene5Body: 故事模式特有。三选一：「重试」再调用一次；「临时降级为关键词检索」跳过 embedding 用 FTS5 继续；「中止」停止本轮。建议日常先配置嵌入模型。
    scene6Title: API Key 无效（对话模式 S003）
    scene6Body: 前往「设置 → 通用设置 → 供应商」→ 编辑对应供应商 → 更新 API Key。Key 仅存在本设备 flutter_secure_storage，不上传云端。
    scene7Title: 上下文窗口不足
    scene7Body: 两种处理：(1) 手动压缩对话——会话菜单 → 手动压缩，或点输入区圆环详情里的「立即压缩」；(2) 切换上下文窗口更大的模型——会话设置 → 模型。
    scene8Title: 数据库表结构不完整
    scene8Body: 先备份，再尝试「设置 → 数据管理 → 修复表结构」。该工具按当前 Schema 增量补齐表、列与索引；若仍失败，请保留日志并更新应用或报告问题。
    # 2026-09-16：补导演模式选型 FAQ（附录页此前无导演场景条目）
    scene9Title: 导演模式和故事模式怎么选
    scene9Body: 看你想不想亲自执笔：故事模式是你写一句、AI 接一段，剧情由你亲自推进；导演模式（默认开启）是你定规则、纠方向、把关写入，AI 总编辑自主执笔。两者共用记忆库与角色卡/世界书。参见「导演模式 → 导演模式是什么」。
    # 错误信息识别
    identifyTitle: 错误信息识别指南
    identifyBody: 每个错误卡片都包含三件套：错误码（对话模式 S 码/故事模式 E 码，如 S001、E010）+ 错误分类（如 config/network/auth）+ 建议操作（具体可执行步骤）。先看建议操作，多数问题可直接解决。
    # 链接
    linkTitle: 故事模式失败处理详解
    linkBody: 故事模式的原子事务原则、各阶段失败处理、UI 保留时序、手动重试逻辑、事实层特殊失败降级等深度内容，请查看「故事模式用法 → 失败处理」。
    # 入口
    entryTitle: 怎么进入
    entryBody: 帮助 → 附录 → 故障排除 FAQ。

  # ── 7.2 术语表（2026-07-27 新增）──
  glossaryWiki:
    title: 术语表
  glossary:
    intro: 项目中常见技术术语的通俗解释。全部用日常类比说明，不需要任何编程背景也能看懂。按使用场景分 3 组。
    # 主视觉
    diagramTitle: 3 组术语分类
    diagramSubtitle: 按使用场景
    diagramApiTitle: LLM / API 组
    #  修复：术语表实际 16 条，宣传数字过期
    apiCount: 9 个核心术语
    apiCountDesc: 调用 AI 必备
    apiExamples: API Key / baseUrl / SSE / Token
    diagramMemoryTitle: 记忆 / 检索组
    memoryCount: 8 个核心术语
    memoryCountDesc: 故事模式核心
    memoryExamples: CompactionPoint / 嵌入模型 / FTS5
    diagramProjectTitle: 项目特定组
    # 批二三词条接线页面后 21→24；v0.4.0 外观词条 +2
    projectCount: 34 个核心术语
    projectCountDesc: 三种模式
    projectExamples: 对话 / 故事 / 导演 / Fork / 世界书 / 角色卡
    # LLM/API 术语
    apiTitle: LLM / API 术语
    apiKey:
      term: API Key
      desc: 调用 AI 服务的「通行证」，相当于 Java 后端的 token，每次请求都要带上，AI 服务商用它计费。
    baseUrl:
      term: baseUrl
      desc: AI 服务的「接口地址前缀」，相当于 Java 后端的 http://localhost:8080/api，不同供应商有不同前缀。
    sse:
      term: SSE（Server-Sent Events）
      desc: 服务器推送事件，让 AI 像打字机一样一个字一个字往外蹦。相当于 Java 中的 WebSocket 但只服务器→客户端单向。
    stream:
      term: 流式输出
      desc: AI 边写边显示给用户看，不用等整段写完。底层用 SSE 实现。
    token:
      term: Token
      desc: AI 处理文本的最小单位，类似 Java 字符串的字符但更细——一个汉字约 2 个 token，一个英文单词约 1 个 token。计费按 token 算。
    contextWindow:
      term: 上下文窗口
      desc: AI 单次能「看到」的文本总量上限，类似 Java 方法参数不能无限长。从 8K 到 1M 以上不等，取决于模型。
    temperature:
      term: 温度（Temperature）
      desc: AI 输出的「随机度」——0=每次回答都一样（适合查资料），1=每次回答都不同（适合创作）。默认 0.8 适合故事。
    reasoningEffort:
      term: 思考预算（Reasoning Effort）
      desc: 某些模型（如 DeepSeek-R1）有「深度思考」能力，思考预算控制思考多深：disabled/low/medium/high。
    samplingParamsOmit:
      term: 采样参数省略（Omit Sampling Parameters）
      desc: 部分新模型或严格校验的中转站会拒绝非默认 temperature / top_p。开启供应商级开关后，该供应商的所有请求都不带这些参数，由模型使用默认值——遇到 400「does not support non-default temperature」时打开它。
    # 记忆/检索术语
    memoryTitle: 记忆 / 检索术语
    compactionPoint:
      term: CompactionPoint
      desc: 上下文压缩「快照点」。对话太长时把早期消息压成一段摘要，类似 Java 中把日志归档——归档后只看摘要不看原始日志。
    embedding:
      term: 嵌入模型（Embedding Model）
      desc: 把文字转成一组数字（向量）的 AI 模型。两段文字意思相近，数字就相近。是「语义检索」的基础。
    vectorIndex:
      term: 向量索引
      desc: 把记忆文本转成向量后存的「索引表」，能按「意思相近」找记忆，不只是按「字面相同」。
    fts5:
      term: FTS5
      desc: SQLite 自带的「全文检索」插件，类似 MySQL 的 FULLTEXT 索引。按关键词找记忆，找「古碑」能找到含「古碑」的记忆。
    hybridSearch:
      term: 混合检索（Hybrid Search）
      desc: 同时用 FTS5（关键词）+ 向量（语义）两路找记忆，再合并结果。故事模式两路权重各 0.5。
    factualMemory:
      term: 事实层（Factual Memory）
      desc: 存「世界设定」的记忆——角色属性、世界规则、地名等。长期不变，按 key-value 结构存。
    experientialMemory:
      term: 经历层（Experiential Memory）
      desc: 存「剧情事件」的记忆——发生过的事。只追加不修改，类似 Java 的 append-only 日志。
    eventSummary:
      term: 事件摘要（EventSummary）
      desc: 每轮对话结尾由 AI 生成的「剧情摘要」，含 5W1E 六字段（when/where/who/what/significance/extra）。存入经历层。
    # 项目特定术语
    projectTitle: 项目特定术语
    simpleMode:
      term: 对话模式（Simple）
      desc: v0.1 交付，类 ChatBox 的自由对话工具。中性色 + 无衬线字体，工具消失于任务。
    intermediateMode:
      term: 故事模式（Intermediate）
      desc: v0.2 交付，叙事沉浸模式。衬线叙事正文 + 跟随全局外观，自动记忆剧情。
    advancedMode:
      term: 导演模式（Advanced）
      desc: 第三种模式（默认开启）：AI 总编辑按项目规则在幕后自主运转世界、执笔正文。具备监督模式、请示导演、事件日志等能力；旧独立 HUD 蓝图已废弃。
    configDisplayMode:
      term: 配置显示模式
      desc: 设置 → 通用页底的「简单/进阶」开关（默认简单）。简单模式只显示常用配置（供应商、选模型、模板资源、剧情节奏等白话项）；进阶模式显示全部配置。切换即时生效；过滤只动展示层，被隐藏项已有值继续生效。
    themeStructure:
      term: 主题结构
      desc: 「界面长什么样」的外观轴（v0.4.0 起）。经典=清晰平面；琉璃=磨砂玻璃材质（波尔多配色的原生载体）；印刻=利落描边与按压（原名「棱角」）；漫游=叙事展厅。设置 → 通用 → 外观选择，与配色自由搭配。
    paletteFamily:
      term: 配色族
      desc: 「用什么配色」的外观轴（v0.4.0 起）。经典=日光/夜航两档；波尔多=深夜酒馆雅座（夜）+清晨画廊白墙（日）。任意结构 × 任意配色组合都成立。
    projectRules:
      term: 项目规则
      desc: 导演模式的常驻背景规则（世界观、人设、文风、叙事守则）。整场会话生效，AI 不会改写；可从模板库直选一条快速开始。
    supervisionMode:
      term: 监督模式
      desc: 开启后，导演每次写入记忆库都暂停并弹出确认卡，由你逐项「允许 / 拒绝」；关闭时这些写入自动执行。
    askDirector:
      term: 请示导演
      desc: 导演主动向你发起的决策请求，弹出「导演决策」卡；可输入回答，也可「跳过」让它自行决定。
    gmModel:
      term: 导演主模型
      desc: 导演自主执行所用的模型；未单独配置时使用全局「生成」模型。
    storyAnchorTerm:
      term: 剧情锚
      desc: 导演维护的当前剧情位置（人物/地点/时间等），跨轮续写时快速回到现场；幕间回顾卡由它生成。
    backstageTerm:
      term: 台前 / 幕后
      desc: 导演会话的过程分层：台前只有正文与一行过程；幕后是逐步骤的工作卡（翻阅前情、查证设定等），点幕后汇总行（「幕后 N 步 · 思考 M 段」）展开或收起。
    eventLog:
      term: 事件日志
      desc: 导演每一步工作的流水记录；应用崩溃或重启后按它恢复现场、接着续写。
    fourStepGen:
      term: 六步生成
      desc: 故事模式每轮对话的流程：extracting（提取关键词）→ retrieving（检索记忆）→ generating（生成）→ reviewing（审查，可选）→ summarizing（生成摘要）→ persisting（固化入库）；上下文接近上限时轮前先自动压缩。默认 3 次 AI 请求，开启审查阶段后为 4 次。
    fork:
      term: Fork（分支）
      desc: 从某条消息「分叉」出一条新对话线，类似 Git 分支。可探索不同选择带来的不同剧情。
    worldbook:
      term: 世界书（World Book）
      desc: 提前写好的设定词条集合（如货币规则、地理、魔法体系）。从资源库导入并应用到会话后，作为只读「种子」设定参与世界运转，与运行中学到的事实并存；不可在会话中修改。
    characterCard:
      term: 角色卡（Character Card）
      desc: 提前预制的角色设定（姓名/性格/背景）。导入后作为只读基线，故事中的性格转变只会追加、不覆盖原设定。
    resourceLibrary:
      term: 资源库
      desc: 存放导入的角色卡与世界书的全局仓库（设置 → 角色卡/世界书），可应用到故事会话。
    # 09-14 只读语义 2.0 只更新了仓库侧术语表，
    # 应用内缺收——记忆库「基线/演变」徽标是用户高频接触的新词
    readonlyBaseline:
      term: 只读基线
      desc: 导入实体（世界书/角色卡）的基线属性行：永不改写、不可移除；主名亦属基线（AI 改名意图会转为别名，旧主名保留）。
    evolvedRow:
      term: 演变行
      desc: 与基线同键并存的 AI 演变属性行：承载剧情变化；注入时与基线聚合为「原内容（初始）；新内容（演变）」。记忆库属性行带「基线/演变」行级徽标。
    # 2026-09-16：故事模式新能力术语
    storyVariant:
      term: 变体（稿件版本）
      desc: 同一轮正文的多个版本：故事/导演模式里重生成或编辑重发时旧稿自动存为变体，稿件卡下方的 ◀ n/m ▶ 切换器可查看、复制、设为当前或删除；切换变体后，后续剧情的上下文也随之改变。
    acceptPartialAsFinal:
      term: 以此收稿
      desc: 故事生成失败时的收稿出口：把已写出的半截正文直接作为本轮定稿，照常走完摘要与入库。
    continueWritingTerm:
      term: 续写
      desc: 故事生成失败后的继续出口：带着半截正文续跑生成，AI 接着已写内容往下写，不重复已有正文。
    inSessionSearchTerm:
      term: 会话内搜索
      desc: 在单个会话内按关键词查消息（会话菜单或桌面 Ctrl/Cmd+F）：命中可上一处/下一处跳转并高亮闪示，命中过多时显示截断提示。
    readingPositionTerm:
      term: 阅读位置记忆
      desc: 离开故事会话时自动记住滚动位置，再次进入时恢复到上次阅读处。
    # 补录 v0.3 新术语（术语表此前停在 08-19）
    narrativePacing:
      term: 剧情节奏
      desc: 导演模式的叙事推进档位（保守/平衡/激进三档）。控制每轮正文的景别——细描慢推还是快进大步；仅激进档要求正文写满写足，保守/平衡篇幅随叙事自定；全局设默认，会话内可临时换档。
    toolPermissions:
      term: 工具权限
      desc: 导演模式下每个工具的独立开关，三态：允许（直接执行）/ 询问（执行前弹审批卡）/ 禁用（对导演不可见）。全局设默认，会话可覆盖；监督模式预设是一键组合。例外：「提交本轮（finish_round）」固定为允许不可禁用（禁用会令正文无法交付）。
    roundBudget:
      term: 轮预算
      # 2026-09-06 对齐 budgetBody 四维口径（步数/时间/累计消耗/上下文余量）
      desc: 导演每轮自主执行的上限，共四维：步数、时间、累计 token 消耗与上下文余量。任一到顶都先收尾再停（软着陆）；设为无上限时仍受其余维度保护。
    scriptBoard:
      term: 场记板
      # 注入面同源只读视图
      desc: 「AI 眼中的现在」只读面板（会话菜单进入）：关键实体/剧情主线/叙事时间/剧情锚，与每轮注入模型的 core blocks 同一份数据装配——所见即 AI 所见，可与幕后轨迹页互验。
    pureReading:
      term: 纯净阅读
      desc: 导演会话顶栏的一键阅读模式：隐藏全部幕后过程与指令气泡，只留稿件流、幕间回顾卡与压缩摘要；偏好按会话记忆，切回正常模式即可恢复操作入口。
    contextComposition:
      term: 上下文构成
      # 并入上下文圆环详情面板
      desc: 上下文用量详情面板的构成区：把最近一次请求的输入按系统提示词/场记板/历史对话/本轮指令四段展示占比与估算 token（按装配期字符占比拆分，面板内有估算口径标注）。
    contextUsage:
      term: 上下文用量
      # 补手动压缩与撤销入口（三模式同款）
      # 上下文配置收敛：措辞统一「上下文压缩阈值」
      desc: 输入区小圆环指示器：满刻度=上下文压缩阈值。点开详情面板可看窗口用量、缓存命中率、最近一轮 token 明细；对话足够长时可手动「立即压缩」，压缩摘要卡还可撤销最近一次压缩（对话/故事/导演三模式同款）。
    foreshadowSweep:
      term: 伏笔定期清点
      desc: 导演模式的伏笔对账机制：每隔 N 轮（默认 8，可在导演设置调整）在轮尾提醒未兑现的伏笔清单；清点轮提交时若仍有未处理伏笔，终审提醒会拦下一次，划去已兑现或确认后才放行——防止已埋伏笔长期挂着无人问。
    roundTimeline:
      term: 轮时间线
      desc: 导演每轮幕后工作的忠实回放：思考、播报、动作按真实发生顺序交错排列，随轮存档，重进会话可回看。
    # 入口
    entryTitle: 怎么进入
    entryBody: 帮助 → 附录 → 术语表。

  # ── 7.3 功能索引表（2026-07-27 新增）──
  featureIndexWiki:
    title: 功能索引表
  featureIndex:
    intro: 按模块列出全部功能，每行包含功能名与简要说明。
    # 主视觉
    diagramTitle: 6 大功能模块
    diagramSubtitle: 按版本归属
    diagramSimpleTitle: 对话模式（v0.1）
    simpleCount: 15+ 功能
    simpleCountDesc: 会话/消息/压缩/分支
    diagramIntermediateTitle: 故事模式（v0.2）
    intermediateCount: 12+ 功能
    intermediateCountDesc: 六步生成/记忆/事实层
    diagramDirectorTitle: 导演模式（v0.3）
    directorCount: 30+ 项能力
    directorCountDesc: 规则/监督/日志…
    diagramSettingsTitle: 设置（v0.1+v0.2）
    settingsCount: 10+ 功能
    settingsCountDesc: 供应商/模型/模板/外观
    diagramDataTitle: 数据维护（v0.1+v0.2）
    dataCount: 8+ 功能
    dataCountDesc: 导出/恢复/清除/诊断
    diagramHelpTitle: 帮助（v0.2 起，随版本扩充）
    helpCount: 47 个 Wiki 入口
    helpCountDesc: 新手引导/使用手册
    # 5 大模块
    moduleSimpleTitle: 对话模式功能
    moduleSimpleBody: v0.1 交付。会话管理（创建/删除/收藏/排序/搜索）、消息发送（流式/编辑/重发/引用）、分支 Fork、CompactionPoint 压缩、模型选择、会话设置、思考预算、模板系统、附件上传、工具调用展示、思考内容展示、上下文用量圆环与手动压缩（与故事/导演同款）、流式长会话渲染优化（冻结前缀分块渲染）、会话内搜索（菜单/Ctrl+F，非模态搜索条+命中定位闪示，分支一致过滤）。
    moduleIntermediateTitle: 故事模式功能
    moduleIntermediateBody: v0.2 交付。六步生成流程（压缩→提取→检索→生成→审查→摘要→入库）、经历记忆、事实记忆三表、累积压缩摘要与分段宏摘要、5W1E、叙事时间、记忆库、嵌入模型、FTS5+Vector 检索、分阶段模型、工具调用模式、失败处理 E010-E018/E104 和轮次产物持久化；上下文用量圆环与手动压缩、会话顶部世界状态条、压缩摘要卡「已归档第 X–Y 轮」标注与「撤销压缩」、找相似聚类与疑似重复归并预选、空态示例开场、思考区流式（自动展开/限高/复制）、继续生成接写合并（单气泡+续写徽标）、流式长会话渲染优化（冻结前缀分块渲染）；记忆检索可达性硬化（切词与主表子串兜底，库里可见即可查到）、记忆索引健康条（缺行/嵌入维度不匹配）与一键重建、经历归档标识与三档筛选、复制会话完整继承记忆与向量、压缩宏摘要可检索、世界书/角色卡只读语义（基线永不改写、演变并存，记忆库行级徽标，应用预览三段式）；故事稿件变体（重生成/编辑重发自动快照旧稿，稿件卡下方 ◀ n/m ▶ 切换器可查看/复制/设为当前/删除，切换后上下文随之改变）、中断正文保留（半截正文保留为未完成稿件卡，失败栏可「以此收稿」或「续写」不重复已有内容）、稿件导出（范围×内容导出 Markdown）、会话内搜索（菜单或 Ctrl/Cmd+F，命中跳转+高亮闪示）、阅读位置记忆（重进恢复上次阅读处）；入口开关（默认隐藏，设置 → 故事模式设置 开启，开启后首页/侧边栏/快捷键恢复入口，不影响已有数据）。
    moduleDirectorTitle: 导演模式
    moduleDirectorBody: v0.3 交付。项目规则、主模型与分阶段模型、步数/时间预算与软着陆、监督模式（逐项审批写入）、请示导演（支持「一直等待」档与横幅倒计时）、台前/幕后过程分层（轮时间线）、幕间回顾卡（设定集变更直达记忆库）、事件日志与重启恢复、技能手记、子代理（同任务书二次派发直接回执上次结论）、记忆库实体归并、独立设置体系（三态工具权限）、剧情节奏三档、上下文用量指示与手动压缩、压缩摘要卡撤销压缩、伏笔定期清点（每 N 轮轮尾提醒+清点轮终审对账闸门）、角色卡/世界书种子应用入口、流式长会话渲染优化（稿件卡冻结前缀+合帧）、稿件变体（重生成不覆盖旧版，稿件卡右下 n/m 切换器）、重试等待倒计时状态条与会话打开加载骨架、事件日志滚动保留（默认最近 20 轮，超限自动清理）、记忆库来源/常驻徽标与词条级注入停用、角色卡/世界书应用前预览、推荐回复候选数量与单条字数入口、会话检索松紧度三档（保守/平衡/宽松，快照写会话列）、轮中预算进度标题（第 N/M 步·已用时长，预算将尽转警示色）、复制会话补齐轮产物与稿件变体、稿件导出（范围×内容四选 Markdown）、剧情锚编辑（Recap 卡入口，与 AI 同一数据源）、场记板视图（「AI 眼中的现在」，注入面同源）、失败轮未定稿徽标、伏笔清单展开全部、播报行弱化、同类动作聚合行（×N 展开）、纯净阅读模式（按会话记忆偏好）、系统裁决 3s 提示（溢出自愈/HITL 超时）、上下文构成分布（圆环详情面板四段估算）、单一「上下文压缩阈值」旋钮（百分比⇄token 双显示，token 直输反推；窗口上限高级折叠，0=自动+生效值披露）、失败真续跑（失败后「从中断处继续」经事件日志投影复用已完成的步骤与产出，不再整轮重跑；停止保留的半截正文合成进续跑上下文，模型从断句处继续）、导演会话创建向导（首页独立入口三步「模型→嵌入模型→项目规则」走完即进配置就绪会话：未配置用户从模板接供应商+贴 Key+拉模型并顺带写全局默认，已配置用户直选模型仅本会话覆盖；嵌入模型三态可跳可关；规则步模板直选或三题问卷→本地拼装/模型生成（知情确认）→预览采用并默认存模板）。 历史正文搜索：摘要不足以核实细节时，AI 可改用少量关键词搜索已保存的用户输入、正文和最终回复，按轮号定位后回读；不受记忆重要性评分影响。
    moduleSettingsTitle: 设置功能
    moduleSettingsBody: v0.1-v0.3。API 供应商管理（7 个内置模板 + 自定义；高级参数 JSON 透传协议特有参数）、默认模型选择、分步骤模型（含「影响：XX」消费者标注）、提示词模板系统、故事模式 10 段提示词自定义、外观（三轴：主题结构×配色族×深浅，12-22 档字体）、语言与输入（界面语言：简体中文/English 切换即时生效）、高级设置（思考预算/超时/标题模型/请示等待含一直等待档）、显示偏好、自动压缩、全局生成默认（对话 maxTokens 留空由模型决定）、模型测试、供应商级「不发送采样参数」开关（严格校验 temperature / top_p 的中转站与模型可自助省略）、导演模式开关、角色卡/世界书资源库入口、AI 建卡（与 agent 对话生成/编辑角色卡与世界书草稿，确认后落库，含覆盖保存护栏与退出拦截）、会话级设置面板（模型/温度/单轮步数+实时草稿预览+完成创建，落库后自动退出）、助手消息 Markdown 渲染与改稿过程线、首用模型选择真正生效、配置双模式（设置 → 通用「配置显示模式」开关：简单模式只显示常用配置，进阶=全部配置；全部设置页与会话内面板按级别过滤，被隐藏项已有值继续生效；向量化/嵌入模型配置在简单模式下同样可见）。
    moduleDataTitle: 数据维护功能
    moduleDataBody: v0.1+v0.3。全量导出（多选 + API Key 开关，v3 备份含角色卡/世界书/自建模板/导演事件日志）、单会话导出（JSON/Markdown/TXT）、全量导入（追加/覆盖，完成报告含资产行数与 API Key 重填直达；覆盖导入前自动快照到 backups/ 保留最近 2 份、快照失败中止导入）、自动备份（24h 静默滚动保留 3 份，按前缀分域不动快照与外来文件）、数据恢复（孤立消息）、修复表结构（纯增量不丢数据）、清除所有数据、诊断页（失败历史 + 日志 + 调试开关）、存储统计（含导演事件日志条数与体积，滚动保留默认最近 20 轮）、导入进度反馈（导入全程不可关闭弹层）、外部打开分流（用「打开方式/分享」发给应用的备份 JSON 自动进入数据导入，不再误入资源库）。
    moduleHelpTitle: 帮助功能
    moduleHelpBody: v0.2 交付。新手引导（6 步首次启动 + 可重温）、Wiki 主目录（8 个章节分组、47 个入口，含搜索）：开始使用 / 对话模式用法 / 故事模式用法 / 故事模式原理 / 导演模式 / 配置与个性化 / 数据与维护 / 附录。
    # 入口
    entryTitle: 怎么进入
    entryBody: 帮助 → 附录 → 功能索引表。

