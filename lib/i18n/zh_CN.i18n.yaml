      promptHint: 输入框内容即为生效内容。留空保存则回退到内置默认。
      restoreDefault: 恢复默认
      promptSaved: 推荐回复提示词已保存
      promptResetDone: 已将内置默认提示词填入输入框
      promptResetConfirm: 确定将内置默认推荐回复提示词填入输入框吗？填入后会自动保存，可基于它继续修改。
      generationSection: 生成参数
      temperature: 温度
      temperatureHint: 控制候选回复的多样性，值越高越发散
      maxTokens: 最大 Token 数
