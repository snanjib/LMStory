      sandboxNoticeDesktop: 备份目录在你的「文档」目录的 backups 文件夹内，可直接用文件管理器查看；迁移到别的设备请用「导出数据」。
      sandboxNoticeMacos: 备份目录在应用自己的沙盒空间内（资源库/Containers 下），Finder 里不易直接找到；点「打开备份目录」可直达。迁移到别的设备请用「导出数据」。
