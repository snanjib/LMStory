        generated: "石门在身后沉重地合拢。密室不大，四壁刻满了与走廊壁画相同的符文。正中央的祭坛上摆放着一具水晶棺椁，棺中躺着画中那位女子——面容栩栩如生，仿佛只是沉睡。墙上的画像与棺中人别无二致，唯有画中人的眼睛是睁开的，正随着你的移动缓缓转动。空气中的甜香浓烈到了令人眩晕的程度。"
        compactionSummary: "【前情摘要】你在暴雨夜进入古堡，在门厅壁画上认出长袍人围圈祭祀的场景，并在二楼书房找到记事本残页，得知堡中女主人与某种古老仪式有关。你循着甜香与符文指引来到地下走廊，推开尽头刻有双环纹章的石门。"
        reply: "石门在身后沉重地合拢，符文在火光中微微闪烁。密室中央的水晶棺椁中躺着画中那位女子——面容栩栩如生。墙上的画像与棺中人别无二致，唯有画中人的眼睛是睁开的，随着你的移动缓缓转动。你想起壁画上围圈的长袍人与石盆，意识到这甜香或许与某种古老的祭祀有关。棺椁旁的符文似乎在引导你触碰什么，但画中人的目光让你脊背发凉——她在等待你的选择。"
        mem1Summary: "主角抵达被藤蔓吞噬的古堡，推开生锈铁门进入幽暗门厅，闻到陈年霉味与残留熏香。"
        mem2Summary: "主角沿右侧走廊深入，见到壁画（长袍人围圈、石盆）与雕花橡木门，门后传来古语吟唱与幽蓝微光。"
