      title: 预览拼接效果
      mockBanner: 以下为模拟数据预览——固定示例输入配合当前提示词配置拼装。实际对话时会替换为真实内容。
      sample:
        userInput: "我推开密室尽头的石门，一阵腐朽的冷风扑面而来。火把的光芒里，墙上挂着一幅褪色的画像——画中人的眼睛似乎正盯着我。"
        history1User: "我是一名流浪的考古学者，在山间迷路三天后，终于看见了一座被藤蔓吞噬的古堡。我推开了生锈的铁门。"
        history1Assistant: "铁门发出刺耳的呻吟，惊起梁上数只乌鸦。门厅高大而幽暗，尘埃在斜射的光柱中翻飞。正前方一座断裂的石阶通向黑暗，两侧走廊尽头各有一盏熄灭的壁灯。空气中弥漫着陈年霉味，还夹杂着一丝若有若无的甜香——像是很久以前焚过的熏香，至今未散。"
        history2User: "我点燃壁灯，沿着右侧走廊深入。走廊尽头是一扇雕花橡木门，门后传来低沉的吟唱声。"
