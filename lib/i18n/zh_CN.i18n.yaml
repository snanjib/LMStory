# 新手引导（2026-07-20 新增）
# 首次启动全屏覆盖 + 设置主页底部入口可重复访问
# 6 步详细版：欢迎 → 双模式 → API Key → 模板 → 记忆 → 开始使用
onboarding:
  # 设置主页入口卡片
  # 通用按钮
  skip: 跳过
  prev: 上一步
  next: 下一步
  done: 开始使用
  close: 关闭
  # 步骤指示器："步骤 $current / $total"
  stepIndicator(current, total): "步骤 $current / $total"
  # Step 1：欢迎介绍
  welcome:
    title: 欢迎来到 LMStory
    #  首屏换血：与 home.subtitle 同源（项目定位）
    subtitle: 你推进，AI 回应，世界生长。
    desc: 让 AI 成为你故事的共同创作者——不只是问答，更是真正记得过往经历的长期伙伴。
  # Step 2：双模式说明
  modes:
    title: 三种模式，三种玩法
    subtitle: 工具、沉浸与导演，按需选择
    chatTitle: 对话模式
    chatDesc: 自由配置的 AI 对话工具，类似 ChatBox。支持多会话、分支、模型切换、模板系统。
    storyTitle: 故事模式
    storyDesc: 叙事沉浸·衬线正文。AI 自动记忆剧情发展，按步骤配置生成更深入的回复。入口默认隐藏，可在故事模式设置中开启。
    directorTitle: 导演模式
    directorDesc: 你写项目规则，AI 总编辑在幕后自主检索记忆、维护设定并执笔正文。默认开启，可在设置中关闭。
  # Step 3：API Key 配置引导
  apiKey:
    title: 配置你的 AI 模型
    subtitle: 任意 OpenAI 兼容供应商皆可
    desc: LMStory 不内置模型，需要你提供 API Key。支持 OpenAI、DeepSeek、OpenRouter 等供应商，也可自定义任意 OpenAI 兼容端点。
    goConfig: 去配置
    later: 稍后
  # Step 4：提示词模板介绍
  template:
    title: 丰富的提示词模板
    subtitle: 内置多种场景模板，开箱即用
    desc: 内置「异世界穿越叙述者」等系统提示词模板。新建对话时可在系统提示词选择器中挑选（开启故事模式入口后，新建故事同样可选），也可自定义模板。
    goView: 去查看
  # Step 5：记忆机制简介（故事模式）
  memory:
    title: AI 自主记忆剧情
    subtitle: 故事与导演共享的记忆
    # 弃维护的故事模式不再独占首启 1/6 篇幅
    # ——记忆基建（批 J-b 徽标/注入停用）同服务导演模式
    desc: AI 会自动记住每轮对话中的事件、人物、地点，建立专属剧情记忆。下次对话时 AI 会回忆相关内容，故事与导演模式共用这套记忆，让情节自然延续而非断片。
    # 顺序对齐实际管线 extracting→retrieving→generating
    #（旧顺序"先生成初稿再查记忆"与 Wiki 原理页互相矛盾）
    flow1: 用户输入
    flow2: 提取关键词
    flow3: 检索相关记忆
    flow4: 融合记忆生成回复
  # Step 6：开始使用
