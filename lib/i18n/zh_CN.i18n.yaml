      restoreSectionSnapshots: 覆盖导入前快照
      nothingToRestore: 暂无备份或快照可恢复
      restoreReadFailed: 备份文件读取失败，请重试
    #  修复：与 Wiki/帮助入口统一名称「清除所有数据」
