# 帮助页（2026-07-26 新增）
# 设置主页底部入口 → 跳转 WikiHomePage（带搜索 + 8 章节说明书）
help:
  # 主页
  title: 帮助
  entrySubtitle: 使用入门与原理说明

  # 子页目录
  firstLaunchWiki:
    title: 第一次打开 App
  homeOverviewWiki:
    title: 界面总览
  flowWiki:
    title: 六步生成流程
  memoryWiki:
    title: 记忆机制
  failureWiki:
    title: 失败处理

  # 生成流程子页内容（2026-07-26 v2 重构：图形化布局）
  # 图示标签入 slang（原 widget 硬编码中文）
  flowDiagram:
    inputLabel: 输入
    outputLabel: 输出
    roundN: 第 $n 轮

  # 主流程图 + 角色图 + 6 个增强步骤卡片 + 视觉时间轴
  # 步骤详细说明精简为 2-3 个短句要点（keyPoints）
  flow:
    # 顶部主流程图标题
    overviewTitle: 整体流程
    overviewSubtitle: 每轮对话按顺序执行 6 个阶段

    # 引言（保留作为页面顶部说明）
    # v0.2.2：reviewing 改为可选，默认 3 次 AI 调用，开启审查阶段为 4 次
    intro: >-
      故事模式每轮对话按顺序做 5-6 件事：提取关键词 → 检索记忆 → 生成内容 → （可选审查阶段）→ 生成摘要 → 入库。默认 3 次 AI 请求 + 1 次本地检索 + 1 次向量化；开启审查阶段后为 4 次 AI 请求。

    # 编辑部比喻
    metaphorTitle: 用编辑部比喻理解
    metaphorSubtitle: 把故事模式想象成一个编辑部写小说的流程

    # 6 个步骤详解（每个含 input/output/keyPoints）
    # extracting 前置到 generating 之前
    step1Title: 提取关键词
    step1Input: 你的消息 + 最近对话 + 提取提示词
    step1Output: 5 类关键词（角色/物品/地点/动作/情节）
    step1Points:
      - 「角色/物品/地点」3 类实体词：走 FTS5 精确匹配（如「李逍遥」「古碑」「蜀山」）
      - 「动作/情节」2 类经历词：走向量语义匹配（如「斩妖」「碑文显现」）
      - 关键词是检索查询条件，不是存进数据库的记忆

    step2Title: 检索记忆
    step2Input: 第 1 步的 5 类关键词
    step2Output: 经历摘要类记忆 + 事实类记忆检索结果
    step2Points:
      - 纯本地操作，不调 AI，速度快
      - 5 路并行检索：角色/物品/地点 3 类走 FTS5 精确匹配，动作/情节 2 类走向量语义匹配
      - 经历层合并后最多保留 12 条；关键实体默认以重要性 ≥5 判定，事实注入数量由配置控制

    step3Title: 生成内容
    step3Input: 你的消息 + 角色设定 + 最近对话 + 检索记忆
    step3Output: 一段生成回复
    step3Points:
      - v0.2.2 起生成阶段注入检索记忆 + 事实记忆 + 压缩摘要，生成质量本身有保障
      - AI「假装在进行正常的角色扮演」，提示词里不说「这是生成内容」，避免 AI 偷懒
      - 显示在屏幕上方的「生成面板」，正文同步流式显示

    step4Title: 审查阶段（可选）
    step4Input: 生成内容 + 检索记忆 + 事实记忆
    step4Output: 最终回复正文
    step4Points:
      - v0.2.2 起默认关闭（生成即最终，省 1 次 AI 调用），可在设置中手动开启
      - AI 先审查生成内容，分 3 节：事实一致性 / 叙事质量 / AI 味（清单含 8 个模式）
      - 基于审查结果重写最终回复：有错就改，无错就润色，流式显示在主聊天区域

    step5Title: 生成摘要 + 提取事实
    step5Input: 最终回复 + 你的消息
    step5Output: 5W1E 事件摘要 + 事实变更 deltas
    step5Points:
      - 并行调用两个工具（事件摘要工具 + 事实变更工具）
      - 事件摘要：5W1E 六字段 + 绝对叙事时间 + 重要性 + 标签
      - 事实变更：新建实体 / 修改属性 / 添加别名（无变更则传空数组）

    step6Title: 持久化入库
    step6Input: 回复 + 摘要 + 事实 deltas + embedding
    step6Output: 核心记录与可选索引入库
    step6Points:
      - 消息、经历记忆、轮次产物和会话元数据在本地事务中写入
      - 低重要性记忆可能不建向量/全文索引；单条无效事实变更会被跳过，不阻塞核心经历链路
      - 切换会话再切回来，生成内容和检索结果仍可见

    # 视觉时间轴
    visualFlowTitle: 用户在屏幕上看到什么
    visualFlowSubtitle: 4 个折叠小窗 + 1 个主回复区域（压缩小窗条件触发时显示）
    # 节点名称+描述（2026-07-26 新增：与实际 UI 文案对齐，避免硬编码过时）
    # 节点顺序调整为 压缩?→提取→检索→生成→(审查?)→摘要→入库
    # - 压缩节点（compacting）：可选，仅当原文区 token 超上限时触发
    # - 审查节点（reviewing）：可选，根据 reviewEnabled 配置动态显示/隐藏
    # desc 文案与 intermediate.chat 中的实际阶段提示文案保持一致，
    # 并在生成节点补充"正文流式显示"信息（实际 GeneratePanel 会显示 streamingGenerated）
