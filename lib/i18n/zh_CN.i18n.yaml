  # 宏摘要机制页内容（2026-07-26 新增：第四部分 4.4）
  # 设计原则：示意图优先，少量短句补充，拒绝大段文字
  macroWiki:
    title: 宏摘要机制
    intro: >-
      故事模式会维护两种不同的长程摘要：累积压缩摘要替代早期对话原文，保证当前上下文连续；分段宏摘要概括本次新进入压缩区的连续事件，作为长期记忆参与检索。
    # 示意图标题
    overviewTitle: 微摘要与宏摘要的关系
    overviewSubtitle: 若干微摘要聚合成一条宏摘要
    # 示意图标注
    diagramMicroLabel: 微摘要
    diagramMicroDesc: 每轮 1 条
    diagramMacroLabel: 宏摘要
    diagramMacroDesc: 聚合多轮
    diagramAggregateLabel: 聚合
    # 双触发
    triggersTitle: 压缩触发与双产物
    triggersSubtitle: 达到上下文阈值时同步维护
    trigger1Title: 累积压缩摘要
    trigger1Body: >-
      当请求上下文达到配置的压缩触发线时，把旧压缩摘要与本次被压缩的消息合并成新的累积摘要，后续请求用它替代早期原文。
    trigger2Title: 分段宏摘要
    trigger2Body: >-
      后续压缩会并行概括「本次新增压缩区间」，写成独立 macro 记忆参与检索；首次压缩可直接复用压缩摘要建立 macro 记录。
    # 边界与失败
    skipTitle: 两类摘要不要混用
    skipBody: >-
      累积摘要回答「到目前为止发生了什么」，分段宏摘要回答「这一段发生了什么」。前者是当前上下文前缀，后者是可检索的长期记忆。
    fallbackTitle: 失败与重试
    fallbackBody: >-
      摘要生成属于 compacting 阶段。失败时按故事模式失败栏重试或取消，不能假设会静默回到 idle；已持久化数据不会被无提示覆盖。
    # UI 表现
    uiTitle: UI 表现
    uiBody: >-
      触发压缩时显示 compacting/整理上下文反馈，不再存在独立「宏摘要阶段」小窗。macro 记录可在记忆库中查看，也会在后续检索命中时注入。

