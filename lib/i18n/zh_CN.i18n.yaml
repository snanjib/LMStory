    # 入口
    entryTitle: 怎么进入
    entryBody: 帮助 → 附录 → 版本更新记录。

  # ── 导演模式章节（2026-08-19 新增，v0.3 实验性）──
  # 读者是非技术用户：全部用剧场/编辑部比喻，不出现内部代号
  directorModeWiki:
    title: 导演模式是什么
  directorMode:
    intro: 导演模式是第三种玩法：你写「项目规则」，AI 总编辑在幕后自主检索记忆、维护设定、执笔正文——你看到的成品只有小说正文，所有准备工作都收在幕后。
    # 主视觉：一轮循环
    diagramTitle: 一轮导演工作的循环
    diagramSubtitle: 你推进 → 幕后工作 → 正文 → 世界沉淀
    loopYouLabel: 你推进
    loopYouDesc: 发出指令或开场句
    loopBackstageLabel: 总编辑幕后工作
    loopBackstageDesc: 翻阅前情、查证设定、记场记…
    loopOutputLabel: 正文成果
    loopOutputDesc: 唯一的台前内容
    loopWorldLabel: 世界沉淀
    loopWorldDesc: 事实与经历记入记忆库
    # 与另两种模式对比
    vsTitle: 和另外两种模式怎么选
    vsChatTitle: 对话模式 = 你和 AI 聊
    vsChatBody: 一问一答，适合任务与日常对话；不沉淀世界记忆。
    vsStoryTitle: 故事模式 = 你和 AI 演对手戏
    vsStoryBody: 你写一句、AI 接一段，记忆自动沉淀；剧情由你亲自推进。
    vsDirectorTitle: 导演模式 = AI 执笔，你当导演
    vsDirectorBody: 规则你定、方向你纠、写入你把关；正文由 AI 总编辑完成。
    # 默认开启说明
    experimentTitle: 默认开启说明
    experimentBody: 导演模式默认开启。首页有「新导演」入口；到「设置 → 导演模式设置」可随时关闭开关，已有的导演会话不受影响。

  directorFirstWiki:
    title: 创建导演会话
  directorFirst:
    intro: 三步开工：确认导演模式开启（默认开启）→ 新建 → 写规则开工。
    # 主视觉
    flowTitle: 创建流程
    flow1Label: 确认导演模式开启
    flow1Desc: 默认开启；若已关闭，到 设置 → 导演模式设置 打开
    flow2Label: 新建导演会话
    flow2Desc: 首页点「新导演」卡片
    flow3Label: 写项目规则
    flow3Desc: 会话右上角设置 → 项目规则（可从模板直选）
    rulesTitle: 项目规则写什么
    rulesBody: 常驻背景规则：世界观、人设、文风与叙事守则。整场会话生效，AI 不会改写它。例如「低魔武侠世界，文风冷峻克制；主角是失业镖师；每幕结尾留一个未兑现的伏笔」。
    startTitle: 开场
    startBody: 发送第一句话即可，比如「镖局倒了，我在城门洞里数最后几枚铜钱」。导演会自行构思并交出正文；等待首字时会有「导演正在构思…」的心跳提示。

  directorWatchWiki:
    title: 监督模式：请示与审批
  directorWatch:
    intro: 监督模式让你逐项把关「剧情正史」的每一次写入：导演要改设定、记大事，先弹卡问你。
    # 主视觉
    diagramTitle: 一次写入的审批流程
    diagramRequestLabel: 导演要写入
    diagramRequestDesc: 如「修订设定集」「记入大事记」
    diagramCardLabel: 确认卡弹出
    diagramCardDesc: 显示要写入的内容，等你选
    diagramAllowLabel: 允许
    diagramAllowDesc: 写入生效，继续工作
    diagramDenyLabel: 拒绝
    diagramDenyDesc: 跳过这次写入，继续工作
    askTitle: 请示导演
    askBody: 遇到需要你拍板的岔路（比如「反派现在认输还是逃走？」），导演会主动弹「导演决策」卡：你可以输入回答，也可以「跳过」让它自行决定。卡片头部有倒计时（每分钟跳动）：超时未回应它将自行决定；在设置里把「请示等待超时」调到 0（一直等待），卡片会一直等你，不会自行裁决。审批卡同理显示倒计时，但超时按拒绝处理（安全默认，不可关闭）。
    toggleTitle: 开关与代价
    toggleBody: 监督模式在导演会话设置里切换。开着：每次写入暂停等你确认，把关最严，但生成会频繁停下；关着：写入自动执行，正文一气呵成。想逐项把关正史改动时再开。审批卡上的「本会话总是允许」会记住你对某个工具的放行，本次会话内同工具不再逐次弹卡；想收回去会话设置的「监督与工具」区点「清除本会话放行」（关会话也会自动失效）。

  directorProcessWiki:
    title: 看懂过程：台前与幕后
  directorProcess:
    intro: 正文是最终成果，准备工作收在幕后。当前活动标题带流光，减弱动态时显示静态标记；等待响应、思考、工具执行与保存收尾分别提示。思考生成中收起可看末三行，结束后收起完全隐藏；展开后在限高窗口阅读，上滚时暂停跟随。幕后输出有单独标识，与思考和正文区分。 中间发言从生成开始按顺序留在幕后，正式交稿才进入正文；纯文本收尾确认后再显示为正文。 每轮独立计时，重新生成时重新起算。 本轮成功完成后，警告和错误卡也随幕后整组折叠，展开可查看；运行中或中断轮的异常卡仍保留提示。
    # 主视觉
    diagramTitle: 台前与幕后
    stageLabel: 台前
    stageDesc: 正文 + 一行过程（「正在翻阅前情… · 第 3 步」）
    backstageLabel: 幕后
    backstageDesc: 点幕后汇总行（或右侧箭头）展开逐步骤的工作卡
    verbsTitle: 幕后工作卡上的「台词」
    verbsBody: 工作卡用舞台动词展示每一步在干什么：翻阅前情（找旧事）、搜索原文（用关键词找回历史原文）、回读原文（重看原文）、查证设定（核对事实）、重读主线（回顾摘要）、修订设定集（改设定）、归并设定（合并重复条目）、记入大事记（记事件）、记场记（记当前位置）、翻阅手记（查写作方法）、派出子代理（分派小任务）、请示导演（找你拍板）、落幕（交稿）。
    costTitle: 成本提示
    costBody: 输入框旁的小圆环显示当前上下文离自动压缩还有多远，点开可看窗口用量、缓存命中率和最近一轮请求消耗，还能手动立即压缩——前缀稳定时输入费用约打一折。
  directorLogWiki:
    title: 事件日志与恢复
  directorLog:
    intro: 导演的每一步都会记进「事件日志」——即使应用闪退或断电，重开后也能接着写，进度不丢。
    # 主视觉
    diagramTitle: 恢复是怎么发生的
    diagramWorkLabel: 执行中
    diagramWorkDesc: 每一步实时记入日志
    diagramCrashLabel: 意外退出
    diagramCrashDesc: 崩溃、断电或被系统杀掉
    diagramRecoverLabel: 重开后恢复
    diagramRecoverDesc: 按日志还原进度，接着写
    recapTitle: 幕间回顾卡
    # 已给最新幕回顾卡加编辑入口，删「无需编辑」劝退表述
    recapBody: 每隔一段剧情会出现一行「书脊」样式的回顾卡：第几幕、当前弧线、待兑现与已兑现的伏笔。它是剧情的里程碑，用来快速回望故事走到哪了；最新一幕的回顾卡展开后有「编辑」入口（弧线/叙事时间/伏笔全量清单），与 AI 记场记同一数据源，历史幕只读。另外每隔几轮（默认 8 轮，导演设置可调）会有一次「伏笔清点」：轮尾提醒未兑现清单，清点轮提交时终审提醒把一次关——划去已兑现或确认后才放行。

  directorFailureWiki:
    title: 失败与重试
  directorFailure:
    intro: 导演一轮要走很多步，任何一步都可能失败。失败不会破坏数据——记忆落库是整轮成功的奖励，中途失败什么都不会写坏。
    # 主视觉
    diagramTitle: 失败时的样子
    diagramFailLabel: 失败步骤卡
    # f8c9d7c9 后失败卡分红/黄两态
    diagramFailDesc: 红/黄两态——中断本轮的失败为红色，已被自动重试救回的失败为黄色；可一键复制信息用于反馈
    diagramRetryLabel: 失败栏重试
    diagramRetryDesc: 从失败处重跑这一轮
    retryTitle: 重试会发生什么
    retryBody: 小故障会自动重试几次；仍失败则停下等你处理。「整轮重试」从头重跑导演工作；「从中断处继续」复用本轮已产出（已写出的正文、已完成的工具步骤直接接着用，不重复消耗），只在无法接续时才回退整轮重跑。已完成的轮次与记忆不受影响。常见失败原因是网络超时、模型额度或配置问题——先用会话设置检查模型配置，再看诊断页的失败历史。 导演首响应和非流式完成默认各等待 10 分钟，可在通用设置调整；这两类超时不会自动重试。非流式只能等待完整结果，停止会结束本地等待，但供应商可能仍继续推理。
  directorSettingsWiki:
    title: 导演会话设置
  directorSettings:
    # 补快照语义半句
    # 分区数与顺序对齐 704f0ba3 调序后的实际（8 区）
    intro: 导演模式的设置分两层——全局「导演模式设置」单页（设置 → 导演模式设置，含模式开关）与会话面板（会话页右上角，8 个折叠区段：记忆管理/项目规则/模型与生成/剧情节奏/监督与工具/预算/上下文与压缩/角色卡/世界书；项目规则提至第 2 位、角色卡/世界书居末）。会话内未调整的项使用全局值；调整后点重置则把该字段写为此刻全局值的快照（此后互不影响）。
    settingsTitle: 关键设置
    modelTitle: 主模型
    modelBody: 导演自主执行用的模型；未单独配置时使用全局「生成」模型。想让导演用更强的模型、日常对话用便宜的模型时，在这里单独指定。向量化模型单独配置（检索与记忆区段）。
    rulesTitle: 项目规则
    rulesBody: 常驻背景规则，整场会话生效；支持从模板库直选一条快速开始。
    pacingTitle: 剧情节奏
    pacingBody: 三档（保守/平衡/激进）控制叙事的景别——保守偏细描慢推、激进偏快进大步推进。全局设默认档，会话内可临时换档；仅激进档要求正文写满写足，保守/平衡篇幅随叙事节奏自定（2026-09-08 调整）。
    budgetTitle: 预算（步数与时间）
    budgetBody: 每轮允许导演自主执行的最大步数与时间。任一预算到顶（步数/时间/累计消耗/上下文余量）都不会硬停——会先注入收尾指令，让导演用现有素材落幕后才停；步数也可选「无上限」（其余保护照常）。其中「累计消耗」与「上下文余量」是引擎内置保护（默认窗口 60% 成本线与轮内 85% 保命线），不占设置面。
    watchTitle: 监督与工具权限
    watchBody: 监督模式开启后每次写入都弹确认卡；每个工具可独立设「允许/询问/禁用」三态（禁用的工具对导演不可见）。详见「监督模式：请示与审批」。
    contextTitle: 上下文与压缩
    # 上下文配置收敛：单一「上下文压缩阈值」旋钮 + 三线关系披露
    contextBody: 输入区的小圆环显示上下文用量（满刻度=上下文压缩阈值），点开详情面板可看窗口用量/缓存命中率/最近一轮明细，对话足够长时可「立即压缩」；压缩摘要卡展开后可「撤销压缩」恢复归档对话。上下文只有一个旋钮「上下文压缩阈值」：历史占用到达生效窗口（模型窗口与窗口上限取小）的这一比例时，下一轮开始前自动压缩；百分比旁显生效 token 值，也可直接输 token 反推百分比。另有两道引擎内置保护不在设置面：轮内上下文到 85% 保命线强制收尾、单轮累计消耗按成本口径软着陆（与装了多少是两套账）。窗口上限在「高级：窗口上限」折叠里——0=自动用模型窗口，模型登记不准或要防 TPM 限流时才需要手动声明。
    suggestReplyTitle: 推荐回复
    suggestReplyBody: 输入框「推荐」按钮用的模型与参数都在「模型与生成」区段的推荐回复组：推荐模型（留空用导演主模型）、提示词、温度、生成上限、候选数量（一次生成几条）与单条最大字数（提示词层面控制单条长度）。
    memoryTitle: 记忆库入口
    memoryBody: 设置里也有「记忆库」区段，可浏览、搜索、手动增删改本会话的记忆——与故事模式共用同一记忆库。会话面板「记忆管理」区还有「检索松紧度」三档（保守/平衡/宽松），控制导演翻旧账时捞多少、挑多严；选中即把该档的具体数值写进本会话，之后互不影响。

  # ── 资源库条目（2026-08-19 新增，v0.3）──
  resourceLibraryWiki:
    title: 角色卡与世界书（资源库）
  resourceLibrary:
    intro: 角色卡和世界书是世界的「种子」：把你在别处收藏的设定导入 LMStory，应用到会话即可参与世界运转——但它们不是开始体验的门票，你也可以什么都不带，从零开始。
    # 主视觉
    diagramTitle: 从导入到生长
    seed1Label: 导入
    seed1Desc: 设置 → 角色卡/世界书
    seed2Label: 应用
    seed2Desc: 会话设置 → 角色卡/世界书区段（故事/导演同款）
    seed3Label: 只读种子生效
    seed3Desc: 设定作为基线参与世界运转
    seed4Label: 与新事实共同生长
    seed4Desc: 世界学到的新事实照常积累
    formatsTitle: 支持的格式
    # 补内嵌 character_book 形态（09-15 批六刚修过
    # 该形态的 AI 编辑清空 bug，说明真实在用户手中流转）
    formatsBody: 角色卡：SillyTavern（酒馆）兼容的 PNG 卡（V1/V2/V3）与纯 JSON 卡；世界书：顶层带条目（entries）的 JSON 文件（角色卡内嵌的 character_book 同样支持）。手机上还可以用系统「打开方式/分享」直接导入。
    readonlyTitle: 只读是什么意思
    readonlyBody: 应用后的设定作为只读基线：不可改写、不可删除；AI 在剧情中的变化会以独立「演变」条目并存，你可以在记忆库里区分基线与演变。可随时取消应用整体移除。
    dupTitle: 同名提示
    dupBody: 会话里已有同名角色时，应用会被拒绝并提示——避免重复或覆盖；换个名字或先整理现有内容即可。世界书词条同名时会被静默跳过（应用计数不含被跳过的词条），如需覆盖请先整理同名词条。
    # 2026-09-16：AI 建卡此前仅功能索引提及，资源库 Wiki 页缺收
    aiTitle: AI 建卡
    aiBody: 手里没有现成的卡或书也能开始：在资源库页（设置 → 角色卡/世界书）进入 AI 建卡，用对话描述想要的角色或世界，AI 起草并按你的反馈修改；也可以对既有资源发起 AI 编辑。草稿在预览面板确认后保存落库（另存为新资源或覆盖原资源，覆盖前有确认护栏）。应用到会话的是应用当时的快照，资源库后续修改不影响已应用的会话。草稿未保存就退出会被拦截确认，防止误触丢失。

