    opDrag: 拖拽排序
    opDelete: 删除
    # 6 步操作
    operationsTitle: 日常使用流程
    operationsSubtitle: 从创建到管理的完整用法
    step1Title: 新建会话
    step1Body: 点击侧边栏底部的「新建对话」按钮，或主页的「新建对话」卡片，即可进入新的对话。新会话默认复制全局当前配置（模型与提示词的快照）。
    step2Title: 切换会话
    step2Body: 在侧边栏点击任意会话即可切换到该会话。每个会话独立保留滚动位置和未发送的草稿，切换不会丢失上下文。
    step3Title: 重命名会话
    step3Body: 点击会话项右侧的三点菜单，选择「重命名」修改会话标题。会话标题也会在发送首条消息后由 AI 自动生成。
    step4Title: 收藏常用会话
    step4Body: 三点菜单中选择「收藏」，收藏的会话会自动置顶到列表最前面，方便快速访问。再次点击可取消收藏。
    step5Title: 拖拽自定义排序
    step5Body: 长按会话项右侧的拖拽把手（··· 图标），上下拖动即可自定义会话顺序。松手后顺序自动保存。
    step6Title: 复制与删除
    step6Body: 三点菜单提供「复制」和「删除」操作。复制会创建一个包含全部消息的新会话；删除需要二次确认，防止误操作。
    # 全局搜索
    searchTitle: 全局搜索消息
    searchBody: 点击侧边栏顶部的放大镜图标（或按 Ctrl+K），打开全局搜索。输入关键词即可搜索所有会话中的消息内容，搜索结果直接显示来源消息，点击（或用方向键选择后回车）可跳转并定位到对应消息。
    # 平台差异
    platformTitle: 移动端与桌面端的差异
    platformBody: 桌面端侧边栏固定显示在左侧，可通过顶部按钮折叠；移动端侧边栏隐藏为抽屉，点击左上角汉堡菜单打开。

  # ── 第二部分 2.2：发送消息与查看回复（2026-07-27 新增）──
  messageFlowWiki:
    title: 发送消息与查看回复
  messageFlow:
    intro: 在输入框写好内容后点发送，AI 会一边思考一边逐字输出回复。你可以随时中断、引用之前的消息、或添加图片附件。
    # 主视觉
    layoutTitle: 发送与回复的完整流程
    layoutSubtitle: 输入消息 → AI 流式回复 → 查看结果
    diagramInputLabel: 发送消息的 4 个动作
    blockQuoteLabel: 引用预览
    blockQuoteDesc: 引用消息时显示
    blockAttachLabel: 附件预览
    blockAttachDesc: 图片/文件缩略图
    blockInputFieldLabel: 输入消息
    blockInputFieldDesc: 多行可达 200 高度
    blockToolbarLabel: 工具栏
    blockToolbarDesc: 附件 + 上下文 + 设置 + 模型
    diagramStreamLabel: AI 回复的 3 个阶段
    stream1Label: 点发送
    stream1Desc: 触发请求
    stream2Label: 思考中
    stream2Desc: 显示占位气泡
    stream3Label: 逐字输出
    stream3Desc: 实时显示回复
    # 输入框要点
    inputTipsTitle: 发送消息的几种方式
    tip1Title: 键盘快捷键
    tip1Body: 默认 Enter 键发送消息，Shift+Enter 换行。也可以在设置中改为 Ctrl+Enter 发送，避免误触。
    tip2Title: 生成中仍可编辑
    tip2Body: AI 回复期间输入框仍然可用，可以提前编辑下一条消息。只有发送按钮会暂时禁用，避免重复发送。
    tip3Title: 引用回复
    tip3Body: 点击任意消息的「引用」按钮，消息内容会作为引用预览显示在输入框上方。发送时引用会自动附在你的消息前面，让 AI 知道你在回复哪条消息。
    # 流式输出体验
    streamTitle: AI 回复的流式体验
    streamBody: 发送消息后，AI 的回复会逐字显示在气泡里，就像真人在打字。回复期间会显示停止按钮，点击可随时中断。如果中断后又想继续，点击用户消息上的「继续生成」按钮即可让 AI 接着写完。如果出错，错误信息会保留在助手消息卡片中，不会丢失。

  # ── 第二部分 2.3：消息操作（2026-07-27 新增）──
  messageActionsWiki:
    title: 消息操作
  messageActions:
    intro: 点击任意消息气泡会显示操作按钮，再次点击或等待 3 秒后自动隐藏。最后一条 AI 回复的操作按钮始终显示，方便快速操作。
    # 主视觉
    bubbleTitle: 消息气泡与操作按钮
    bubbleSubtitle: 6 种操作 + 显示策略
    diagramBubbleTitle: 消息气泡结构
    userBubbleLabel: 用户消息气泡
    assistantBubbleLabel: 助手消息气泡（含操作按钮行）
    opCopy: 复制
    opEdit: 编辑
    opRegenerate: 重新生成
    opContinue: 继续生成
    opQuote: 引用
    opDelete: 删除
    diagramStrategyTitle: 按钮显示策略
    diagramStrategyDesc: 点击消息切换显示/隐藏，3 秒后自动隐藏（最后一条 AI 回复按钮始终显示）。
    # 6 种操作
    opsTitle: 6 种操作说明
    op1Title: 复制
    op1Body: 复制消息原文到剪贴板，可直接粘贴到其他应用。
    op2Title: 编辑（仅用户消息）
    op2Body: 修改你之前发过的消息。编辑后会基于新内容重新生成回复，原回复会作为分支保留，可通过左右箭头切换查看。
    op3Title: 重新生成（仅助手消息）
    op3Body: 让 AI 重新写一条回复。原回复会作为分支保留，可通过左右箭头切换查看不同版本。
    op4Title: 继续生成（仅用户消息）
    op4Body: 如果 AI 之前的回复被中断或没写完，点击此按钮让 AI 从中断处继续写完。
    op5Title: 引用
    op5Body: 将消息作为引用附在下一条消息前，让 AI 知道你在回复哪条消息。引用预览显示在输入框上方，可随时关闭。
    op6Title: 删除
    op6Body: 删除该消息及其后续分支。删除需二次确认，防止误操作。
    # 分支说明
    forkTitle: 分支机制
    forkBody: 编辑用户消息或重新生成都会创建分支。分支指示器显示「2/3」等当前位置，点击左右箭头可在不同版本之间切换查看，原版本不会丢失。

  # ── 第二部分 2.4：消息导航（2026-07-27 新增）──
  messageNavWiki:
    title: 消息导航
  messageNav:
    intro: 长对话中滚动不方便，4 个浮动按钮帮助你快速跳到对话开头、结尾或下一条用户消息。按钮在滚动停止 2 秒后自动隐藏，不遮挡内容。
    # 主视觉
    buttonsTitle: 4 个浮动按钮 + 自动隐藏
    buttonsSubtitle: 双箭头跳端点 / 单箭头翻消息
    diagramButtonsTitle: 4 个浮动按钮（从上到下）
    btnJumpTop: 跳到顶部
    btnJumpTopDesc: 双箭头向上 · 跳到最早消息
    btnPrevUser: 上一条用户消息
    btnPrevUserDesc: 单箭头向上 · 翻到前一条用户消息
    btnNextUser: 下一条用户消息
    btnNextUserDesc: 单箭头向下 · 翻到下一条用户消息
    btnJumpBottom: 跳到底部
    btnJumpBottomDesc: 双箭头向下 · 跳到最新消息
    diagramHideTitle: 自动隐藏时序
    timeline1: 滚动中
    timeline2: 停止滚动
    timeline3: 2 秒后自动隐藏
    # 4 个按钮说明
    opsTitle: 4 个按钮的图标含义
    btn1Title: 跳到顶部（双箭头向上）
    btn1Body: 快速回到对话最早的消息。适合查看对话开头的内容。
    btn2Title: 上一条用户消息（单箭头向上）
    btn2Body: 跳到前一条你发的消息。便于回溯自己之前的提问，比手动滚动快很多。
    btn3Title: 下一条用户消息（单箭头向下）
    btn3Body: 跳到下一条你发的消息。便于快速浏览问答节奏，跳过 AI 长回复。
    btn4Title: 跳到底部（双箭头向下）
    btn4Body: 快速回到最新消息。AI 流式输出期间也可用，方便跳回查看实时生成的内容。
    # 自动隐藏
    hideTitle: 自动隐藏机制
    hideBody: 浮动按钮在滚动停止 2 秒后会自动隐藏，避免遮挡消息内容。滚动时按钮会立即重新出现。按钮采用半透明设计，减少视觉干扰。
    # 批 K：会话内搜索（手册面补账）
    searchTitle: 会话内搜索
    searchBody: 除了浮动按钮，还能按内容找消息：从右上角菜单或 Ctrl+F（macOS 为 Cmd+F）唤起「会话内搜索」，按 Esc 收起。输入即显示命中数，Enter / Shift+Enter 在上一处、下一处之间跳转，定位到的消息会短暂高亮提示。搜索只匹配当前分支可见的消息，切换分支后命中会同步过滤。

  # ── 第二部分 2.5：会话设置（2026-07-27 新增）──
  sessionSettingsWiki:
    title: 会话设置
  sessionSettings:
    intro: 每个会话都可以单独配置模型、提示词、温度等参数。尚未单独修改过的字段按打开会话那一刻的全局值快照（此后改全局不影响该会话），修改后以会话值为准。
    # 主视觉
    priorityTitle: 配置优先级
    prioritySubtitle: 会话级配置 > 全局默认
    diagramPriorityTitle: 配置优先级
    level1Label: 会话级
    level1Desc: 单独配置优先
    level2Label: 全局默认
    level2Desc: 设置页统一配置
    level3Label: 内置默认
    level3Desc: 出厂值
    diagramSectionsTitle: 会话设置包含 4 个区段
    sectionModel: 模型与供应商
    sectionModelDesc: 选择 API 供应商和模型
    sectionPrompt: 提示词
    sectionPromptDesc: 系统提示词 + 模板
    sectionGen: 生成参数
    sectionGenDesc: 温度 + Top P + 惩罚
    sectionContext: 上下文窗口
    sectionContextDesc: 最大上下文消息数
    # 三级优先级说明
    levelsTitle: 配置优先级说明
    level1Title: 会话级（最高优先级）
    level1Body: 在会话设置中单独配置的值会覆盖全局默认。适合某个会话需要用不同模型或不同温度的场景。
    level2Title: 全局默认
    level2Body: 在「设置」→「对话模式设置」→「默认配置」按钮中统一配置，所有新会话都会使用这些值。修改全局默认不会影响已打开过或单独配置过的会话（它们的值是打开时写入的快照）。
    level3Title: 内置默认值
    level3Body: 如果你从未配置过任何设置，应用会使用内置的合理默认值，比如对话温度 0.7、Top P 1.0。
    # 重置为全局
    resetTitle: 重置为全局当前值
    # 批 L 快照铁律落地后的残留继承语义——重置=
    # 写入此刻全局值的快照（此后互不影响），非「恢复使用全局配置」
    resetBody: 每个会话级设置项旁都有重置按钮，点击后把该字段写为当前全局值（快照，此后互不影响）。如果你想统一管理所有会话的设置，建议在全局默认中配置，会话级只在必要时覆盖。

  # ── 第二部分 2.6：上下文管理与压缩（2026-07-27 新增）──
  compactionFlowWiki:
    title: 上下文管理与压缩
  compactionFlow:
    intro: 对话太长会超出 AI 的记忆范围。LMStory 会在合适时机自动压缩早期对话——生成一段摘要替换旧消息，让 AI 记住关键信息又不会超载。对话模式使用 CompactionPoint 压缩策略，基于 token 阈值自动触发（本页介绍）；故事模式使用三段式预算（摘要前缀 + 原文区 + 检索区），由压缩触发线动态控制原文区上限，详见「故事模式原理 → 上下文预算」。
    # 主视觉
    flowTitle: 压缩如何发生
    flowSubtitle: 自动触发 + 流式生成摘要
    diagramTriggerTitle: 什么时候会压缩
    diagramThresholdFormula: 当对话长度接近模型上限时自动触发（不同模型上限不同）
    diagramFlowTitle: 压缩的 4 个步骤
    flow1Label: 发送消息
    flow1Desc: 系统检查对话长度
    flow2Label: 接近上限
    flow2Desc: 自动触发压缩
    flow3Label: 生成摘要
    flow3Desc: AI 总结早期对话
    flow4Label: 替换上下文
    flow4Desc: 摘要替换旧消息
    # 触发条件
    triggerTitle: 什么时候会触发压缩
    # 交付后对话模式也有圆环+手动压缩+撤销——
    # 删除「你不需要手动操作」（与入口卡 subtitle「自动压缩、手动压缩」矛盾）
    triggerBody: 当对话累计长度接近当前模型的上限时，下一次发送消息会自动触发压缩。不同模型的上限不同，从 8K 到 1M 以上不等。输入区左侧的小圆环就是用量指示：满刻度即压缩触发线，点开详情可看窗口用量、缓存命中率与最近一轮 token 明细；不想等自动触发时，可从会话菜单「手动压缩」或详情面板「立即压缩」提前压，压缩后摘要卡还提供「撤销压缩」恢复原文。
    # 流程说明
    stepsTitle: 压缩后你看到什么
    step1Title: 出现摘要消息
    step1Body: 压缩完成后，对话中会出现一条特殊样式的「摘要」消息，内容是 AI 对早期对话的总结，包含讨论了什么、关键决策、当前在做什么等。
    step2Title: 摘要可展开编辑
    step2Body: 摘要消息默认折叠显示标题，点击可展开查看完整内容。如果对摘要不满意，可以编辑修改，或删除后重新生成。
    step3Title: 后续对话不受影响
    step3Body: 压缩后你可以继续正常对话。AI 会基于摘要 + 最新消息继续回复，不会感觉到上下文断裂。
    # 失败处理
    failedTitle: 压缩失败怎么办
    failedBody: 压缩可能因为网络问题或模型超载失败。失败时会显示一张「压缩失败」卡片，点击「重试」可重新触发压缩。失败不影响现有对话，你可以继续发送新消息，系统会在下次发送时再次尝试压缩。

  # 记忆机制子页内容
  memory:
    intro: >-
      故事模式的核心能力是「记忆」——它真的能记住之前发生过什么。但故事模式不是把整轮对话存下来当记忆，而是把每轮对话提炼成结构化数据再存。记忆分两类，按「内容性质」分类，不按时间维度分层。
    twoTypesTitle: 两种记忆：日记本 vs 人物卡
    twoTypesBody: >-
      经历类记忆像日记本——「那天傍晚勇者去了古碑前」——这件事发生过就发生过，永远记着，不会再变。每轮固定生成 1 条。事实类记忆像人物卡——「勇者的等级是 5」——这件事是可以变的，下一轮升级成 6 了，就要把 5 改成 6，旧值进审计日志。
    experientialTitle: 经历类记忆：剧情日记
    experientialBody: >-
      存在 experiential_memories 表，以追加为主。每轮事件微摘要包含 5W1E、叙事时间、重要性、标签和检索数据。对话达到上下文压缩阈值时，系统同时维护两种不同产物：累积压缩摘要用于替代早期原文并延续当前上下文；分段宏摘要概括本次新压缩的连续事件，并作为 macro 记忆参与长期检索。首次压缩可直接以压缩摘要建立 macro 记录。
    factualTitle: 事实类记忆：人物卡
    factualBody: >-
      存在实体表 + 属性表 + 审计历史三张表，使用改写（upsert）+ 审计日志。当前实体类型是角色、地点、物品、世界设定、组织、其他；宠物和 NPC 归入角色，世界规则归入世界设定。每个实体一条主记录，每项属性按 entityId 隔离，旧值进入审计历史。这能减少多实例串台、设定漂移和改名失效。
    retrievalTitle: 哪些内容会被向量化检索？
    retrievalBody: >-
      写入时：AI 提炼出的「5W1E 6 字段摘要」会被向量化，不是关键词，也不是整轮对话正文。拼接格式是「时间：xxx 地点：xxx 人物：xxx 事件：xxx 意义：xxx 补充：xxx」，空字段省略。然后这段文本会被送到 embedding API 转成向量。为什么不直接向量化整轮对话正文？因为正文太长，包含很多无关信息（寒暄、动作描写、心理活动），会稀释语义焦点。AI 提炼后的摘要已经抓住了「这一轮到底发生了什么」，向量化的质量更高。例外：宏摘要（macro_summary）继续用单字段 summary 向量化，不用 5W1E 格式。
    retrievalQueryTitle: 检索时用什么作为查询源？
    retrievalQueryBody: >-
      用第 2 步提取的关键词，不是你的原始消息，也不是整轮对话正文。检索分 5 路并行：角色/物品/地点 3 类关键词走全文精确匹配（各自一路）；动作/情节 2 类关键词走向量语义匹配（拼接后送 embedding API，再找向量距离最近的历史记忆；某类为空时该路自动跳过）。为什么用关键词而不是你的原始消息？因为你的原始消息可能很长（「我走到古碑前，仔细端详上面的纹路，突然碑文显现了，我吓了一跳」），里面有大量无关动作。提取关键词后聚焦在「古碑、后山、碑文」这种核心元素上，检索精度更高。
    factualGuardTitle: 事实层的三重防护
    factualGuardBody: >-
      防止 AI 乱改事实，写入时有三重防护。第 1 层：提示词约束「尽量追加，有冲突时才修改」——防 AI 把「追加新技能」误标成「修改技能列表」。第 2 层：代码检测——key 已存在且值真的不同才允许修改——防 AI 把「追加」误标成「修改」。第 3 层：关键属性（重要性 ≥4）需 confidence ≥4 才能修改——防止低置信度的修改覆盖重要设定。
    factualHealthTitle: 5 层健康度防护
    factualHealthBody: >-
      防止属性膨胀，5 层防护。第 1 层：属性 schema 白名单——防止 AI 给角色瞎加属性（比如给狗加「学历」）。第 2 层：提示词约束「临时状态≠事实」——防止把「旺财今天有点累」也存成事实。第 3 层：系统级去重（编辑距离/包含关系）——防止同一属性被反复添加。第 4 层：同实体最近 3 轮最多 4 次更新——防止 AI 反复改同一属性。第 5 层：单值最长 500 字——防止属性值无限膨胀。
    factualChangePanelTitle: 本轮事实变更
    factualChangePanelBody: >-
      每轮对话生成后，摘要小窗之后会展示「事实层变更小窗」，列出本轮对事实层做了什么：新增了哪些实体、更新了哪些属性（含变更前与变更后）、追加了什么、归档了谁。点击单条可查看完整详情。如果本轮确实没有任何事实变更，也会显示「本轮无事实变更」占位，让你清楚知道这一轮记忆库没有变化。
    vectorizationThresholdTitle: 记忆检索门槛
    vectorizationThresholdBody: >-
      并非所有记忆都会被检索。系统按重要性（1-5 分）分级：低于「存储索引门槛」（默认 3 分）的记忆不建索引（无法被检索）；达到「向量化门槛」（默认 4 分）的记忆才会生成语义向量，支持按意思模糊查找；介于两者之间的记忆仅支持关键词精确匹配。如果你觉得某些 2 分的记忆也很有价值、应该能被检索到，可以在「设置 → 故事模式设置 → 工具与记忆」里同时把两个门槛调到 2（该页在「配置显示模式=进阶」下可见；配置显示模式开关位于设置 → 通用页底，默认简单）。

  # 失败处理子页内容
  # v0.2.2：与 FailureBar 实际 UI 对齐
  # - 默认 3 次 AI 请求（开启审查阶段后 4 次），不再写死 4 次
  # - 按钮名称对齐：整轮重试 / 从中断处继续 / 临时降级为关键词检索 / 清空本轮
  # - 输入框行为：失败时输入框仍可输入，仅发送按钮禁用（非整框禁用）
  # - 补充「从中断处继续」按钮说明：保留已完成阶段产出从失败阶段继续
  # - 补充「清空本轮」按钮说明：回填用户消息到输入框
  failure:
    intro: >-
      故事模式每轮对话默认发起 3 次 AI 请求 + 1 次本地检索 + 1 次向量化（开启审查阶段后为 4 次 AI 请求）。调用次数多了，失败的概率也会高。但故事模式的失败处理有一个核心原则：要么全部成功，要么全部失败。常见错误码速查与场景排查，参见：附录 → 故障排除 FAQ。
    atomicityTitle: 核心原则：原子事务
    atomicityBody: >-
      每一轮对话是一个原子事务——提取→检索→生成→审查→摘要→入库，要么全成功要么全失败。关键区分：数据回滚 ≠ UI 清空。失败时数据库绝不写入（事务回滚）。但 UI 保留已显示的中间产物（生成内容、检索结果、半截回复），让你能看到失败发生在哪一步。不降级质量：不会拿生成内容充当最终回复，不会静默跳过检索。
    retryTableTitle: 各阶段失败的处理
    retryTableBody: >-
      生成失败：重试 2 次，仍失败则整轮失败让你重试。提取关键词失败：重试 2 次，仍失败则整轮失败让你重试。检索两路都失败：重试 1 次，仍失败则整轮失败让你重试。检索单路失败：不重试，用另一路结果继续。审查失败：重试 2 次，仍失败则整轮失败让你重试。摘要失败：重试 2 次，仍失败则整轮失败让你重试。向量化失败：自动重试 1 次，仍失败则让你选——整轮重试/临时降级为关键词检索/清空本轮（外加从中断处继续）。持久化失败：不重试，事务回滚，整轮失败。
    uiRetentionTitle: 失败时的 UI 保留
    uiRetentionBody: >-
      你能看到哪一步失败：生成失败 → 生成面板（已显示的半截生成内容）。提取失败 → 生成面板 + 提取小窗。检索失败 → 生成/提取小窗 + 检索小窗。审查失败 → 半截回复 + 已完成的生成/提取/检索小窗。摘要失败 → 完整回复 + 生成/提取/检索小窗 + 摘要小窗。持久化失败 → 完整回复 + 所有中间产物小窗。所有失败情况统一显示：失败提示 + 失败栏（按失败类型提供操作按钮）。失败时输入框仍可输入，仅发送按钮禁用——你需要先点「整轮重试」或「清空本轮」恢复到 idle 才能发送新消息。
    manualRetryTitle: 失败栏的按钮分别做什么
    manualRetryBody: >-
      失败栏会根据失败类型显示操作按钮：「整轮重试」——清掉所有已显示的中间产物，保留你的消息，从头开始整轮六步生成（不从失败步骤继续，因为中间产物可能已部分生成，继续会导致状态不一致）；「从中断处继续」——保留已完成阶段产出（如生成内容、检索结果），从失败阶段继续重试，适合失败发生在靠后阶段时省前面的 AI 调用；「续写」——生成失败且已有半截正文时出现，带着半截正文继续生成，不重复已有内容；「以此收稿」——生成/审查失败且半截正文可用时出现，把半截正文直接作为本轮定稿，照常走完摘要与入库；「临时降级为关键词检索」——仅 E104 嵌入模型调用失败时显示，跳过向量检索继续本轮（仍走 FTS5 关键词检索）；「清空本轮」——清掉所有中间产物，把你的消息回填到输入框，方便你修改后重新发送。
    factualFallbackTitle: 事实层的特殊失败降级
    factualFallbackBody: >-
      事实层的失败处理和经历层不一样。检索阶段（绝不阻塞）：事实层检索的代码用 try-catch 全包，任何异常都返回空结果，不抛错。即使事实层检索挂了，经历层检索照常进行，审查阶段照常进行（只是少了「世界设定」区块）。写入阶段（单变更容错）：每个事实 delta 独立 try-catch，单个失败只记日志，不传播。即使事实层写入部分失败，经历记忆始终能写入。为什么这么设计？因为 AI 输出格式问题频发（字段缺失、entityId 不存在等），如果任一 delta 失败就整轮回滚，会导致「新对话记忆库一直为空」——这是最严重的可用性问题。所以牺牲少量原子性换取可用性。

  # ── 第三部分 3.1：故事模式与对话模式的区别（2026-07-27 新增）──
  storyVsChatWiki:
    title: 故事模式与对话模式的区别
  storyVsChat:
    intro: LMStory 有三种模式——对话像「工具」，故事像「沉浸式叙事」，导演像「把世界交给 AI 总编辑」。三种模式入口与界面独立，按需选择。
    # 主视觉
    compareTitle: 三种模式视觉对比
    compareSubtitle: 4 个维度看出明显差异
    # 示意图标注
    columnChat: 对话模式
    columnStory: 故事模式
    columnDirector: 导演模式
    directorEntry: 首页「新导演」卡片（默认开启）
    directorPalette: 跟随全局外观 + 警示色点缀
    directorFont: 衬线字体（正文唯一成果）
    directorInput: 输入框文案：给导演的指令
    chatEntry: 首页「新建对话」卡片入口
    chatPalette: 中性色 + 单一强调色
    chatFont: 无衬线字体（Inter）
    chatInput: 输入框文案：发送消息
    storyEntry: 首页「新建故事」卡片入口（默认隐藏，开启后显示）
    storyPalette: 跟随全局外观（衬线叙事正文）
    storyFont: 衬线字体（叙事正文）
    storyInput: 输入框文案：推动故事发展
    # 模式定位
    positioningTitle: 两种模式的定位
    chatModeTitle: 对话模式 = 工具
    chatModeBody: 像常见的 AI 对话工具，重点在「高效完成对话」。适合提问、写作、翻译、查资料等场景。界面克制安静，让工具消失于任务。
    storyModeTitle: 故事模式 = 沉浸
    storyModeBody: 为长线角色扮演和叙事设计，重点在「代入感」。会自动记忆剧情、检索过往事件、维护角色设定。叙事正文用衬线字体强化氛围，配色跟随全局外观设置。
    directorModeTitle: 导演模式 = 执笔
    directorModeBody: 你写「项目规则」，AI 总编辑在幕后自主检索记忆、维护设定、撰写正文——正文是唯一成果。适合想看 AI 如何理解你的世界、或想半托管推进剧情的时候。默认开启，可在设置中关闭。
    # 何时选哪个
    whenTitle: 什么时候选哪个
    whenBody: 想用 AI 完成一次性任务（写邮件、查资料、翻译）选对话模式；想亲自推进长线故事（角色扮演、互动小说、世界观探索）选故事模式；想写好规则后让 AI 全权执笔、自己只把关纠偏，选导演模式。三种模式互不干扰，可以同时拥有多个会话。
    # 模式切换
    switchTitle: 怎么切换模式
    switchBody: 没有独立的模式切换开关。在首页点击「新建对话」进入对话模式，点击「新导演」进入导演模式（默认开启，可在设置中关闭），点击「新建故事」进入故事模式——该入口默认隐藏，可在「设置 → 故事模式设置」开启，已有的故事会话不受影响。侧边栏中会话按模式图标区分（对话/故事/导演），点击即可切换到对应模式的会话。

  # ── 第三部分 3.2：创建第一个故事（2026-07-27 新增）──
  firstStoryWiki:
    title: 创建第一个故事
  firstStory:
    intro: 第一次用故事模式？先在「设置 → 故事模式设置」开启入口（默认隐藏），再从首页点「新建故事」，三步开启你的第一个故事。
    # 主视觉
    flowTitle: 创建故事的 3 步流程
    flowSubtitle: 从点击新建到首条消息
    # 示意图标注
    flow1Label: 点击新建故事
    flow1Desc: 首页「新建故事」入口卡片（需先开启入口）
    flow2Label: 配置模型与提示词
    flow2Desc: 至少配置一个可用阶段模型
    flow3Label: 发送首条消息
    flow3Desc: 启动六步生成
    # Banner 提示
    bannerTitle: 嵌入模型未配置
    bannerDesc: 仅用关键词检索，配置后可启用语义检索提升记忆召回精度
    bannerAction: 去配置
    # 3 步详解
    stepsTitle: 3 步详解
    step1Title: 点击新建故事
    step1Body: 先确认入口已开启（设置 → 故事模式设置），再在首页点击「新建故事」卡片，进入故事模式的新会话。第一次进入会显示空状态引导，提示你输入一句话开始故事。
    step2Title: 配置模型和提示词
    step2Body: 打开会话设置，在「分步骤模型配置」中至少配置 generating 或 extracting 的可用模型。每个阶段优先使用会话级配置，其次使用全局同阶段配置；未单独配置的其他阶段会复用当前有效的 extracting/generating 模型。两者都不可用时才会报配置错误 E010。
    step3Title: 发送首条消息
    step3Body: 在输入框写一句话推动故事发展，点发送即可。AI 会自动走完六步生成流程，输出最终回复。第一次回复可能稍慢，因为要建立初始记忆。
    # 系统提示词
    promptTitle: 系统提示词
    promptBody: 故事模式有内置的默认角色设定，留空时会自动使用。如果想自定义世界观、角色、风格，可以在会话设置的「提示词」区段填写。也可以从模板库选择预设模板。
    # 嵌入模型
    embeddingTitle: 嵌入模型
    embeddingBody: 嵌入模型用于把记忆文本转成向量，是语义检索的基础。未配置时故事模式仍可工作，但只能用关键词检索，记忆召回精度会降低。配置方法：打开「设置」→「故事模式设置」→「模型配置」→「嵌入模型」。
    # 首条消息
    firstMessageTitle: 首条消息怎么写
    firstMessageBody: 写一句话交代场景或动作即可，比如「我推开酒馆的门，闻到一股陈年酒香」。不需要写完整设定——AI 会自动提炼关键信息存入记忆，后续剧情会基于这些记忆继续发展。

  # ── 第三部分 3.4：故事模式消息操作（2026-07-27 新增）──
  storyMessageActionsWiki:
    title: 故事模式消息操作
  storyMessageActions:
    intro: 故事模式下点击任意消息会显示操作按钮。和对话模式相比，操作种类更少（无引用、无继续生成），但有 Fork 窗口限制——只能操作最近几轮的消息。
    # 主视觉
    diagramTitle: 4 种操作 + Fork 窗口
    diagramSubtitle: 操作按钮 + 窗口限制
    # 示意图标注
    diagramOpsTitle: 4 种操作
    opCopy: 复制
    opRegenerate: 重新生成
    opEditResend: 编辑重发
    opDeleteRound: 删除整轮
    diagramWindowTitle: Fork 窗口限制
    diagramWindowDesc: 只能操作最近 N 轮的消息，窗口外的消息按钮变灰
    # 4 种操作详解
    opsTitle: 4 种操作说明
    op1Title: 复制
    op1Body: 复制消息原文到剪贴板。复制始终可用，不受 Fork 窗口限制。
    op2Title: 重新生成（仅助手消息）
    op2Body: 让 AI 重新走一遍六步生成流程，写一条新的回复。旧版本不会丢：该轮的各版回复会存为稿件变体，用稿件卡上的变体切换器可回看与切换。
    op3Title: 编辑重发（仅用户消息）
    op3Body: 修改你之前发过的消息，修改后会基于新内容重新走六步生成。原回复同样保留为稿件变体，可用变体切换器回看与切换。
    op4Title: 删除整轮
    op4Body: 删除这一轮对话（你的消息 + AI 的回复 + 所有中间产物）。删除需二次确认，且只能删除 Fork 窗口内的轮次。
    # Fork 窗口限制
    windowTitle: Fork 窗口限制
    windowBody: 故事模式下，只有最近几轮的消息可以编辑或重新生成，更早的消息按钮会变灰。这是为了保护已固化的记忆——早期轮次的事件可能已被提炼成事实记忆，修改会导致记忆不一致。复制始终可用，不受窗口限制。
    # 与对话模式差异
    diffTitle: 与对话模式的差异
    diffBody: 故事模式没有「引用」按钮（沉浸式叙事不需要引用上下文）；「继续生成」不在消息上——完整的一轮六步生成不会「没写完」，若生成被中断，恢复入口在失败栏（「续写」「以此收稿」等）；增加了 Fork 窗口限制（保护记忆一致性）。其他操作（复制/编辑/重新生成/删除）的用法与对话模式一致。

  # ── 第三部分 3.6：故事会话设置（2026-07-27 新增）──
  storySessionSettingsWiki:
    title: 故事会话设置
  storySessionSettings:
    intro: 故事模式的会话设置比对话模式复杂——六步生成的每个步骤都可以独立配置模型，还有上下文预算、审查阶段、推荐回复等区段。
    # 主视觉
    diagramTitle: 4 步骤模型 + 10 个区段
    diagramSubtitle: 分步骤模型独立配置 + 完整设置区段
    # 示意图标注
    diagramPhasesTitle: 4 步骤模型独立配置
    phaseGenerating: 生成回复
    phaseExtracting: 关键词提取
    phaseReviewing: 审查
    phaseSummarizing: 事件摘要
    diagramPhasesDesc: 每个步骤可配不同模型，简单任务用小模型降本
    diagramSectionsTitle: 会话设置包含 10 个区段
    sectionPhaseModels: 分步骤模型配置
    sectionPhaseModelsDesc: 4 步骤独立配置
    sectionPrompt: 提示词
    sectionPromptDesc: 系统提示词 + 模板
    sectionGen: 生成参数
    sectionGenDesc: 温度 + Top P + 惩罚 + 思考预算
    sectionContext: 上下文窗口
    sectionContextDesc: 单次请求 Token 上限
    sectionContextBudget: 上下文预算
    sectionContextBudgetDesc: 原文区下限 + 检索区比例
    sectionToolCalling: 工具调用
    sectionToolCallingDesc: 控制结构化输出阶段的解析格式
    sectionReview: 审查阶段
    sectionReviewDesc: 开关审查阶段
    sectionSuggestReply: 推荐回复
    sectionSuggestReplyDesc: 模型 + 提示词覆盖
    sectionMemory: 记忆管理
    sectionMemoryDesc: 重建向量索引
    # 4 步骤模型
    phaseModelsTitle: 分步骤模型配置
    phaseModelsBody: 故事模式每轮默认有 3 次 AI 请求（提取/生成/摘要），开启审查后为 4 次。每个阶段优先使用会话级配置，再使用全局同阶段配置；未单独配置的阶段复用有效的 extracting/generating 模型。只有两者都不可用时才会报 E010。
    # 10 个区段说明（v0.3 新增角色卡/世界书区段）
    sectionsTitle: 10 个区段说明
    section1Title: 分步骤模型配置
    # JT-1：批七快照宪法后「恢复使用全局」继承语义不存在——重置=写当前快照
    section1Body: 为六步生成的各阶段选择模型，是故事模式独有的配置。每个步骤可单独覆盖全局配置，重置按钮把该步骤写为当前全局值的快照（此后改全局不影响该会话）。
    section2Title: 提示词
    section2Body: 系统提示词控制 AI 的角色设定和叙事风格。留空时使用内置默认角色设定。可从模板库选择预设模板，也可手动输入。
    section3Title: 生成参数
    section3Body: >-
      温度（控制随机性，0=确定 2=随机）、Top P（核采样）、最大 Token 数、存在惩罚（鼓励新话题）、频率惩罚（减少重复）、思考预算（控制模型推理深度）。这些参数仅作用于生成和审查阶段两个阶段；关键词提取、事件摘要等结构化任务阶段使用固定参数，不受此处配置影响，也不消耗思考预算。每个参数都可单独覆盖全局配置。
    section4Title: 上下文窗口
    section4Body: >-
      单次请求 Token 上限控制每次发送给 AI 的最大 token 数，避免触发供应商的 TPM（每分钟 token 数）限制。留空时使用模型窗口大小，实际生效值取配置值与模型窗口的较小者。故事模式使用三段式上下文预算（摘要前缀 + 原文区 + 检索区），由压缩触发线动态控制原文区上限——当对话累计长度接近触发线时自动压缩早期对话为摘要前缀，不再需要硬性消息数截断。详见「故事模式原理 → 上下文预算」。
    section5Title: 上下文预算
    section5Body: >-
      控制原文区下限和检索区比例两个参数。原文区下限（null=动态计算，非 null=自定义比例）保证近期对话至少保留多少比例不被压缩；检索区比例控制从记忆库检索多少上下文注入（0=完全关闭检索，0.15=默认）。两个参数都可会话级覆盖全局配置。详见「故事模式原理 → 上下文预算」。
    section6Title: 工具调用
    section6Body: 控制 AI 提取关键词和生成摘要时的输出格式。默认启用（兼容性更好），遇到不支持工具调用的模型时可关闭，AI 会直接输出 JSON 文本。
    section7Title: 审查阶段
    section7Body: >-
      开关第二道生成阶段。关闭时生成即最终（3 次 AI 请求），开启后在生成内容基础上再做一次审查修订（4 次 AI 请求）。开启会提升质量但增加成本和延迟。思考预算仅在此阶段和生成阶段生效，其他阶段不消耗思考预算。详见「故事模式原理 → 审查阶段」。
    section8Title: 推荐回复
    section8Body: >-
      为本会话单独覆盖推荐回复的模型和提示词。模型留空时自动用生成阶段的模型，所以不配也能用。详见「推荐回复与输入助手」。
    section9Title: 记忆管理
    section9Body: 记忆管理位于会话设置顶部。它显示两类待补齐记忆的数量：达到向量化重要性阈值但尚无 embedding 的记忆，以及已向量化但与当前嵌入模型维度不匹配的记忆（换嵌入模型后出现）；重建会逐条调用嵌入模型 API，并可进入记忆库查看或编辑记录。
    section10Title: 角色卡/世界书
    section10Body: >-
      应用导入的角色卡与世界书：从资源库选择并应用，作为只读「种子」设定参与世界运转，显示「已应用 N 个实体」，可随时取消应用。应用后的内容作为只读基线参与运转，AI 的剧情变化会以独立「演变」条目与基线并存（记忆库中有基线/演变行级徽标）。详见「角色卡与世界书（资源库）」条目。
    # 失败状态下可修改
    failedEditTitle: 失败状态下可修改配置
    failedEditBody: 故事模式失败后允许修改模型、温度等配置后再重试。只有 idle 和 failed 状态下可编辑，生成中无法修改（避免配置变更导致状态不一致）。

  # ── 第三部分 3.8：推荐回复与输入助手（2026-07-29 新增）──
  storySuggestReplyWiki:
    title: 推荐回复与输入助手
  storySuggestReply:
    intro: 故事模式输入框上方有一行小按钮，帮你处理「打字麻烦」和「不知道怎么接话」两个痛点。前两个是符号按钮（引号、括号），第三个是 AI 推荐回复——会根据当前剧情生成 3 条候选给你选。
    # 主视觉
    diagramTitle: 输入框上方的工具栏
    diagramSubtitle: 3 个按钮左对齐，随时可用
    # 示意图标注
    diagramToolbarTitle: 工具栏 3 按钮
    btnQuote: 添加引号
    btnParen: 添加括号
    btnSuggest: 推荐回复
    # 引号与括号
    symbolsTitle: 引号与括号按钮
    symbolsBody: 写故事时经常要输入对话（"…"）或旁白注释（…）。点一下按钮，就会在光标位置插入一对英文引号或英文括号，光标会自动跳到中间，直接打字就行。比手切键盘切符号快很多。
    # 推荐回复基础
    suggestIntroTitle: 推荐回复按钮
    suggestIntroBody: 不知道怎么接话，或者想偷懒时，点「推荐回复」按钮。AI 会读取最近一轮对话（你的上一句 + AI 的回复），加上前两轮的剧情摘要，生成 3 条候选回复浮在输入框上方。点其中一条就填进输入框，可以直接发送，也可以再改改。
    # 生成中
    generatingTitle: 生成中
    generatingBody: 点按钮后，工具栏会显示「正在生成中…」的小动画。AI 只读最近一轮对话和前两轮摘要，所以很省 token，通常几秒就出结果。生成期间你仍然可以打字、点其他按钮。
    # 候选气泡
    bubblesTitle: 候选气泡的操作
    bubblesBody: 3 条候选回复会以浮动气泡形式纵向排列在输入框上方。每条气泡点击后会填进输入框（覆盖原内容）。气泡可以折叠收起（点头部「推荐回复」一栏的折叠按钮），也可以点叉号关闭。发送消息后气泡会自动消失——因为这一轮已经结束了。
    # 生命周期
    lifecycleTitle: 气泡什么时候消失
    lifecycleBody: 气泡不会因为你切换页面、滚动历史消息、或者点开设置而消失。只要还在当前对话轮次（你还没发送消息），气泡就一直在，可以反复切换候选。只有三种情况会清空气泡：发送消息、点叉号关闭、或者切换到别的对话。
    # 配置
    configTitle: 推荐回复的配置
    configBody: 推荐回复用什么模型、提示词、温度、字数都可以配。在「设置 → 故事模式 → 推荐回复」里能改全局默认；在某个对话的「会话设置 → 推荐回复」区段可以为这个对话单独覆盖。模型留空时会自动用生成阶段的模型，所以不配也能用。
    # 省token
    tokenTitle: 为什么很省 token
    tokenBody: 推荐回复只读最近 1 轮完整对话和前 2 轮摘要，不读取全部历史。当前默认生成 3 条候选，共用 600 token 上限，单条最多 150 字；候选数、token 和单条字数都可在设置中调整。

  # ── 第三部分 3.7：记忆库浏览器（2026-07-27 新增）──
  memoryBrowserWiki:
    title: 记忆库浏览器
  memoryBrowser:
    intro: 记忆库是故事模式的「大脑」——所有 AI 自动提炼的经历和事实都存在这里。你可以随时查看、搜索、编辑或删除任何一条记忆。
    # 主视觉
    diagramTitle: 双 Tab + 完整 CRUD
    diagramSubtitle: 经历类 vs 事实类 + 搜索/新增/编辑/删除
    # 示意图标注
    diagramTabsTitle: 双 Tab 分类
    tabExperience: 经历类记忆
    tabExperienceDesc: 剧情事件，按轮次排列
    tabFactual: 事实类记忆
    tabFactualDesc: 角色/地点/物品的属性
    diagramOpsTitle: 7 种操作
    opSearch: 搜索
    opAdd: 新增
    opEdit: 编辑
    opDelete: 删除
    opMulti: 多选
    opForceInject: 强制注入
    opAiMerge: AI 合并
    # 双 Tab 说明
    tabsTitle: 双 Tab 说明
    tab1Title: 经历类记忆（剧情日记）
    tab1Body: 按对话轮次排列，每轮 1 条微摘要。包含时间/地点/人物/事件/意义/补充 6 字段。宏摘要（macro）是覆盖多轮的聚合版本，会在列表中标注「宏观」标签。
    tab2Title: 事实类记忆（人物卡）
    # 分组清单对齐实际（六类；宠物/NPC 归入角色）
    tab2Body: 按实体（角色/地点/物品/设定/组织/杂项；宠物与 NPC 归入角色）分组展示。每个实体下挂载若干属性，比如「勇者·等级·5」。支持展开实体查看所有属性，可单独编辑或删除某个属性。
    # 4 种操作
    opsTitle: 7 种操作说明
    opsBody: 搜索：在当前 Tab 内按关键字过滤记忆。新增：手动添加经历或实体。编辑：修改记忆内容（重要性、事件描述等）。删除：删除单条记忆，需二次确认，不可恢复。多选：批量勾选整理。强制注入：勾选后该实体每轮必进上下文，不再依赖检索评分。AI 合并：在事实 Tab 勾选 2 条以上重复实体，AI 生成整合方案供预览确认，确认后规范条目更新、其余归档（可恢复）。只读资源（世界书/角色卡投影）不可编辑删除，仅可取消应用；属性行分「基线」（只读）与「演变」（AI 随剧情新增），「新增属性」会落为演变行；被 AI 归档的实体可从菜单恢复。实体卡徽标：「来源」=种子出身或 AI 自动提取，「常驻·世界/常驻·指令」=每轮必进上下文；菜单「停用注入」可暂时不参与上下文（浏览与检索不受影响），可恢复。记忆索引健康条提示「缺行」与「嵌入维度不匹配」两类缺口，均可一键重建补齐，索引完整时自动隐藏。经历 Tab 顶部「全部/活跃/已归档」三档筛选（归档记忆不参与检索）。
    # 进入入口
    entryTitle: 怎么进入记忆库
    entryBody: 在故事或导演会话页右上角打开菜单并进入「会话设置」，顶部就是「记忆管理」区段；点击「查看记忆库」即可进入独立全屏页面。两种模式共用同一记忆库。

  # ── 5.1 API 供应商管理（2026-07-27 新增）──
  apiProviderWiki:
    title: API 供应商管理
  apiProvider:
    intro: API 供应商是提供 AI 模型服务的平台（比如 OpenAI、DeepSeek）。你需要先添加一个供应商并填入 API Key，才能在对话中使用 AI 模型。
    # 主视觉
    diagramTitle: 内置模板 + 自定义创建
    diagramSubtitle: 7 个内置模板 + 2 步自定义流程
    diagramBuiltinTitle: 7 个内置模板
    builtinOpenAI: OpenAI
    builtinDeepSeek: DeepSeek
    builtinOpenRouter: OpenRouter
    builtinClaude: Anthropic Claude
    builtinGemini: Google Gemini
    builtinNvidia: NVIDIA NIM
    builtinAgnes: Agnes AI
    builtinCustom: 自定义
    diagramCustomTitle: 自定义 2 步流程
    customStep1: 选模板或自定义
    customStep1Desc: 选模板只填名称即可
    customStep2: 命名 + 创建
    customStep2Desc: 协议从模板继承
    # 步骤说明
    stepsTitle: 供应商详情页 5 个区块
    step1Title: 名称
    step1Body: 供应商显示名称，可随时修改。
    step2Title: 协议
    step2Body: 创建后锁定不可修改。内置供应商继承模板；自定义时可选 4 类协议：OpenAI 兼容、OpenAI Responses、Anthropic、Gemini。GPT-6 系模型的工具调用须选 OpenAI Responses。
    step3Title: API Host
    step3Body: 供应商服务地址。内置供应商已预填，自定义时需手动填写。开启手动模式后可输入完整 URL。
    step4Title: API Key
    step4Body: 从供应商官网获取密钥并仅在本机保存。点「测试连接」会请求该供应商的模型列表来验证地址和凭据，不消耗生成 Token；部分非标准手动端点可能不支持此请求。
    step5Title: 高级参数
    step5Body: 面向高级用户的协议特有参数（如 thinking、thinkingConfig、extra_headers），以 JSON 对象透传给出网适配器。留空表示无自定义参数；重置供应商为模板默认值时会一并清空。普通用户无需理会。
    # 模型管理
    modelsTitle: 模型管理
    modelsBody: 每个供应商下可管理多个模型。点「获取模型列表」从供应商拉取，或点「+」手动添加。拉取后可勾选要保留的模型，避免数百个模型挤满列表。
    # 入口
    entryTitle: 怎么进入
    entryBody: 设置 → 通用设置 → 供应商 → 进入供应商列表 → 点「+」新建 / 点列表项进入详情。

  # ── 5.2 模型选择策略（2026-07-27 新增）──
  modelStrategyWiki:
    title: 模型选择策略
  modelStrategy:
    intro: 模型选择决定 AI 用哪个模型回复你。LMStory 支持全局默认 + 会话级覆盖 + 故事模式 4 步骤独立配置，灵活适配不同场景。
    # 主视觉
    diagramTitle: 3 层模型配置
    diagramSubtitle: 全局默认 → 会话级覆盖 → 故事 4 步骤
    diagramLayersTitle: 3 层优先级
    layer1Label: 全局默认
    layer1Desc: 所有新会话的起点
    layer2Label: 会话级覆盖
    layer2Desc: 单个会话特殊配置
    layer3Label: 故事 4 步骤
    layer3Desc: 每步独立模型
    diagramStoryTitle: 故事模式 4 步骤
    storyGenerating: 生成
    storyExtracting: 提取
    storyReviewing: 审查
    storySummarizing: 摘要
    # 步骤说明
    stepsTitle: 3 种配置入口
    step1Title: 对话模式默认模型
    step1Body: 设置 → 对话模式设置 → 默认模型。所有对话模式新会话都会使用此模型，未配置时自动选第一个有 chat 能力的供应商。
    step2Title: 故事模式 4 步骤模型
    step2Body: 设置 → 故事模式设置 → 模型配置。生成/提取/审查/摘要可独立配置；会话级优先于全局同阶段，未配置的阶段复用当前有效的 extracting/generating 模型。两者都不可用时才会报 E010。
    step3Title: 会话级覆盖
    step3Body: 在聊天页点会话标题菜单 → 会话设置。每个字段右侧有「重置为全局当前值」按钮，点击后用当前全局值覆盖会话级字段。导演会话同理；导演会话设置里另有「主模型」——导演自主执行用的模型，未单独配置时使用全局「生成」模型。
    # 嵌入模型
    embeddingTitle: 嵌入模型
    embeddingBody: 故事模式特有的独立模型，用于将记忆转为向量以支持语义检索。设置 → 故事模式设置 → 模型配置 → 嵌入模型。未配置时降级为关键词检索。
    # 标题模型
    titleModelTitle: 会话标题模型
    titleModelBody: 跨模式共享，专门用于给会话生成标题。未配置时先用当前生成模型生成标题，失败时降级为回复内容前几个字。
    # 入口
    entryTitle: 怎么进入
    entryBody: 对话模式：设置 → 对话模式设置 → 默认模型。故事模式：设置 → 故事模式设置 → 模型配置。

  # ── 4.5 上下文预算（v0.2.2 新增）──
  contextBudgetWiki:
    title: 上下文预算
  contextBudget:
    intro: >-
      故事模式每轮发送给 AI 的内容由三部分组成：摘要前缀 + 原文区 + 检索区。上下文预算就是控制这三部分大小的全局配置。配置得当可以在保证记忆质量的同时控制成本。
    # 主视觉
    diagramTitle: 上下文的三段式结构
    diagramSubtitle: 摘要前缀 + 原文区 + 检索区
    diagramPrefixLabel: 摘要前缀
    diagramPrefixDesc: 压缩后的旧对话摘要
    diagramRecentLabel: 原文区
    diagramRecentDesc: 最近几轮原文
    diagramRetrievalLabel: 检索区
    diagramRetrievalDesc: 检索到的相关记忆
    param1Title: 压缩触发线
    param1Body: >-
      当对话累计长度达到「单次请求 Token 上限 × 压缩触发线」时自动触发压缩。默认 0.5，比如上限 8000、触发线 0.5，则累计到 4000 token 时压缩。值越大越晚压缩（保留更多原文），值越小越早压缩（更省 token 但记忆更早变成摘要）。
    param2Title: 原文区下限
    param2Body: >-
      压缩后保留的最近原文最少占「单次请求 Token 上限」的比例。比如上限 8000、下限 0.3，则至少保留 2400 token 的最近原文。留空时显示「动态」，由系统根据剩余空间自动调整。
    param3Title: 检索区比例
    param3Body: >-
      检索区占「单次请求 Token 上限」的比例。比如上限 8000、检索区 0.15，则检索区最多 1200 token。下限为 0，设为 0 表示完全关闭检索（只靠原文和摘要）。关闭检索会显示红色警告——故事模式将失去记忆召回能力，只记得摘要和最近原文里提到的事。
    # effectiveContextLimit
    limitTitle: 单次请求 Token 上限
    limitBody: >-
      三个比例的计算基准。留空时使用模型窗口大小，实际生效值取配置值与模型窗口的较小者。建议设置为模型 TPM 限制的 80% 左右，避免触发 429 限流。
    # 配置入口
    entryTitle: 怎么配置
    entryBody: >-
      全局配置：设置 → 故事模式设置 → 上下文预算。会话级覆盖：会话设置 → 上下文预算区段，每个参数可单独覆盖全局值，重置按钮把该参数写为当前全局值的快照（此后改全局不影响该会话）。
    # 上下文用量与手动压缩
    usageTitle: 上下文用量与手动压缩
    usageBody: >-
      故事模式输入区工具栏末端有一个圆环，实时显示最近的上下文用量：环的满刻度是压缩触发线（不是模型窗口），用量接近满刻度时自动压缩就会触发。点开圆环可查看窗口用量、缓存命中率、最近请求的 token 明细；对话太短时按钮提示暂不值得压缩，生成中按钮置灰。详情面板底部的「立即压缩」可不等触发线提前手动压缩——摘要会流式生成，完成后旧对话被一条前情摘要替代，与新对话合并展示。压缩摘要卡展开后有「撤销压缩」：被归档的旧对话完整恢复、摘要删除，多次压缩逐次回剥。导演模式的输入区有同一个圆环，口径一致（导演侧该旋钮称为「上下文压缩阈值」）。

  # ── 4.6 审查阶段（v0.2.2 新增）──
  finalReviewWiki:
    title: 审查阶段
  finalReview:
    intro: >-
      审查阶段是故事模式六步生成流程中的可选阶段。开启后，生成完毕会多一次 AI 审查调用，检查事实一致性后再输出最终回复。关闭时生成即最终，省一次 AI 调用。
    # 主视觉
    diagramTitle: 开启 vs 关闭的区别
    diagramSubtitle: 3 次 AI 请求 vs 4 次 AI 请求
    diagramOffTitle: 关闭审查阶段（3 次 AI 请求）
    # 步骤序对齐管线真实顺序
    # （提取→检索→生成，extracting 前置）——此前把「生成」
    # 排在最前，暗示「先写正文再查资料」。
    offStep1: 关键词提取 + 检索
    offStep2: 生成
    offStep3: 事件摘要 + 入库
    diagramOnTitle: 开启审查阶段（4 次 AI 请求）
    onStep1: 关键词提取 + 检索
    onStep2: 生成
    onStep3: 审查阶段（检查事实一致性）
    onStep4: 事件摘要 + 入库
    # 开关作用
    toggleTitle: 开关的作用
    toggleBody: >-
      开启审查阶段后，生成完毕会增加一次审查调用：AI 会对比生成内容与检索到的记忆，检查是否有事实冲突（比如角色等级、地点、时间等设定是否一致）。发现冲突时会修正后输出最终回复。关闭时生成内容直接作为最终回复，速度更快、成本更低，但可能保留事实漂移。
    # 与思考预算的关系
    budgetTitle: 与思考预算的关系
    budgetBody: >-
      思考预算（reasoningEffort）作用于生成和审查阶段两个阶段。开启审查阶段后，审查阶段也会消耗思考预算——审查更深入但更慢更贵。关闭审查阶段时，思考预算只作用于生成阶段。关键词提取、事件摘要等结构化任务阶段始终不消耗思考预算。
    # 配置建议
    adviceTitle: 什么时候开启
    adviceBody: >-
      重视设定一致性、玩长线故事时建议开启——审查能拦截大部分事实漂移。追求响应速度、或使用便宜小模型时可以关闭。会话级可在会话设置中单独覆盖全局开关。
    # 配置入口
    entryTitle: 怎么配置
    entryBody: >-
      全局配置：设置 → 故事模式设置 → 审查阶段。会话级覆盖：会话设置中「审查阶段」开关，可选择「使用全局设置」「开启」「关闭」；选「使用全局设置」会把当前全局值写为该会话的快照（此后改全局不影响该会话）。

  # ── 5.8 生成参数（v0.2.2 新增）──
  generationParamsWiki:
    title: 生成参数
  generationParams:
    intro: >-
      生成参数控制 AI 写回复时的「风格」。LMStory 把这些参数集中在一个全局配置页，会话级可单独覆盖。重要：这些参数只作用于生成和审查阶段两个阶段，关键词提取、事件摘要等结构化任务阶段使用固定参数，确保输出稳定。
    # 主视觉
    diagramTitle: 5 个生成参数
    diagramSubtitle: 都只作用于生成和审查阶段
    param1Title: 温度（temperature）
    param1Body: >-
      控制随机性。0 = 完全确定（每次回复几乎一样），2 = 非常随机。故事模式建议 0.7-0.9，既有创意又不会跑偏。温度越高剧情越出人意料，越低越稳定可预测。
    param2Title: Top P（核采样）
    param2Body: >-
      与温度类似的随机性控制，但更稳定。只从概率累计达到 P 的候选词里采样。1.0 = 不限制，0.1 = 只从最可能的 10% 候选词里选。通常和温度二选一调整，不需要同时改。
    param3Title: 最大 Token 数（maxTokens）
    param3Body: >-
      单次回复的最大长度上限，默认 8192。这是上限不是目标——AI 会在合理位置自然结束。设为 0 时 LMStory 不添加应用层输出上限，实际长度仍受模型和供应商限制。若模型 TPM 紧张可适当调低。
    param4Title: 存在惩罚（presencePenalty）
    param4Body: >-
      鼓励 AI 聊新话题。0 = 不惩罚，正值 = 已经出现过的内容会被打压。默认 0（主流新模型已弃用惩罚参数，发了也不生效；仍在用老模型或私有部署时可按需调高）。调低则剧情更连贯但可能重复，调高则更多新话题但可能跳跃。
    param5Title: 频率惩罚（frequencyPenalty）
    param5Body: >-
      减少 AI 重复用词。0 = 不惩罚，正值 = 高频词会被打压。默认 0（主流新模型已弃用惩罚参数，发了也不生效；仍在用老模型或私有部署时可按需调高）。调低用词更丰富但可能重复，调高用词更多样但可能生硬。
    # 作用范围
    scopeTitle: 作用范围（重要）
    scopeBody: >-
      这 5 个参数只作用于生成和审查阶段。关键词提取、事件摘要、宏摘要等结构化任务阶段使用固定参数（温度 0、无惩罚），确保 JSON 输出格式稳定、不漂移。所以调整这些参数不会影响记忆质量，只会影响最终回复的文风。
    # 配置入口
    entryTitle: 怎么配置
    entryBody: >-
      全局配置：设置 → 故事模式设置 → 生成参数。会话级覆盖：会话设置 → 生成参数区段，每个参数可单独覆盖全局值。

  # ── 5.3 提示词模板系统（2026-07-27 新增）──
  promptTemplateWiki:
    title: 提示词模板系统
  promptTemplate:
    intro: 提示词模板是预设的系统提示词，可复用避免每次重写。比如保存一个「翻译助手」模板，新建会话时一键应用。
    # 主视觉
    diagramTitle: 2 种可用类型 + CRUD 操作
    diagramSubtitle: 系统提示词 / 压缩模板
    diagramTypesTitle: 2 种可用模板类型
    typeSystem: 系统提示词
    typeSystemDesc: 对话模式系统提示词
    typeConsolidation: 压缩模板
    typeConsolidationDesc: 事件摘要合并用
    diagramOpsTitle: 4 种操作
    opCreate: 新增
    opEdit: 编辑
    opCopy: 复制
    opDelete: 删除
    # 步骤说明
    stepsTitle: 模板管理操作
    step1Title: 创建模板
    step1Body: 点右下角「+」按钮，输入名称、选类型、写内容。名称必填，类型创建后不可修改。
    step2Title: 编辑模板
    step2Body: 点模板卡片的「编辑」按钮。内置模板可编辑但不可删除，编辑时显示「内置模板」提示。
    step3Title: 复制模板
    step3Body: 点「复制」按钮创建副本，名称自动加后缀。适合基于内置模板快速创建自定义版本。
    step4Title: 删除模板
    step4Body: 点「删除」按钮，仅自定义模板可删除。内置模板不显示删除按钮。
    # 内置模板
    builtinTitle: 内置模板
    builtinBody: 初始化时自动创建，标记「内置」徽章。不可删除但可编辑或复制创建自定义版本。
    # 应用模板
    applyTitle: 怎么应用模板
    applyBody: 在会话设置面板的系统提示词字段，可从 systemPrompt 类型模板中选择。故事模式的 10 段提示词在故事模式设置页单独管理。
    # 入口
    entryTitle: 怎么进入
    entryBody: 设置 → 提示词模板，进入列表后可编辑或复制内置模板。

