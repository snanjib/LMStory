  data:
    title: 数据管理
    # 入口副标题专用键（原借用 export 动作文案）
    entrySubtitle: 备份、恢复与存储概览
    export: 导出数据
    exportDesc: 导出会话、供应商或偏好
    import: 导入数据
    importDesc: 从 JSON 文件导入数据
    #  备份完整性立项：自动备份区段
    autoBackup:
      title: 自动备份
      desc: 启动后自动备份到本机（不含 API Key，保留最近 3 份）
      # 行为说明，口径与 AutoBackupManager 实际
      # 行为一致——启动时检查、距上次备份超 24h 且有会话数据才执行、长驻进程
      # 每 6h 周期补查（行为 /  文案补齐）、文档目录 backups/、
      # 不含 API Key、滚动保留 3 份
      hint: >-
        开启后，应用启动时以及长期驻留期间每 6 小时会自动检查：距上次备份超过 24 小时且有会话数据才备份一次。备份存于应用数据目录的 backups/ 文件夹，不含 API Key，保留最近 3 份。不需要时关闭上方开关即可。
      # 醒目提示行（warning 色加粗）：沙盒目录不可见 + 迁移指路
