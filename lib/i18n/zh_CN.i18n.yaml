        other: "API 层面的总 token 硬限制，$count 条候选共用的上限，防止输出过长被截断"
      candidateCount: 候选数量
      candidateCountHint: 一次生成的候选回复条数（1-5）
      maxReplyLength: 单条最大字数
      maxReplyLengthHint: 在提示词中告诉 AI 每条回复不超过多少字，控制单条质量。与最大 Token 数互补：Token 数是 API 兜底，字数是提示词层控制。
      modelSaved: 推荐回复模型已更新
      modelCleared: 已恢复使用生成模型
