    deleteSummaryFailed: 删除摘要失败，请稍后重试
    editSummaryFailed: 编辑摘要失败，请稍后重试
    # 生成中删除会话会向已删会话回写孤儿数据
    deleteBlockedWhileGenerating: 该会话正在生成，请先停止后再删除
    # 忙态操作（重生成/编辑重发/摘要编辑/手动压缩）
    # 此前 controller 守卫静默 no-op，点击无任何反馈——统一 floating
    # SnackBar 提示（与 insufficient 同款节奏）
    busyOperation: 正在生成或压缩中，请稍后再试
    # 错误码可操作建议（2026-07-20 新增）
    # 与 messages 区分：messages 描述"发生了什么+一般提示"，suggestedActions 给出"具体可操作步骤"
    suggestedActions:
      config: 前往「设置」检查 API 供应商、模型 ID 和 API Key
      network: 切换 Wi-Fi/移动数据，或重启路由器后重试
      auth: 前往「设置」确认 API Key 是否有效，必要时重新生成
      rateLimit: 等待 1 分钟后重试，或降低请求频率
      server: 等待 5 分钟后重试，如持续异常请联系供应商
      timeout: 切换更快的模型，或检查网络稳定性
      format: 重试，或切换到其他模型
      persist: 清理设备存储空间后重试
      unknown: 重试，如持续失败请反馈
    # 错误卡片中"建议"行的前缀标签
    suggestionLabel: 建议
    # 2026-07-29：错误卡片中"详细信息"行的前缀标签（可折叠区域）
    detailLabel: 详细信息
    displayFormat: "$message（$code）"
    # 完整展示格式（含建议行），持久化到 ChatMessage.error 字段
    displayFormatWithSuggestion: "$message（$code）\n$suggestionLabel：$suggestion"
    # 2026-07-29：含详细信息的完整展示格式（建议行 + 详细信息行）
    # 详细信息来自供应商返回的原始错误，帮助用户定位 400 参数错误等具体原因
    displayFormatWithDetail: "$message（$code）\n$suggestionLabel：$suggestion\n$detailLabel：$detail"

