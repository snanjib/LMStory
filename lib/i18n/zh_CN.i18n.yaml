    # 版本详情
    v01Title: v0.1 对话模式（已交付）
    v01Body: 类 ChatBox 的自由对话工具。核心交付：流式对话、会话管理（创建/删除/收藏/排序/搜索）、CompactionPoint 压缩、Fork 分支、会话级参数覆盖、模板系统、思考预算、附件上传、数据导入导出。基础设施：SSE 流式解析、OpenAI 兼容 API 客户端、drift 数据库、flutter_secure_storage、主题与 UI 基础组件。
    v02Title: v0.2 故事模式（已交付）
    v02Body: 当前故事模式包含 extracting/retrieving/generating/reviewing/summarizing/persisting 流程、经历记忆与 FTS5+Vector 检索、事实层实体/属性/审计三表、累积压缩摘要与分段宏摘要、5W1E、记忆库、诊断和增量表修复。当前有 7 个供应商模板，已实现 OpenAI-compatible、OpenAI Responses、Anthropic、Gemini 四类协议（Responses 于 2026-11-02 落地，GPT-6 系模型的工具调用须走该协议）。
    v03Title: v0.3 导演模式
    v03Body: 导演模式：AI 总编辑按项目规则在幕后自主检索记忆、维护设定并撰写正文，正文是唯一成果。已实现项目规则、主模型与分阶段模型、每轮步数/时间预算与软着陆、监督模式（逐项审批写入，支持「本会话总是允许」）、请示导演、台前/幕后过程分层（轮时间线+单一折叠组）、幕间回顾卡、事件日志与重启恢复、技能手记、子代理、记忆库实体归并（重复实体 AI 合并）、独立设置体系（全局设置页+会话面板、三态工具权限）、剧情节奏三档、上下文用量指示（环形+手动压缩）。复用故事模式记忆基础，无独立 HUD；旧 HUD 蓝图已废弃。另交付世界书/角色卡资源库（SillyTavern 兼容导入）。后续持续补全导演体验：稿件变体、稿件导出、剧情锚编辑、场记板视图、纯净阅读与轮中预算进度；上下文配置收敛为单一「上下文压缩阈值」旋钮（百分比⇄token 双显示）取代三比例暴露面，窗口上限降级高级覆盖；会话配置全量快照化（重置=新建=复制全局当前值，存量会话打开时自动物化）。
    # 重要节点
    milestonesTitle: 重要节点
    milestones:
      - 2026-11-03 导演请求时限与全过程反馈：首响应及非流式完成时限可独立配置，取消贯穿请求；思考、发言和工具步骤按到达顺序展示，成功轮的警告与错误工具卡可折叠查看
      - 2026-11-02 过时采样参数全局处理：Kimi K 系与 moonshot 官方端点双保险停发采样参数；Gemini 原生协议全局停发并补 gemini-4 思考分支；o 系判定单源化；故事/导演模式惩罚参数默认值降 0（已物化会话不动）；压缩/标题/记忆整合/事实合并/世界设定六处内部调用温度统一为可配置键并遵守停发判定
      - 2026-11-02 OpenAI Responses 协议上线 + API 兼容性审计修复批：openaiResponses 从占位枚举转正（GPT-6 系模型的工具调用须走 Responses）；GPT-5/GPT-6 系不再发送采样参数；Gemini 3 思考签名（thought part）多轮原样回传
      - 2026-11-02 严格中转站采样参数兼容：新增供应商级「不发送采样参数」开关与模型名归一化启发式（Claude Sonnet 5/5.5、Opus 4.7+、o-series、reasoner），三个协议适配器与压缩温度统一接入；无数据库迁移
