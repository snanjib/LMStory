    editorScene: 使用场景
    editorSceneDesc: 灯泡图标 + 说明
    editorDefault: 默认值预览
    editorDefaultDesc: 对比查看
    # 步骤说明
    stepsTitle: 10 段提示词说明
    step1Title: 默认角色设定
    step1Body: 故事开篇的 AI 角色定位，所有步骤共享。决定 AI 用什么口吻讲故事。
    step2Title: 生成后缀
    step2Body: generating 步骤的提示词，控制纯文本生成的风格。
    step3Title: 关键词提取
    step3Body: extracting 步骤的提示词，控制如何从对话中提取关键词。工具调用模式。
    step4Title: 审查后缀
    step4Body: reviewing 步骤的提示词，控制纯文本回复的审查风格。
    step5Title: 事件摘要
    step5Body: summarizing 步骤的提示词，控制每轮事件摘要的生成。工具调用模式。
    step6Title: 宏摘要
    step6Body: 覆盖多轮的聚合摘要，控制长剧情的整体回顾风格。
    step7Title: 生成内容注入前缀
    step7Body: reviewing 步骤中生成内容注入到回复生成时的前缀。
    step8Title: 记忆注入标题
    step8Body: reviewing 步骤中检索到的记忆注入时的标题。
    step9Title: 事实提取
    step9Body: summarizing 步骤提取实体与属性变更时使用的工具提示词。
    step10Title: 世界设定注入标题
    step10Body: generating/reviewing 请求中注入当前事实设定时使用的区块标题。
    # 预览
    previewTitle: 拼接预览
    previewBody: 点底部「预览拼接效果」按钮，可查看 六步生成中实际发送给 AI 的完整 messages 列表，使用 mock 数据展示。
    # 修改检测
    dirtyTitle: 修改检测
    dirtyBody: 编辑器中文字与已保存值不一致时，「保存」按钮才可点击。未保存离开会弹确认对话框，避免误操作丢失修改。
    # 入口
    entryTitle: 怎么进入
    entryBody: 设置 → 故事模式设置 → 提示词模板 → 进入 10 段列表 → 点任一段进入编辑器（「提示词模板」卡在「配置显示模式=进阶」下可见，开关位于设置 → 通用页底）。

  # ── 5.5 外观与主题（2026-07-27 新增）──
  appearanceWiki:
    title: 外观与主题
  appearance:
    intro: LMStory 外观由三根轴自由组合：主题结构（经典 / 琉璃 / 印刻 / 漫游）× 配色族（经典 / 波尔多）× 主题模式（深色 / 浅色 / 跟随系统），另有 12–22 共 11 档字体大小。设置即时生效，无需重启。
    # 主视觉
    diagramTitle: 外观三轴 + 字体 11 档
    diagramSubtitle: 结构×配色×深浅 任意组合 + 12-22 px
    diagramThemeTitle: 3 种主题模式
    themeDark: 深色
    themeDarkDesc: 夜间护眼
    themeLight: 浅色
    themeLightDesc: 日间清晰
    themeSystem: 跟随系统
    themeSystemDesc: 自动切换
    diagramFontTitle: 字体大小 11 档
    fontMin: 12 px
    fontMinDesc: 紧凑
    fontDefault: 15 px
    fontDefaultDesc: 默认值
    fontMax: 22 px
    fontMaxDesc: 大字
    # 步骤说明
    stepsTitle: 3 个设置区块
    step1Title: 主题结构与配色族
    step1Body: 结构四选一：经典（清晰平面）/ 琉璃（柔和材质）/ 印刻（利落描边与按压）/ 漫游（叙事展厅）。配色二选一：经典 / 波尔多（酒红）。结构、配色与深浅可自由组合，切换后即时生效。
    step2Title: 主题模式
    step2Body: 三选一：深色（夜间护眼）/ 浅色（日间清晰）/ 跟随系统（自动切换）。故事与导演会话跟随全局明暗，不再有独立的「夜航主题」。
    step3Title: 字体大小
    step3Body: 滑块调节 12-22 px 共 11 档，默认 15 px，对三种模式的消息正文统一生效。等于默认值时显示「默认」徽章，下方实时预览。
    # 无障碍与大屏
    a11yTitle: 无障碍与大屏
    a11yBody: 减弱动态跟随系统开关（动效集中降级）；桌面端键盘焦点环可见、纯图标按钮带可读名；宽窗口下内容列自动收窄居中（版心），叙事正文限宽保护阅读节奏；桌面快捷键单源注册（Ctrl+N 新对话、Ctrl+Shift+N 新故事（开启故事模式入口后生效）、Ctrl+, 设置、Ctrl+K 全局搜索、Ctrl+F 会话内搜索，浮层内 Esc 逐层关闭）。
    # 入口
    entryTitle: 怎么进入
    entryBody: 设置 → 通用设置 → 外观。

