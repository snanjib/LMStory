      genre:
        xianxia: 这是一个东方修仙世界：灵气充盈，宗门林立，凡人可凭修炼问鼎长生。境界分明的修为体系、宗门恩怨、天材地宝与心魔劫数构成世界的运行逻辑。
        isekai: 这是一个日式异世界：魔法与剑共存，冒险者公会成为秩序的枢纽，魔王与勇者的传说仍在流传。职业体系、队伍羁绊与大陆危机构成世界的运行逻辑。
        scifi: 这是一个科幻未来世界：星际殖民与人工智能重塑了生活，赛博都市的霓虹下数据即权力。大公司、义体改造与深空未知构成世界的运行逻辑。
        wuxia: 这是一个武侠江湖世界：武功与道义并重，门派与朝廷角力，快意恩仇的故事在市井与山门间流转。江湖规矩、绝学传承与恩怨情仇构成世界的运行逻辑。
        urban: 这是一个都市现实世界：故事发生在当下的城市，写字楼、街巷与人情往来就是舞台。现实的社会规则、日常选择与人物关系构成世界的运行逻辑。
        mystery: 这是一个悬疑诡秘世界：表层日常之下暗流涌动，灵异、推理与不可名状之物在边缘出没。线索、谜团与步步逼近的真相构成世界的运行逻辑。
        apocalypse: 这是一个末世求生世界：旧秩序已经崩塌，幸存者在废墟与稀缺资源间挣扎求存。据点、物资、变异威胁与人性的抉择构成世界的运行逻辑。
        altHistory: 这是一个历史架空世界：似曾相识的朝代与人物，却因某个分歧点走向了不同的历史。庙堂、江湖与时代洪流的碰撞构成世界的运行逻辑。
        courtIntrigue: 这是一个宫廷权谋世界：宫墙之内人人戴着面具，一步棋都可能决定生死。派系倾轧、圣心难测与后朝前朝的博弈构成世界的运行逻辑。
      style:
        plain: 讲述风格白话流畅：像好读的网文，不端着，读起来轻松顺畅。
        literary: 讲述风格文学浓郁：讲究画面感与修辞，在意境和细节上下功夫，但不堆砌辞藻。
        humorous: 讲述风格轻松幽默：叙述会吐槽、有梗，紧张处也不忘趣味，但不消解严肃剧情的分量。
        terse: 讲述风格冷峻凌厉：多用短句，干净利落，信息密度高，不拖泥带水。
        classical: 讲述风格古风雅韵：文白相间，用字考究，有说书人的从容，但不影响可读性。
      person:
        first: 故事以第一人称讲述：由「我」来叙述，写「我」的所见所感与世界的回应。
        second: 故事以第二人称讲述：主角就是『你』，描述你的所见所感与世界对你的回应。
        third: 故事以第三人称讲述：以旁观视角客观描写人物言行与事件全貌。
    # 生成提示词（报告 §5.2 定稿原文）
    genSystem: "你是互动故事的世界设定撰写师。根据用户的世界选择，撰写一段用于驱动互动故事引擎的「项目规则」。\n\n要求：\n1. 只写世界本身与世界如何回应用户：世界规则、讲述风格、（若用户选了人称）叙事视角。不要写「你应该如何回应」「必须如何推进」之类的引擎工作指令（引擎另有规范，写了会冲突）。\n2. 叙事人称按用户选择执行；用户留空则由你决定最合适的人称。\n3. 用户给出的自定义描述必须原意编织进设定，不得遗漏或篡改。\n4. 中文，300-700 字。直接输出正文：不要标题、编号、解释、引言。"
    genUser(genreLabel, genreExtra, styleLabel, styleExtra, person): "我的世界选择：\n题材：$genreLabel（我的补充：$genreExtra）\n文风：$styleLabel（我的补充：$styleExtra）\n人称：$person"
