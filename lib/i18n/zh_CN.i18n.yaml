  storyPromptCustom:
    intro: 故事模式当前有 10 段可自定义提示词，覆盖角色设定、生成、提取、审查、摘要、记忆与事实注入等环节。
    # 主视觉
    diagramTitle: 10 段提示词 + 编辑预览
    diagramSubtitle: 生成流程 + 记忆与事实扩展
    diagramListTitle: 10 段提示词列表
    segDefaultRole: 默认角色
    segGenerate: 生成后缀
    segExtractKw: 关键词提取
    segReview: 审查后缀
    segExtractSummary: 事件摘要
    segMacroSummary: 宏摘要
    segGenerateInject: 生成注入
    segMemoriesInject: 记忆注入
    segExtractFacts: 事实提取
    segFactInject: 世界设定注入
    diagramEditorTitle: 编辑器 3 个区块
    editorField: 编辑区
