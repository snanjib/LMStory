name: 功能请求
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提出功能建议！请详细描述您的想法，帮助我们理解您的需求。

  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 请清晰地描述您希望添加的功能。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 这个功能解决了什么问题？或者满足了什么使用场景？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 您希望这个功能如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 您是否考虑过其他替代方案？为什么选择当前方案？（可选）
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 截图、草图、参考链接等任何有助于说明的信息。（可选）
    validations:
      required: false
