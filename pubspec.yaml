name: lmstory
description: AI-powered interactive storytelling app with self-evolving memory system.
version: 0.4.1

repository: https://github.com/snanjib/LMStory
homepage: https://github.com/snanjib/LMStory
issue_tracker: https://github.com/snanjib/LMStory/issues

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  clock: ^1.1.1
  collection: ^1.18.0
  dio: ^5.4.3+1
  drift: ^2.18.0
  file_picker: ^8.1.4
  flutter:
    sdk: flutter
  flutter_highlighting: ^0.9.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.2+1
  flutter_markdown_latex: ^0.3.4
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^10.3.1
  http: ^1.2.1
  image_picker: ^1.1.2
  json_annotation: ^4.9.0
  meta: ^1.15.0
  path: ^1.9.0
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  shared_preferences: ^2.5.5
  slang: ^4.2.0
  slang_flutter: ^4.2.0
  sqlite3_flutter_libs: ">=0.5.20 <0.7.0"
  tiktoken: ^1.0.3
  url_launcher: ^6.3.1
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  very_good_analysis: ^6.0.0
  yaml: ^3.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/configs/
    - assets/skills/deai-flavor/SKILL.md
    - assets/skills/dialogue-scenes/SKILL.md
    - assets/skills/combat-scenes/SKILL.md
    - assets/skills/suspense-pacing/SKILL.md
    - assets/skills/tabletop-gm/SKILL.md
    - assets/skills/worldbook-style/SKILL.md
    - assets/skills/card-crafting/SKILL.md
    - assets/skills/worldbook-crafting/SKILL.md
    - assets/skills/card-editing/SKILL.md
    - assets/branding/lmstory_logo_v1.png
    - assets/branding/lmstory_logo_v1_dark.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter-BoldItalic.ttf
          weight: 700
          style: italic
    # 阅读字体与 mono 字体（OFL 子集打包，改名避 Reserved Font Name；
    # 管线：tool/fonts/subset_fonts.py，预算守卫：tool/ci_guards/check_font_budget.py）
    - family: LMSerif
      fonts:
        - asset: assets/fonts/LMSerif/LMSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/LMSerif/LMSerif-Medium.ttf
          weight: 500
        - asset: assets/fonts/LMSerif/LMSerif-Italic.ttf
          weight: 400
          style: italic
    - family: LMSerifSC
      fonts:
        - asset: assets/fonts/LMSerifSC/LMSerifSC-Regular.ttf
          weight: 400
    - family: LMMono
      fonts:
        - asset: assets/fonts/LMMono/LMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/LMMono/LMMono-Medium.ttf
          weight: 500
